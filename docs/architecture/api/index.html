  <div id="swagger-ui"></div>
  <script type="application/json" id="openapi-spec">{"openapi": "3.1.0", "info": {"title": "New Finance App API", "version": "1.1.0", "description": "Backend API for the New Finance App \u2014 household finance management: personal & shared budgeting, expense tracking, and manual investment/net-worth tracking. Derived directly from docs/architecture/02-data-model.md (schema), docs/design/diagrams/sequences/ (per-use-case call sequences, HTTP routes, and status codes), and docs/requirements/02-functional-requirements.md (FR numbers referenced throughout). See docs/architecture/03-api-design.md for the design rationale behind every convention below \u2014 this file is the contract, that file is the \"why.\"\nOpen Banking sync (FR-2.5/2.6/3.3) and the FII/Stock Portfolio Builder (CUC-7, FR-5.5/5.6/5.7) are deferred whole and have no endpoints here \u2014 see 02-data-model.md's parked-Accessors note.\n\n\n**1.1.0 \u2014 Oct 2026 review** (`docs/architecture/10-api-review-2026-10.md`): Objectives \u2192 Goals, recurring removed, manual market values + index rates, fixed v1 reports under `/reports`, merged transaction browsing with cursor pagination, error envelope with namespaced codes + params (OQ-83), notifications as type + params (OQ-82). Deferred operations carry `x-deferred`."}, "servers": [{"url": "/api/v1", "description": "All endpoints below are relative to this base path."}], "security": [{"bearerAuth": []}], "tags": [{"name": "Auth", "description": "Registration, login, session/password/MFA lifecycle. FR-1, CUC-2."}, {"name": "Households", "description": "Household creation, membership, invitations, ownership. FR-1, CUC-1."}, {"name": "Accounts", "description": "Financial Accounts and Credit Cards. FR-2, CUC-3."}, {"name": "Categories", "description": "Category/Subcategory taxonomy. FR-10."}, {"name": "Budgets", "description": "Budgets, targets, and periods. FR-4, CUC-5."}, {"name": "Investments", "description": "Investment Holdings, Valuation Snapshots, schedule entries. FR-5, FR-11, CUC-6."}, {"name": "Goals", "description": "Goals (formerly Objectives \u2014 OQ-66): create, edit, complete/reopen, delete, progress."}, {"name": "Transactions", "description": "Account Transactions and Card Transactions \u2014 record, edit, delete, browse & filter. FR-3, CUC-4."}, {"name": "Insights", "description": "Dashboard, reports, notifications. FR-6, CUC-8."}, {"name": "Audit", "description": "Audit log export. FR-7, CUC-9."}, {"name": "Reports", "description": "Fixed v1 report types (month-overview, investments-overview, payouts); ad-hoc types and CSV export are v2 (OQ-71)."}], "paths": {"/auth/register": {"post": {"tags": ["Auth"], "operationId": "registerUser", "summary": "Register a new user (Create User)", "description": "FR-1.1/FR-1.15. Enrolls TOTP-based MFA and issues recovery codes inline \u2014 an account cannot be used to log in until MFA is enrolled, so this happens as part of registration, not a follow-up step. See docs/design/diagrams/sequences/identity-household/uc-11-create-user.html.\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["email", "password", "firstName", "lastName"], "properties": {"email": {"type": "string", "format": "email"}, "password": {"type": "string", "minLength": 12}, "firstName": {"type": "string"}, "lastName": {"type": "string"}}}}}}, "responses": {"201": {"description": "Created. Recovery codes are returned exactly once and never again.", "content": {"application/json": {"schema": {"type": "object", "properties": {"userId": {"type": "string", "format": "uuid"}, "totpSecret": {"type": "string", "description": "QR-encodable TOTP enrollment secret"}, "recoveryCodes": {"type": "array", "items": {"type": "string"}}}}}}}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/auth/login": {"post": {"tags": ["Auth"], "operationId": "login", "summary": "Login (password + MFA code together)", "description": "FR-1.2/OQ-30. Password and MFA code supplied in one request. The access token is stateless (never persisted); the refresh token is the server-tracked, revocable record backing GET/DELETE /users/me/sessions. See docs/design/diagrams/sequences/identity-household/uc-14-login.html.\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["email", "password", "mfaCode"], "properties": {"email": {"type": "string", "format": "email"}, "password": {"type": "string"}, "mfaCode": {"type": "string"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthTokens"}}}}, "401": {"description": "Invalid email, password, or MFA code \u2014 deliberately identical for all three to avoid leaking which emails are registered.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/auth/logout": {"post": {"tags": ["Auth"], "operationId": "logout", "summary": "Logout (current session only)", "description": "FR-1.9. Terminates the current session only; every other active session/device is unaffected. Idempotent \u2014 logging out an already-terminated session still returns 204.\n", "responses": {"204": {"description": "No Content"}}}}, "/auth/refresh": {"post": {"tags": ["Auth"], "operationId": "refreshTokens", "summary": "Exchange a refresh token for new tokens (rotation)", "description": "OQ-30/OQ-100. Returns a new access token (15 minutes) and a new refresh token (30 days); the presented refresh token is consumed, so each one works once. An unknown, expired, revoked or already-used refresh token is rejected \u2014 and its session is ended (a replayed token suggests theft). No access token needed: this is how a client gets one back after it expires.\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["refreshToken"], "properties": {"refreshToken": {"type": "string"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthTokens"}}}}, "401": {"description": "Code: `auth.refresh_invalid`.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/auth/change-password": {"post": {"tags": ["Auth"], "operationId": "changePassword", "summary": "Change password (authenticated)", "description": "FR-1.14. Requires re-supplying the current password; invalidates every other active session except the one making the change \u2014 contrast with Reset Password, which has no session to spare.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["currentPassword", "newPassword"], "properties": {"currentPassword": {"type": "string"}, "newPassword": {"type": "string", "minLength": 12}}}}}}, "responses": {"200": {"description": "OK"}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/auth/password-reset/request": {"post": {"tags": ["Auth"], "operationId": "requestPasswordReset", "summary": "Request a password reset token (step 1 of 2)", "description": "FR-1.13. Always returns 202 regardless of whether the email matched an account \u2014 the branch is entirely internal, so there is no observable response difference that would leak account existence.\n The reset link is emailed through `NotificationDeliveryUtility`'s email channel as type `password.reset` in the user's language (OQ-84); the token is stored hashed in `password_reset_tokens`.", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["email"], "properties": {"email": {"type": "string", "format": "email"}}}}}}, "responses": {"202": {"description": "Accepted"}}}}, "/auth/password-reset/confirm": {"post": {"tags": ["Auth"], "operationId": "confirmPasswordReset", "summary": "Submit a reset token + new password (step 2 of 2)", "description": "FR-1.13. A valid token invalidates every active session, not just the one making the change (there is no \"current session\" to spare \u2014 the user isn't logged in at all).\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["token", "newPassword"], "properties": {"token": {"type": "string"}, "newPassword": {"type": "string", "minLength": 12}}}}}}, "responses": {"200": {"description": "OK"}, "400": {"description": "Token invalid or expired.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/auth/mfa/recover": {"post": {"tags": ["Auth"], "operationId": "recoverWithMfaCode", "summary": "Log in using a single-use MFA recovery code", "description": "FR-1.16. Requires the correct password too, same as normal login \u2014 this is an alternate second factor, not a full account-recovery mechanism. If recovery codes are also exhausted/lost, there is no further self-service path (OQ-24).\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["email", "password", "recoveryCode"], "properties": {"email": {"type": "string", "format": "email"}, "password": {"type": "string"}, "recoveryCode": {"type": "string"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthTokens"}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/users/me": {"get": {"tags": ["Auth"], "operationId": "getCurrentUser", "summary": "Get the current user's profile", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/User"}}}}}}, "patch": {"tags": ["Auth"], "operationId": "editCurrentUser", "summary": "Edit profile (first/last name) and preferences (theme, language)", "description": "Email and password each have their own dedicated flow \u2014 this endpoint never touches either. See docs/design/diagrams/sequences/identity-household/uc-13-edit-user.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"firstName": {"type": "string"}, "lastName": {"type": "string"}, "preferences": {"$ref": "#/components/schemas/UserPreferences"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/User"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}, "delete": {"tags": ["Auth"], "operationId": "deleteCurrentUser", "summary": "Delete own account (GDPR right-to-erasure)", "description": "FR-1.17/FR-1.18/OQ-25. Unconditional \u2014 no rejection path exists, by design. Personal data (personal Accounts, Budgets, Goals, and everything they own) is hard-deleted; this user's contributions to shared household data are anonymized (actor reference nulled), not deleted. If this user was a household's Owner, FR-1.18's succession runs first, per household. One of the two widest-fan-out flows in the system \u2014 see docs/design/diagrams/sequences/identity-household/uc-12-delete-user.html for the full cascade traced call-by-call.\n", "responses": {"204": {"description": "No Content"}}}}, "/users/me/sessions": {"get": {"tags": ["Auth"], "operationId": "listSessions", "summary": "List active sessions/devices", "description": "FR-1.3.", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Session"}}}}}}}}}, "delete": {"tags": ["Auth"], "operationId": "revokeOtherSessions", "summary": "Sign out all other sessions", "description": "FR-1.3 / OQ-62 \u2014 deletes every session of the current user except the one making this call (same `SessionAccessor.deleteAllExceptCurrent` as Change Password).", "responses": {"204": {"description": "No Content"}}}}, "/users/me/sessions/{sessionId}": {"parameters": [{"$ref": "#/components/parameters/SessionId"}], "delete": {"tags": ["Auth"], "operationId": "revokeSession", "summary": "Revoke a session", "description": "FR-1.3. 404, not 403, for a session belonging to someone else \u2014 deliberately doesn't confirm the session ID exists at all to a non-owner.\n", "responses": {"204": {"description": "No Content"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/users/me/invitations": {"get": {"tags": ["Households"], "operationId": "listMyInvitations", "summary": "List pending invitations addressed to the current user", "description": "FR-1.5/FR-1.10. Only ever shows this user's own pending invitations.", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Invitation"}}}}}}}}}}, "/households": {"get": {"tags": ["Households"], "operationId": "listHouseholds", "summary": "List households the current user belongs to", "description": "FR-1.8 \u2014 a user may belong to more than one household.", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Household"}}}}}}}}}, "post": {"tags": ["Households"], "operationId": "createHousehold", "summary": "Create a household", "description": "FR-1.4. Also seeds the predefined default Category set \u2014 a Manager\u2194Manager effect routed through the Service Bus, invisible at this API layer (fire-and-forget, doesn't block this response). See docs/design/diagrams/sequences/identity-household/uc-01-create-household.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["name"], "properties": {"name": {"type": "string"}}}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Household"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Households"], "operationId": "getHousehold", "summary": "Get a household", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Household"}}}}}}, "delete": {"tags": ["Households"], "operationId": "deleteHousehold", "summary": "Delete a household (Owner only, deliberate dissolution)", "description": "FR-1.7. Owner-only, cascading hard delete of every household-scoped record. Distinct from FR-1.18's auto-delete when the last member leaves (see DELETE .../members/{userId}) \u2014 this is the Owner choosing to dissolve the household outright. See docs/design/diagrams/sequences/identity-household/uc-02-delete-household.html.\n", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}}}}, "/households/{householdId}/members": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Households"], "operationId": "listMembers", "summary": "List household members", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/HouseholdMembership"}}}}}}}}}}, "/households/{householdId}/members/{userId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/UserId"}], "delete": {"tags": ["Households"], "operationId": "removeMember", "summary": "Remove a member, or leave the household yourself", "description": "FR-1.11/FR-1.18/OQ-27. One endpoint, two actor/target relationships: `userId != ` the caller (Remove Member, Owner/Admin only, the Owner can never be removed this way) or `userId ==` the caller (Leave Household, self-service, no authorization check \u2014 if the leaver is the Owner, FR-1.18's succession runs atomically, or the household itself is deleted if no member remains). See docs/design/diagrams/sequences/identity-household/uc-07-remove-member.html and uc-08-leave-household.html.\n", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}}}}, "/households/{householdId}/members/{userId}/role": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/UserId"}], "patch": {"tags": ["Households"], "operationId": "changeMemberRole", "summary": "Change a member's role", "description": "FR-1.12. Owner/Admin only; can never assign or remove the Owner role \u2014 attempting to set role=Owner here is rejected, use Transfer Ownership instead (FR-1.20).\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["role"], "properties": {"role": {"type": "string", "enum": ["Admin", "Member", "Viewer"]}}}}}}, "responses": {"200": {"description": "OK"}, "403": {"$ref": "#/components/responses/Forbidden"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}/transfer-ownership": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "post": {"tags": ["Households"], "operationId": "transferOwnership", "summary": "Transfer ownership to another member", "description": "FR-1.20/OQ-28. Owner-only; a single atomic dual-role swap \u2014 the household is never observably left with zero or two Owners (enforced one layer down by a partial unique index on household_memberships). Distinct from FR-1.18's auto-succession: the transferring Owner remains a member, demoted to Admin, not leaving.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["targetUserId"], "properties": {"targetUserId": {"type": "string", "format": "uuid"}}}}}}, "responses": {"200": {"description": "OK"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/invitations": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Households"], "operationId": "listHouseholdInvitations", "summary": "List this household's invitations", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Invitation"}}}}}}}}}, "post": {"tags": ["Households"], "operationId": "createInvitation", "summary": "Invite a user to the household", "description": "FR-1.5/FR-1.19/OQ-26. Owner/Admin only. Target must be an existing, registered user matched by email \u2014 there is no invite-a-non-user flow (a real DB constraint one layer down, invited_user_id NOT NULL).\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["email", "role"], "properties": {"email": {"type": "string", "format": "email"}, "role": {"type": "string", "enum": ["Admin", "Member", "Viewer"]}}}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Invitation"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"description": "No registered user matches the given email (FR-1.19).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/households/{householdId}/invitations/{invitationId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/InvitationId"}], "delete": {"tags": ["Households"], "operationId": "revokeInvitation", "summary": "Revoke a pending invitation", "description": "FR-1.10. Owner/Admin only, before the invitee responds.", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"description": "Invitation is no longer pending.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/invitations/{invitationId}/accept": {"parameters": [{"$ref": "#/components/parameters/InvitationId"}], "post": {"tags": ["Households"], "operationId": "acceptInvitation", "summary": "Accept a household invitation", "description": "FR-1.10. Only the invited user can accept. Establishes membership with the role specified in the invitation.\n", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"householdId": {"type": "string", "format": "uuid"}, "role": {"type": "string"}}}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"description": "Invitation already resolved or revoked.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/invitations/{invitationId}/decline": {"parameters": [{"$ref": "#/components/parameters/InvitationId"}], "post": {"tags": ["Households"], "operationId": "declineInvitation", "summary": "Decline a household invitation", "description": "FR-1.10. Only the invited user can decline. No membership is ever created.", "responses": {"200": {"description": "OK"}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"description": "Invitation already resolved or revoked.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/accounts": {"get": {"tags": ["Accounts"], "operationId": "listAccounts", "summary": "List financial accounts visible to the current user", "parameters": [{"name": "householdId", "in": "query", "schema": {"type": "string", "format": "uuid"}}, {"name": "visibility", "in": "query", "schema": {"type": "string", "enum": ["personal", "shared"]}}, {"$ref": "#/components/parameters/Limit"}, {"$ref": "#/components/parameters/Offset"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Account"}}, "pagination": {"$ref": "#/components/schemas/Pagination"}}}}}}}}, "post": {"tags": ["Accounts"], "operationId": "createAccount", "summary": "Create a financial account", "description": "FR-2.1. `type` and `currency` are immutable once set (OQ-32) \u2014 there is no edit path for either, ever. Cards may optionally be attached inline. See docs/design/diagrams/sequences/financial-accounts/uc-01-create-account.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccountCreateRequest"}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Account"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/accounts/{accountId}": {"parameters": [{"$ref": "#/components/parameters/AccountId"}], "get": {"tags": ["Accounts"], "operationId": "getAccount", "summary": "Get a financial account", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Account"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}, "patch": {"tags": ["Accounts"], "operationId": "editAccount", "summary": "Edit a financial account, including its Credit Cards", "description": "FR-2.9/OQ-35. Attaching, editing, and removing this account's Credit Cards is folded into this same request, not separate endpoints. `type`/`currency` changes are rejected (OQ-32); a card can only attach to a checking/savings/credit_card_only account (FR-2.7). See docs/design/diagrams/sequences/financial-accounts/uc-02-edit-account.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccountUpdateRequest"}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Account"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/accounts/{accountId}/archive": {"parameters": [{"$ref": "#/components/parameters/AccountId"}], "post": {"tags": ["Accounts"], "operationId": "archiveAccount", "summary": "Archive a financial account", "description": "FR-2.4/OQ-34. One-way, no unarchive path. Auto-disconnects Open Banking sync if linked (OQ-36) \u2014 currently unreachable since that trigger is parked.\n", "responses": {"204": {"description": "No Content"}}}}, "/accounts/{accountId}/credit-cards": {"parameters": [{"$ref": "#/components/parameters/AccountId"}], "get": {"tags": ["Accounts"], "operationId": "listCreditCards", "summary": "List credit cards attached to an account", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/CreditCard"}}}}}}}}}}, "/accounts/{accountId}/balances": {"parameters": [{"$ref": "#/components/parameters/AccountId"}], "get": {"tags": ["Accounts"], "operationId": "getAccountBalances", "summary": "Get an account's balance history by month", "description": "FR-5.4/FR-6.6. Backed by account_month_balances \u2014 \"current balance\" is simply the row for today's (year, month). No new stored data beyond what Record Transaction already maintains.\n", "parameters": [{"$ref": "#/components/parameters/StartDate"}, {"$ref": "#/components/parameters/EndDate"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/AccountMonthBalance"}}}}}}}}}}, "/credit-cards/{creditCardId}/balances": {"parameters": [{"$ref": "#/components/parameters/CreditCardId"}], "get": {"tags": ["Accounts"], "operationId": "getCreditCardBalances", "summary": "Get a credit card's outstanding-balance history by month", "parameters": [{"$ref": "#/components/parameters/StartDate"}, {"$ref": "#/components/parameters/EndDate"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/CreditCardMonthBalance"}}}}}}}}}}, "/categories": {"get": {"tags": ["Categories"], "operationId": "listCategories", "summary": "List categories (with their subcategories)", "parameters": [{"name": "includeArchived", "in": "query", "schema": {"type": "boolean", "default": false}}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Category"}}}}}}}}}, "post": {"tags": ["Categories"], "operationId": "createCategory", "summary": "Create a category", "description": "FR-10.1. A custom Category supplementing the predefined default set every household is seeded with.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["name", "icon", "color"], "properties": {"name": {"type": "string"}, "icon": {"type": "string", "description": "Icon name from the in-code icon set (Material Symbols)"}, "color": {"type": "string", "enum": ["mint", "emerald", "teal", "cyan", "sky", "blue", "indigo", "violet", "lilac", "fuchsia", "pink", "rose", "coral", "peach", "orange", "sun", "lime", "slate"], "description": "Palette token, not a hex \u2014 resolves per theme (OQ-85)"}}}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Category"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/categories/{categoryId}": {"parameters": [{"$ref": "#/components/parameters/CategoryId"}], "get": {"tags": ["Categories"], "operationId": "getCategory", "summary": "Get a category (with its subcategories)", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Category"} e": "string"}}, "description": "Transaction kinds"}, {"name": "accountIds", "in": "query", "required": false, "style": "form", "explode": false, "schema": {"type": "array", "items": {"type": "string"}}, "description": "Accounts"}, {"name": "creditCardIds", "in": "query", "required": false, "style": "form", "explode": false, "schema": {"type": "array", "items": {"type": "string"}}, "description": "Credit cards"}, {"name": "categoryIds", "in": "query", "required": false, "style": "form", "explode": false, "schema": {"type": "array", "items": {"type": "string"}}, "description": "Categories"}, {"name": "holdingId", "in": "query", "required": false, "schema": {"type": "string", "format": "uuid"}, "description": "Investment transactions linked to this Holding"}, {"name": "from", "in": "query", "required": false, "schema": {"type": "string", "format": "date"}}, {"name": "to", "in": "query", "required": false, "schema": {"type": "string", "format": "date"}}, {"$ref": "#/components/parameters/Cursor"}, {"$ref": "#/components/parameters/Limit"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TransactionPage"}}}}}}, "post": {"tags": ["Transactions"], "operationId": "recordTransaction", "summary": "Record a transaction (unified entry point)", "description": "FR-3.1/OQ-39. One unified entry point for both Account and Card Transactions \u2014 `target` narrows which kinds are valid, itself data-driven, not a second code path. The investment-buy-against- a-fixed-term-instrument sub-case is one of the two widest-fan-out flows in the whole system (the other is Delete User) \u2014 `assetType`/`ticker`/`quantity` are required for every investment kind, and `rate`/`dueDate` additionally for an investment_buy against a fixed-term instrument type (OQ-50, FR-11.2) \u2014 neither is derivable from `assetType` alone, since a CDB/LCI/LCA's specific term and rate are negotiated per contract. This is also now the *only* creation path for an Investment Holding \u2014 the once-separate onboarding backfill endpoint was retired (OQ-53). `allocations` optionally funds one or more Goals from this same investment_buy call (FR-8.2/OQ-54) \u2014 one call in, no separate PATCH /holdings/{holdingId} follow-up required. No recurring option (FR-3.5 removed, OQ-55). Investment kinds are rejected on credit-card-only accounts (422 `transaction.investment_not_allowed_on_account`, OQ-76); a full sell/redemption auto-archives the Holding (OQ-72). See docs/design/diagrams/sequences/record-transactions/uc-01-record-transaction.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TransactionCreateRequest"}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"oneOf": [{"$ref": "#/components/schemas/AccountTransaction"}, {"$ref": "#/components/schemas/CardTransaction"}]}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "409": {"description": "One of `allocations`' Holdings would exceed 100% total allocated (FR-8.3).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "422": {"description": "Validation failure \u2014 includes currency mismatch (FR-2.2) and kind invalid for the target's type (FR-3.1).\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/transactions/{transactionId}": {"parameters": [{"$ref": "#/components/parameters/TransactionId"}], "get": {"tags": ["Transactions"], "operationId": "getTransaction", "summary": "Get an Account Transaction", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccountTransaction"}}}}}}, "patch": {"tags": ["Transactions"], "operationId": "editTransaction", "summary": "Edit a transaction", "description": "FR-3.2/OQ-39. Works for either ledger. Real complexity: every downstream effect (balance movement, holding e vs expense) are v2 (OQ-71).", "parameters": [{"name": "reportType", "in": "path", "required": true, "schema": {"type": "string", "enum": ["month-overview", "investments-overview", "payouts"]}}, {"name": "year", "in": "query", "required": false, "schema": {"type": "integer"}, "description": "month-overview"}, {"name": "month", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 12}, "description": "month-overview"}, {"name": "holdingIds", "in": "query", "required": false, "style": "form", "explode": false, "schema": {"type": "array", "items": {"type": "string"}}, "description": "payouts \u2014 holdings to include"}, {"name": "months", "in": "query", "required": false, "schema": {"type": "integer", "default": 12}, "description": "payouts \u2014 how many months back"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"oneOf": [{"$ref": "#/components/schemas/MonthOverviewReport"}, {"$ref": "#/components/schemas/InvestmentsOverviewReport"}, {"$ref": "#/components/schemas/PayoutsReport"}], "discriminator": {"propertyName": "reportType", "mapping": {"month-overview": "#/components/schemas/MonthOverviewReport", "investments-overview": "#/components/schemas/InvestmentsOverviewReport", "payouts": "#/components/schemas/PayoutsReport"}}}}}}, "400": {"$ref": "#/components/responses/BadRequest"}}}}, "/reports/transactions/export": {"get": {"tags": ["Reports"], "operationId": "exportTransactions", "summary": "[v2] Export transactions to CSV", "description": "FR-6.4. A formatted PDF is a nice-to-have, not a v1 commitment \u2014 CSV is the only guaranteed export format.\n", "parameters": [{"$ref": "#/components/parameters/StartDate"}, {"$ref": "#/components/parameters/EndDate"}], "responses": {"200": {"description": "OK", "content": {"text/csv": {"schema": {"type": "string"}}}}}, "x-deferred": "v2 (OQ-71)"}}, "/notifications": {"get": {"tags": ["Insights"], "operationId": "listNotifications", "summary": "L
