  <div id="swagger-ui"></div>
  <script type="application/json" id="openapi-spec">{"openapi": "3.1.0", "info": {"title": "New Finance App API", "version": "1.1.0", "description": "Backend API for the New Finance App \u2014 household finance management: personal & shared budgeting, expense tracking, and manual investment/net-worth tracking. Derived directly from docs/architecture/02-data-model.md (schema), docs/design/diagrams/sequences/ (per-use-case call sequences, HTTP routes, and status codes), and docs/requirements/02-functional-requirements.md (FR numbers referenced throughout). See docs/architecture/03-api-design.md for the design rationale behind every convention below \u2014 this file is the contract, that file is the \"why.\"\nOpen Banking sync (FR-2.5/2.6/3.3) and the FII/Stock Portfolio Builder (CUC-7, FR-5.5/5.6/5.7) are deferred whole and have no endpoints here \u2014 see 02-data-model.md's parked-Accessors note.\n\n\n**1.1.0 \u2014 Oct 2026 review** (`docs/architecture/10-api-review-2026-10.md`): Objectives \u2192 Goals, recurring removed, manual market values + index rates, fixed v1 reports under `/reports`, merged transaction browsing with cursor pagination, error envelope with namespaced codes + params (OQ-83), notifications as type + params (OQ-82). Deferred operations carry `x-deferred`."}, "servers": [{"url": "/api/v1", "description": "All endpoints below are relative to this base path."}], "security": [{"bearerAuth": []}], "tags": [{"name": "Auth", "description": "Registration, login, session/password/MFA lifecycle. FR-1, CUC-2."}, {"name": "Households", "description": "Household creation, membership, invitations, ownership. FR-1, CUC-1."}, {"name": "Accounts", "description": "Financial Accounts and Credit Cards. FR-2, CUC-3."}, {"name": "Categories", "description": "Category/Subcategory taxonomy. FR-10."}, {"name": "Budgets", "description": "Budgets, targets, and periods. FR-4, CUC-5."}, {"name": "Investments", "description": "Investment Holdings, Valuation Snapshots, schedule entries. FR-5, FR-11, CUC-6."}, {"name": "Goals", "description": "Goals (formerly Objectives \u2014 OQ-66): create, edit, complete/reopen, delete; progress (InsightsManager, OQ-177)."}, {"name": "Transactions", "description": "Account Transactions and Card Transactions \u2014 record, edit, delete, browse & filter. FR-3, CUC-4."}, {"name": "Insights", "description": "Dashboard, reports, notifications. FR-6, CUC-8."}, {"name": "Audit", "description": "Audit log export. FR-7, CUC-9."}, {"name": "Reports", "description": "Fixed v1 report types (month-overview, investments-overview, payouts); ad-hoc types and CSV export are v2 (OQ-71)."}], "paths": {"/auth/register": {"post": {"tags": ["Auth"], "operationId": "registerUser", "summary": "Register a new user (Create User)", "description": "FR-1.1/FR-1.15. Enrolls TOTP-based MFA and issues recovery codes inline \u2014 an account cannot be used to log in until MFA is enrolled, so this happens as part of registration, not a follow-up step. The enrollment stays unconfirmed until POST /auth/mfa/enrollment/confirm receives its first code (OQ-149). See docs/design/diagrams/sequences/identity-household/uc-11-create-user.html.\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["email", "password", "firstName", "lastName"], "properties": {"email": {"type": "string", "format": "email"}, "password": {"type": "string", "minLength": 12}, "firstName": {"type": "string", "minLength": 1, "description": "Trimmed \u2014 must not be blank"}, "lastName": {"type": "string", "minLength": 1, "description": "Trimmed \u2014 must not be blank"}, "language": {"type": "string", "enum": ["pt-BR", "en-US"], "description": "The locale the user registered in \u2014 the account's starting `preferences.language`, so the app doesn't switch language once they sign in (OQ-161). pt-BR when absent.\n"}}}}}}, "responses": {"201": {"description": "Created. Recovery codes are returned exactly once and never again.", "content": {"application/json": {"schema": {"allOf": [{"type": "object", "required": ["userId"], "properties": {"userId": {"type": "string", "format": "uuid"}}}, {"$ref": "#/components/schemas/MfaEnrollmentStart"}]}}}}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/auth/login": {"post": {"tags": ["Auth"], "operationId": "login", "summary": "Login, step 1 of 2 \u2014 the password earns an MFA challenge", "description": "FR-1.2/OQ-30/OQ-145. Sign-in takes two steps: this one checks the password and answers a five-minute challenge token; POST /auth/mfa/verify (or /auth/mfa/recover) trades it, with the second factor, for a session. An account whose MFA enrollment was never confirmed gets no challenge: the answer is a fresh enrollment (new secret and recovery codes, replacing the old ones) to confirm through POST /auth/mfa/enrollment/confirm (OQ-149). Every failure here answers the same 401, so it never reveals which emails are registered. A success does not clear the address's failure count \u2014 only a full sign-in does. See docs/design/diagrams/sequences/identity-household/uc-14-login.html.\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["email", "password"], "properties": {"email": {"type": "string", "format": "email"}, "password": {"type": "string"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"oneOf": [{"$ref": "#/components/schemas/MfaChallenge"}, {"$ref": "#/components/schemas/MfaEnrollment"}], "discriminator": {"propertyName": "step", "mapping": {"mfa": "#/components/schemas/MfaChallenge", "enroll": "#/components/schemas/MfaEnrollment"}}}}}}, "401": {"description": "Invalid email or password \u2014 deliberately identical for both, to avoid leaking which emails are registered. Code: `auth.invalid_credentials`.\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "429": {"$ref": "#/components/responses/TooManyRequests"}}}}, "/auth/mfa/verify": {"post": {"tags": ["Auth"], "operationId": "verifyMfa", "summary": "Login, step 2 of 2 \u2014 the MFA code opens a session", "description": "FR-1.2/OQ-145. The access token is stateless (never persisted); the refresh token is the server-tracked, revocable record backing GET/DELETE /users/me/sessions. A wrong code counts against the same lockout as a wrong password (OQ-114).\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["challengeToken", "mfaCode"], "properties": {"challengeToken": {"type": "string"}, "mfaCode": {"type": "string"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthTokens"}}}}, "401": {"$ref": "#/components/responses/ChallengeRejected"}, "429": {"$ref": "#/components/responses/TooManyRequests"}}}}, "/auth/mfa/enrollment/confirm": {"post": {"tags": ["Auth"], "operationId": "confirmMfaEnrollment", "summary": "Confirm MFA enrollment \u2014 the first authenticator code opens a session", "description": "FR-1.15/OQ-149. Proves the authenticator app was set up: the enrollment token from POST /auth/register (or from POST /auth/login while the enrollment is unconfirmed) and the app's current code. Confirms the enrollment once and opens a session. A wrong code counts against the same lockout as sign-in (OQ-114). See docs/design/diagrams/sequences/identity-household/uc-11b-confirm-mfa-enrollment.html.\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["enrollmentToken", "mfaCode"], "properties": {"enrollmentToken": {"type": "string"}, "mfaCode": {"type": "string"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthTokens"}}}}, "401": {"$ref": "#/components/responses/EnrollmentRejected"}, "429": {"$ref": "#/components/responses/TooManyRequests"}}}}, "/auth/logout": {"post": {"tags": ["Auth"], "operationId": "logout", "summary": "Logout (current session only)", "description": "FR-1.9. Terminates the current session only; every other active session/device is unaffected. Idempotent \u2014 logging out an already-terminated session still returns 204.\n", "responses": {"204": {"description": "No Content"}}}}, "/auth/refresh": {"post": {"tags": ["Auth"], "operationId": "refreshTokens", "summary": "Exchange a refresh token for new tokens (rotation)", "description": "OQ-30/OQ-100. Returns a new access token (15 minutes) and a new refresh token (30 days); the presented refresh token is consumed, so each one works once. An unknown, expired, revoked or already-used refresh token is rejected \u2014 and its session is ended (a replayed token suggests theft). No access token needed: this is how a client gets one back after it expires.\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["refreshToken"], "properties": {"refreshToken": {"type": "string"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthTokens"}}}}, "401": {"description": "Code: `auth.refresh_invalid`.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/auth/change-password": {"post": {"tags": ["Auth"], "operationId": "changePassword", "summary": "Change password (authenticated)", "description": "FR-1.14. Requires re-supplying the current password; invalidates every other active session except the one making the change \u2014 contrast with Reset Password, which has no session to spare.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["currentPassword", "newPassword"], "properties": {"currentPassword": {"type": "string"}, "newPassword": {"type": "string", "minLength": 12}}}}}}, "responses": {"200": {"description": "OK"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "422": {"description": "`password.too_short` (`params.min`), or `password.current_incorrect` \u2014 a wrong current password is a form error, not a 401, so the signed-in user isn't treated as signed out (OQ-115).\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/auth/password-reset/request": {"post": {"tags": ["Auth"], "operationId": "requestPasswordReset", "summary": "Request a password reset token (step 1 of 2)", "description": "FR-1.13. Always returns 202 regardless of whether the email matched an account \u2014 the branch is entirely internal, so there is no observable response difference that would leak account existence.\n The work happens after the 202 is sent, so the timing doesn't reveal it either (OQ-115). The reset link (`WEB_APP_URL` + `/reset-password?token=\u2026`) works once, for 30 minutes; NotificationEngine emails it as `password.reset` in the user's language (OQ-113); the token is stored hashed in `password_reset_tokens`.", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["email"], "properties": {"email": {"type": "string", "format": "email"}}}}}}, "responses": {"202": {"description": "Accepted"}}}}, "/auth/password-reset/confirm": {"post": {"tags": ["Auth"], "operationId": "confirmPasswordReset", "summary": "Submit a reset token + new password (step 2 of 2)", "description": "FR-1.13. A valid token invalidates every active session, not just the one making the change (there is no \"current session\" to spare \u2014 the user isn't logged in at all).\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["token", "newPassword"], "properties": {"token": {"type": "string"}, "newPassword": {"type": "string", "minLength": 12}}}}}}, "responses": {"200": {"description": "OK"}, "422": {"description": "`password.too_short` (`params.min`) \u2014 checked before the token is used up.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "400": {"description": "Token invalid, expired or already used: `password_reset.token_invalid`.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/auth/mfa/recover": {"post": {"tags": ["Auth"], "operationId": "recoverWithMfaCode", "summary": "Login, step 2 of 2 \u2014 a single-use MFA recovery code opens a session", "description": "FR-1.16/OQ-145. In place of POST /auth/mfa/verify: needs the challenge token from the password step, so it is an alternate second factor, not a full account-recovery mechanism. If recovery codes are also exhausted/lost, there is no further self-service path (OQ-24). A code is used up only when it is right; a wrong one counts against the same lockout as login (OQ-114).\n", "security": [], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["challengeToken", "recoveryCode"], "properties": {"challengeToken": {"type": "string"}, "recoveryCode": {"type": "string"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AuthTokens"}}}}, "401": {"$ref": "#/components/responses/ChallengeRejected"}, "429": {"$ref": "#/components/responses/TooManyRequests"}}}}, "/users/me": {"get": {"tags": ["Auth"], "operationId": "getCurrentUser", "summary": "Get the current user's profile", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/User"}}}}}}, "patch": {"tags": ["Auth"], "operationId": "editCurrentUser", "summary": "Edit profile (first/last name) and preferences (theme, language)", "description": "Email and password each have their own dedicated flow \u2014 this endpoint never touches either. See docs/design/diagrams/sequences/identity-household/uc-13-edit-user.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"firstName": {"type": "string", "minLength": 1, "description": "Trimmed \u2014 must not be blank"}, "lastName": {"type": "string", "minLength": 1, "description": "Trimmed \u2014 must not be blank"}, "preferences": {"$ref": "#/components/schemas/UserPreferences"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/User"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}, "delete": {"tags": ["Auth"], "operationId": "deleteCurrentUser", "summary": "Delete own account (GDPR right-to-erasure)", "description": "FR-1.17/FR-1.18/OQ-25. Unconditional \u2014 no rejection path exists, by design. Personal data (personal Accounts, Budgets, Goals, and everything they own) is hard-deleted; this user's contributions to shared household data are anonymized (actor reference nulled), not deleted. If this user was a household's Owner, FR-1.18's succession runs first, per household. One of the two widest-fan-out flows in the system \u2014 see docs/design/diagrams/sequences/identity-household/uc-12-delete-user.html for the full cascade traced call-by-call.\n", "responses": {"204": {"description": "No Content"}}}}, "/users/me/sessions": {"get": {"tags": ["Auth"], "operationId": "listSessions", "summary": "List active sessions/devices", "description": "FR-1.3.", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Session"}}}}}}}}}, "delete": {"tags": ["Auth"], "operationId": "revokeOtherSessions", "summary": "Sign out all other sessions", "description": "FR-1.3 / OQ-62 \u2014 deletes every session of the current user except the one making this call (same `SessionAccessor.deleteAllExceptCurrent` as Change Password).", "responses": {"204": {"description": "No Content"}}}}, "/users/me/sessions/{sessionId}": {"parameters": [{"$ref": "#/components/parameters/SessionId"}], "delete": {"tags": ["Auth"], "operationId": "revokeSession", "summary": "Revoke a session", "description": "FR-1.3. 404, not 403, for a session belonging to someone else \u2014 deliberately doesn't confirm the session ID exists at all to a non-owner.\n", "responses": {"204": {"description": "No Content"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/users/me/invitations": {"get": {"tags": ["Households"], "operationId": "listMyInvitations", "summary": "List pending invitations addressed to the current user", "description": "FR-1.5/FR-1.10. Only ever shows this user's own pending invitations, with the household's and inviter's names \u2014 the invitee isn't a member yet, so it can't look them up (OQ-116).\n", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/ReceivedInvitation"}}}}}}}}}}, "/households": {"get": {"tags": ["Households"], "operationId": "listHouseholds", "summary": "List households the current user belongs to", "description": "FR-1.8 \u2014 a user may belong to more than one household; each comes with the user's role in it (OQ-116).", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/MyHousehold"}}}}}}}}}, "post": {"tags": ["Households"], "operationId": "createHousehold", "summary": "Create a household", "description": "FR-1.4. Also seeds the predefined default Category set \u2014 a Manager\u2194Manager effect routed through the Service Bus, invisible at this API layer (fire-and-forget, doesn't block this response). See docs/design/diagrams/sequences/identity-household/uc-01-create-household.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["name"], "properties": {"name": {"type": "string", "minLength": 1, "description": "Trimmed \u2014 must not be blank"}}}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MyHousehold"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Households"], "operationId": "getHousehold", "summary": "Get a household", "description": "One of the caller's households, with their role (OQ-117); 404 for anyone else's.", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MyHousehold"}}}}}}, "delete": {"tags": ["Households"], "operationId": "deleteHousehold", "summary": "Delete a household (Owner only, deliberate dissolution)", "description": "FR-1.7. Owner-only, cascading hard delete of every household-scoped record. Distinct from FR-1.18's auto-delete when the last member leaves (see DELETE .../members/{userId}) \u2014 this is the Owner choosing to dissolve the household outright. See docs/design/diagrams/sequences/identity-household/uc-02-delete-household.html.\n", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/members": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Households"], "operationId": "listMembers", "summary": "List household members", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/HouseholdMembership"}}}}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/members/{userId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/UserId"}], "delete": {"tags": ["Households"], "operationId": "removeMember", "summary": "Remove a member, or leave the household yourself", "description": "FR-1.11/FR-1.18/OQ-27. One endpoint, two actor/target relationships: `userId != ` the caller (Remove Member, Owner/Admin only, the Owner can never be removed this way) or `userId ==` the caller (Leave Household, self-service, no authorization check \u2014 if the leaver is the Owner, FR-1.18's succession runs atomically, or the household itself is deleted if no member remains). See docs/design/diagrams/sequences/identity-household/uc-07-remove-member.html and uc-08-leave-household.html.\n", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}}, "/households/{householdId}/members/{userId}/role": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/UserId"}], "patch": {"tags": ["Households"], "operationId": "changeMemberRole", "summary": "Change a member's role", "description": "FR-1.12. Owner/Admin only; can never assign or remove the Owner role \u2014 attempting to set role=Owner here is rejected, use Transfer Ownership instead (FR-1.20).\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["role"], "properties": {"role": {"type": "string", "enum": ["Admin", "Member", "Viewer"]}}}}}}, "responses": {"200": {"description": "OK"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}/transfer-ownership": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "post": {"tags": ["Households"], "operationId": "transferOwnership", "summary": "Transfer ownership to another member", "description": "FR-1.20/OQ-28. Owner-only; a single atomic dual-role swap \u2014 the household is never observably left with zero or two Owners (enforced one layer down by a partial unique index on household_memberships). Distinct from FR-1.18's auto-succession: the transferring Owner remains a member, demoted to Admin, not leaving.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["targetUserId"], "properties": {"targetUserId": {"type": "string", "format": "uuid"}}}}}}, "responses": {"200": {"description": "OK"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}}, "/households/{householdId}/invitations": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Households"], "operationId": "listHouseholdInvitations", "summary": "List this household's invitations", "description": "Owner/Admin only. Every status, newest first, each with the invitee's name and email \u2014 they aren't members, so they can't be looked up otherwise (OQ-118).\n", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/HouseholdInvitation"}}}}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}, "post": {"tags": ["Households"], "operationId": "createInvitation", "summary": "Invite a user to the household", "description": "FR-1.5/FR-1.19/OQ-26. Owner/Admin only. Target must be an existing, registered user matched by email \u2014 there is no invite-a-non-user flow (a real DB constraint one layer down, invited_user_id NOT NULL).\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["email", "role"], "properties": {"email": {"type": "string", "format": "email"}, "role": {"type": "string", "enum": ["Admin", "Member", "Viewer"]}}}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Invitation"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"description": "No registered user matches the given email (FR-1.19).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "409": {"description": "Codes: `invitation.already_member` \u2014 the user is already a member of this household; `invitation.already_pending` \u2014 the user already has a pending invitation to it (OQ-109).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/households/{householdId}/invitations/{invitationId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/InvitationId"}], "delete": {"tags": ["Households"], "operationId": "revokeInvitation", "summary": "Revoke a pending invitation", "description": "FR-1.10. Owner/Admin only, before the invitee responds.", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"description": "Code: `invitation.not_found` \u2014 no such invitation in this household (OQ-109).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "409": {"description": "Code: `invitation.not_pending` \u2014 already accepted, declined or revoked.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/invitations/{invitationId}/accept": {"parameters": [{"$ref": "#/components/parameters/InvitationId"}], "post": {"tags": ["Households"], "operationId": "acceptInvitation", "summary": "Accept a household invitation", "description": "FR-1.10. Only the invited user can accept; it is resolved first (guarded), then the membership is added (OQ-118). Establishes membership with the role specified in the invitation.\n", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"householdId": {"type": "string", "format": "uuid"}, "role": {"type": "string"}}}}}}, "404": {"description": "`invitation.not_found` \u2014 no such invitation, or it isn't addressed to the caller: the same answer, so it never confirms one exists (OQ-118).\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "409": {"description": "Code: `invitation.not_pending` \u2014 already accepted, declined or revoked.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/invitations/{invitationId}/decline": {"parameters": [{"$ref": "#/components/parameters/InvitationId"}], "post": {"tags": ["Households"], "operationId": "declineInvitation", "summary": "Decline a household invitation", "description": "FR-1.10. Only the invited user can decline. No membership is ever created.", "responses": {"200": {"description": "OK"}, "404": {"description": "`invitation.not_found` \u2014 no such invitation, or it isn't addressed to the caller: the same answer, so it never confirms one exists (OQ-118).\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "409": {"description": "Code: `invitation.not_pending` \u2014 already accepted, declined or revoked.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/households/{householdId}/account-status": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Accounts"], "operationId": "getAccountStatus", "summary": "Whether the household has an account in use", "description": "FR-1.22, OQ-198. True while any Account of the household, of any visibility, isn't archived. It is a fact about the household, not about what the caller can see, so an invited member of a household whose Accounts are all someone else's personal ones gets `true`; nothing about those Accounts is revealed. Any member may read it. The App Shell's household gate opens Guided Setup while it is `false`.\n", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccountStatus"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/accounts": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Accounts"], "operationId": "listAccounts", "summary": "List the financial accounts visible to the current user", "description": "FR-2.3/FR-2.4. Every shared Account and the caller's own personal ones, open ones first, each with its current balance and its Credit Cards (OQ-175). Not paginated: a household has a handful.\n", "parameters": [{"name": "visibility", "in": "query", "schema": {"type": "string", "enum": ["personal", "shared"]}}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Account"}}}}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}, "post": {"tags": ["Accounts"], "operationId": "createAccount", "summary": "Create a financial account", "description": "FR-2.1. `type` and `currency` are immutable once set (OQ-32) \u2014 there is no edit path for either, ever. The opening balance is the balance today (OQ-169). Cards may be attached inline, only to a checking, savings or credit card only Account (FR-2.7, 422 `account.cards_not_allowed`); the Account and its cards are written together or not at all (OQ-175). Any member may create a personal Account; a shared one needs a role that may create (FR-1.7). See docs/design/diagrams/sequences/financial-accounts/uc-01-create-account.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccountCreateRequest"}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Account"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}/accounts/{accountId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/AccountId"}], "get": {"tags": ["Accounts"], "operationId": "getAccount", "summary": "Get a financial account", "description": "Someone else's personal Account is 404 `account.not_found`, so its existence isn't revealed.\n", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Account"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}, "patch": {"tags": ["Accounts"], "operationId": "editAccount", "summary": "Edit a financial account, including its Credit Cards", "description": "FR-2.9/OQ-35. Attaching, editing, and removing this account's Credit Cards is folded into this same request, not separate endpoints, and the whole edit is written together or not at all (OQ-175). There is no field for `type`/`currency` (OQ-32). A card can only attach to a checking/savings/credit_card_only account (FR-2.7, 422 `account.cards_not_allowed`); a card id not on this Account is 404 `credit_card.not_found`. Only the Account's creator may change its visibility (FR-2.3, 403). An archived Account can't be edited (409 `account.archived`). See docs/design/diagrams/sequences/financial-accounts/uc-02-edit-account.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccountUpdateRequest"}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Account"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}/accounts/{accountId}/archive": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/AccountId"}], "post": {"tags": ["Accounts"], "operationId": "archiveAccount", "summary": "Archive a financial account", "description": "FR-2.4/OQ-34. One-way, no unarchive path; archiving it again keeps the first time. Auto-disconnects Open Banking sync if linked (OQ-36) \u2014 currently unreachable since that trigger is parked.\n", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/accounts/{accountId}/balances": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/AccountId"}], "get": {"tags": ["Accounts"], "operationId": "getAccountBalances", "summary": "Get an account's balance history by month", "description": "FR-5.4/FR-6.6. Backed by account_month_balances, oldest month first \u2014 the chain has no gaps (OQ-169). An open end reaches the chain's end.\n", "parameters": [{"$ref": "#/components/parameters/FromMonth"}, {"$ref": "#/components/parameters/ToMonth"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/AccountMonthBalance"}}}}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/credit-cards/{creditCardId}/balances": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/CreditCardId"}], "get": {"tags": ["Accounts"], "operationId": "getCreditCardBalances", "summary": "Get a credit card's outstanding-balance history by billing cycle", "description": "FR-2.10. One row per billing cycle, named by the month it closes in (OQ-170), oldest first. A card on someone else's personal Account is 404 `credit_card.not_found`.\n", "parameters": [{"$ref": "#/components/parameters/FromMonth"}, {"$ref": "#/components/parameters/ToMonth"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/CreditCardMonthBalance"}}}}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/categories": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Categories"], "operationId": "listCategories", "summary": "List categories (with their subcategories)", "parameters": [{"name": "includeArchived", "in": "query", "schema": {"type": "boolean", "default": false}}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Category"}}}}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}, "post": {"tags": ["Categories"], "operationId": "createCategory", "summary": "Create a category", "description": "FR-10.1. A custom Category supplementing the predefined default set every household is seeded with. Categories are shared household data with no recorded creator: any member but a Viewer may create one; editing and archiving are Owner/Admin (FR-1.7, OQ-111). Created without Subcategories \u2014 add them with `editCategory`. A name is at most 20 characters (OQ-193).\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["name", "icon", "color"], "properties": {"name": {"type": "string", "maxLength": 20}, "icon": {"$ref": "#/components/schemas/CategoryIcon"}, "color": {"$ref": "#/components/schemas/CategoryColor"}}}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Category"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}/categories/{categoryId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/CategoryId"}], "get": {"tags": ["Categories"], "operationId": "getCategory", "summary": "Get a category (with its subcategories)", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Category"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}, "patch": {"tags": ["Categories"], "operationId": "editCategory", "summary": "Edit a category, including its Subcategories", "description": "FR-10.2. Creating a new Subcategory under this Category is folded into this same request. The two-level limit is structural \u2014 a Subcategory payload has no field to nest a further level, so there is nothing to reject at runtime. Atomic (OQ-173): a Subcategory `id` not under this Category refuses the whole edit with 404 `subcategory.not_found`.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CategoryUpdateRequest"}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Category"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}/categories/{categoryId}/archive": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/CategoryId"}], "post": {"tags": ["Categories"], "operationId": "archiveCategory", "summary": "Archive a category (cascades to its Subcategories)", "description": "FR-10.3/FR-10.4. One-way. Cascades: stamps this Category's archived_at, then every live Subcategory's, in one transaction.\n", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/categories/{categoryId}/subcategories/{subcategoryId}/archive": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/CategoryId"}, {"$ref": "#/components/parameters/SubcategoryId"}], "post": {"tags": ["Categories"], "operationId": "archiveSubcategory", "summary": "Archive a single subcategory (parent/siblings unaffected)", "description": "FR-10.3/FR-10.4. One-way, single-row \u2014 no cascade in this direction.", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/budgets": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Budgets"], "operationId": "listBudgets", "summary": "List budgets", "description": "Every shared Budget and the caller's own personal ones, by name \u2014 not paginated, like listCategories: the claim-aware Category picker needs every claim in the caller's scopes (OQ-176). The definitions only; spend against target is the Budget status read (FR-4.3).\n", "parameters": [{"name": "visibility", "in": "query", "schema": {"type": "string", "enum": ["personal", "shared"]}}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Budget"}}}}}}}}}, "post": {"tags": ["Budgets"], "operationId": "createBudget", "summary": "Create a budget", "description": "FR-4.1/FR-4.7. A Category or Subcategory can be claimed by at most one Budget per scope \u2014 a real partial-unique-index constraint one layer down, not application logic. A target claimed by another Budget in the scope is 409 `budget.target_already_claimed`, with `params` naming the target and the claiming `budgetId`; one that isn't this household's, or is archived, is 422 `field.invalid_option` on `targets[i]` (OQ-176). A target sent twice counts once. A name is at most 40 characters (OQ-194).\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BudgetCreateRequest"}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Budget"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"description": "A target is already claimed by another Budget in this scope (FR-4.7).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}/budgets/{budgetId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/BudgetId"}], "get": {"tags": ["Budgets"], "operationId": "getBudget", "summary": "Get a budget", "description": "Someone else's personal Budget is 404 `budget.not_found`, so it never confirms one exists (OQ-176).\n", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Budget"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}, "patch": {"tags": ["Budgets"], "operationId": "editBudget", "summary": "Edit a budget", "description": "FR-4.9. Changing targetAmount only affects the current and future Budget Periods; past periods keep the target actually in effect at the time. `targets` replaces the whole set; the name, target and targets are written together or not at all (OQ-176). A target the Budget already claims stays claimable when its Category has since been archived; a new one may not be. Currency and visibility never change.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/BudgetUpdateRequest"}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Budget"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"description": "A newly assigned target is already claimed elsewhere (FR-4.7).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}, "delete": {"tags": ["Budgets"], "operationId": "deleteBudget", "summary": "Delete a budget", "description": "FR-4.10/OQ-40. Hard delete of the live definition only \u2014 unlike every other archive/delete decision in this project, past Budget Periods are unaffected (budget_periods.budget_id is a nullable FK, ON DELETE SET NULL) and survive on their own. Releases every Category/Subcategory this Budget had claimed. Deleting it again is 404 `budget.not_found`.\n", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/budgets/{budgetId}/periods": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/BudgetId"}], "get": {"tags": ["Budgets"], "operationId": "listBudgetPeriods", "summary": "Get a budget's monthly period history (target vs. actual spend)", "description": "FR-4.3/FR-4.9. Backs the Budget status display. Months as `YYYY-MM`, both ends optional (OQ-176, like the balance histories); oldest first. Only months a period was opened for are listed.\n", "parameters": [{"$ref": "#/components/parameters/FromMonth"}, {"$ref": "#/components/parameters/ToMonth"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/BudgetPeriod"}}}}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/accounts/{accountId}/holdings": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/AccountId"}], "get": {"tags": ["Investments"], "operationId": "listHoldings", "summary": "List Investment Holdings for an account", "parameters": [{"name": "includeArchived", "in": "query", "schema": {"type": "boolean", "default": false}}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/InvestmentHolding"}}}}}}}}}}, "/households/{householdId}/holdings/{holdingId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/HoldingId"}], "get": {"tags": ["Investments"], "operationId": "getHolding", "summary": "Get an Investment Holding", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/InvestmentHolding"}}}}}}, "patch": {"tags": ["Investments"], "operationId": "editHolding", "summary": "Edit a Holding's goal allocations", "description": "FR-8.2/8.3/OQ-48. Goal allocations only (narrowed Oct 2026) \u2014 the Holding is the entry point, never the Goal (OQ-48). Position changes only through transactions; market value has its own endpoints under /valuation-snapshots (OQ-56). Replace-all over the Goals the caller can see: a share funding a Goal the caller can't see (another member's personal one) is kept as it is and still counts toward the 100% (OQ-178). Rejected with 409 `goal.allocation_exceeds_100` past 100%, 409 `goal.completed` when a completed Goal's share is grown or added (kept unchanged or removed is fine \u2014 FR-8.9), 409 `holding.archived` on an archived Holding, 404 `goal.not_found` for a Goal the actor can't see (OQ-168), 422 for a Goal listed twice (`array.duplicate`). Answers the split the caller can see. See docs/design/diagrams/sequences/track-investments/uc-02-edit-holding.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HoldingUpdateRequest"}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HoldingAllocations"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"description": "This Holding's total allocated percentage would exceed 100% (FR-8.3), a completed Goal's share would grow (`goal.completed`, FR-8.9, OQ-168), or the Holding is archived (`holding.archived`, OQ-178).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}/holdings/{holdingId}/allocations": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/HoldingId"}], "get": {"tags": ["Investments"], "operationId": "listHoldingAllocations", "summary": "A Holding's Goal split", "description": "The Goal Allocation Editor's read (OQ-178): the shares funding the Goals the caller can see, oldest first; a share funding someone else's personal Goal is left out, never revealed.\n", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/HoldingAllocations"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/holdings/{holdingId}/archive": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/HoldingId"}], "post": {"tags": ["Investments"], "operationId": "archiveHolding", "summary": "Archive a matured Investment Holding", "description": "FR-5.8/OQ-43/OQ-72. One-way, no unarchive \u2014 Valuation Snapshot history and Goal allocations both depend on the Holding continuing to exist. Only a fixed-term Holding past its due date (its redemption entry's date) that still has a position: any other is 409 `holding.not_matured` \u2014 a zeroed Holding archives itself (OQ-178). Archiving an archived Holding changes nothing.\n", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}}, "/households/{householdId}/holdings/{holdingId}/valuation-snapshots": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/HoldingId"}], "get": {"tags": ["Investments"], "operationId": "listValuationSnapshots", "summary": "Get a Holding's valuation history", "description": "FR-5.2/FR-5.4. Market-priced assetTypes only (OQ-51) \u2014 a fixed-term Holding never populates this; read its costBasis instead. Newest first.\n", "parameters": [{"$ref": "#/components/parameters/StartDate"}, {"$ref": "#/components/parameters/EndDate"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/ValuationSnapshot"}}}}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}, "post": {"tags": ["Investments"], "operationId": "recordMarketValue", "summary": "Record a market value (manual Valuation Snapshot)", "description": "FR-5.2 / OQ-56 \u2014 market-priced Holdings only (409 `holding.not_market_priced`), never an archived one (409 `holding.archived`); `asOf` not after today (422 `date.max`, OQ-178).\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ValuationSnapshotInput"}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ValuationSnapshot"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}/holdings/{holdingId}/schedule-entries": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/HoldingId"}], "get": {"tags": ["Investments"], "operationId": "listScheduleEntries", "summary": "Get a fixed-term Holding's contractual cash-event schedule", "description": "FR-11.1/FR-11.2. Read-only from this API \u2014 entries are computed by InvestmentProductEngine at purchase time (OQ-53) and posted automatically by a scheduled trigger (FR-11.3), never created directly through this endpoint.\n", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/InvestmentScheduleEntry"}}}}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/transactions": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Transactions"], "operationId": "listTransactions", "summary": "Browse & filter all transactions (both ledgers, newest first)", "description": "FR-3.12 / OQ-61 \u2014 not limited to a month; cursor pagination on (date, id). Owned by TransactionManager (read-ownership rule). Only what the caller may see (others' personal Accounts are left out before filtering). Filters combine with AND; `accountIds` and `creditCardIds` are one picker \u2014 a row matches when its account or card is among the selected (both empty = all); a Category includes its Subcategories (OQ-201). `dayTotals` and `monthCounts` cover the days and months present in the page, computed over the whole filtered set, not only the page's rows.", "parameters": [{"name": "kinds", "in": "query", "required": false, "style": "form", "explode": false, "schema": {"type": "array", "items": {"type": "string"}}, "description": "Transaction kinds"}, {"name": "accountIds", "in": "query", "required": false, "style": "form", "explode": false, "schema": {"type": "array", "items": {"type": "string"}}, "description": "Accounts"}, {"name": "creditCardIds", "in": "query", "required": false, "style": "form", "explode": false, "schema": {"type": "array", "items": {"type": "string"}}, "description": "Credit cards"}, {"name": "categoryIds", "in": "query", "required": false, "style": "form", "explode": false, "schema": {"type": "array", "items": {"type": "string"}}, "description": "Categories"}, {"name": "holdingId", "in": "query", "required": false, "schema": {"type": "string", "format": "uuid"}, "description": "Investment transactions linked to this Holding"}, {"name": "from", "in": "query", "required": false, "schema": {"type": "string", "format": "date"}}, {"name": "to", "in": "query", "required": false, "schema": {"type": "string", "format": "date"}}, {"$ref": "#/components/parameters/Cursor"}, {"$ref": "#/components/parameters/Limit"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TransactionPage"}}}}}}, "post": {"tags": ["Transactions"], "operationId": "recordTransaction", "summary": "Record a transaction (unified entry point)", "description": "FR-3.1/OQ-39. One unified entry point for both Account and Card Transactions \u2014 `target` narrows which kinds are valid, itself data-driven, not a second code path. The investment-buy-against- a-fixed-term-instrument sub-case is one of the two widest-fan-out flows in the whole system (the other is Delete User) \u2014 `assetType`/`ticker`/`quantity` are required for every investment kind, and `rate`/`dueDate` additionally for an investment_buy against a fixed-term instrument type (OQ-50, FR-11.2) \u2014 neither is derivable from `assetType` alone, since a CDB/LCI/LCA's specific term and rate are negotiated per contract. This is also now the *only* creation path for an Investment Holding \u2014 the once-separate onboarding backfill endpoint was retired (OQ-53). `allocations` optionally funds one or more Goals from this same investment_buy call (FR-8.2/OQ-54) \u2014 one call in, no separate PATCH /holdings/{holdingId} follow-up required. No recurring option (FR-3.5 removed, OQ-55). Investment kinds are rejected on credit-card-only accounts (422 `transaction.investment_not_allowed_on_account`, OQ-76), and so are cash kinds \u2014 such an account takes only bill payments to its cards (`transaction.kind_not_allowed_for_target`, OQ-201); a full sell/redemption auto-archives the Holding (OQ-72). **OQ-201:** every investment kind moves the account's cash (buy \u2212, sell/redemption/dividend/interest +, tax \u2212); sell, redemption, dividend, interest and tax name their Holding by `holdingId`, only a buy by `assetType` + `ticker`; a bill payment carries `accountId` (the paying account) and `creditCardId`; any kind may carry a category \u2014 money in reduces the claiming Budget's spend. See docs/design/diagrams/sequences/record-transactions/uc-01-record-transaction.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TransactionCreateRequest"}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"oneOf": [{"$ref": "#/components/schemas/AccountTransaction"}, {"$ref": "#/components/schemas/CardTransaction"}]}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"description": "`account.not_found`, `credit_card.not_found`, `holding.not_found`, `category.not_found`, `goal.not_found` \u2014 or the caller may not see it.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "409": {"description": "The purchase's own split exceeds 100% (FR-8.3), or names a completed Goal (`goal.completed`). The split applies to the purchase; buying into a funded Holding re-weights its existing split by value (OQ-168). Also `account.archived` (OQ-169), `holding.archived` (a sell or cash event on a user-archived Holding), `holding.insufficient_quantity`, `holding.cost_basis_below_zero` (OQ-171).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "422": {"description": "Validation failure \u2014 `transaction.currency_mismatch` (FR-2.2), `transaction.kind_not_allowed_for_target` (FR-3.1, OQ-201), `transaction.investment_not_allowed_on_account` (OQ-76), `transaction.subcategory_mismatch` (FR-3.4), `category.archived` (a new transaction can't use an archived Category \u2014 OQ-201), or `validation.failed` with `details[]` (missing fields per kind).\n", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/households/{householdId}/transactions/{transactionId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/TransactionId"}], "get": {"tags": ["Transactions"], "operationId": "getTransaction", "summary": "Get a transaction (either ledger)", "description": "Ids are UUIDs across both ledgers; the answer says which by `ledger` (OQ-201).", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LedgerItem"}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}, "patch": {"tags": ["Transactions"], "operationId": "editTransaction", "summary": "Edit a transaction", "description": "FR-3.2/OQ-39. Works for either ledger. Real complexity: every downstream effect (balance movement, holding quantity, budget accrual) is reversed using the old values, then reapplied with the new ones, inside one write \u2014 the same mechanic that drives the backdated-balance cascade if the date moves to a different month. **OQ-201:** an edit changes values, never identity \u2014 kind and target (account, card, Holding) never change; a fixed-term buy's terms edit only while its schedule hasn't started, and its schedule is recomputed. See docs/design/diagrams/sequences/record-transactions/uc-02-edit-transaction.html.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TransactionUpdateRequest"}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LedgerItem"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"description": "`transaction.not_found`, `category.not_found`.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "409": {"description": "`transaction.schedule_started` (a fixed-term buy whose schedule has posted keeps its amount, date and terms), `account.archived`, `holding.insufficient_quantity`, `holding.cost_basis_below_zero`.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "422": {"description": "`validation.failed` \u2014 e.g. a field the kind has no use for (quantity on a cash kind, rate on a market-priced buy); `transaction.subcategory_mismatch`; `category.archived` (a newly chosen archived Category \u2014 the one it already has may stay).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}, "delete": {"tags": ["Transactions"], "operationId": "deleteTransaction", "summary": "Delete a transaction", "description": "FR-3.2. Same reverse-effect complexity as Edit, without a reapply half. Deleting the buy that created a Holding deletes the Holding (snapshots, schedule, Goal split) when no other transaction references it (OQ-201); a deleted scheduled post isn't re-posted.\n", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"description": "`transaction.schedule_started`, `transaction.holding_in_use` (the buy created a Holding other transactions still reference \u2014 params: `count`), `holding.insufficient_quantity` (undoing the buy would take the Holding below zero).", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}}}, "/households/{householdId}/dashboard": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Insights"], "operationId": "getDashboard", "summary": "Get the Dashboard (v1: fixed panels)", "description": "FR-6.0 / OQ-67 \u2014 no stored layout in v1; widgets are v3.", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"netWorth": {"$ref": "#/components/schemas/InvestmentsOverviewReport/properties/netWorth"}, "comingDue": {"$ref": "#/components/schemas/InvestmentsOverviewReport/properties/comingDue"}, "payouts": {"$ref": "#/components/schemas/PayoutsReport"}, "balances": {"$ref": "#/components/schemas/MonthOverviewReport/properties/balances"}, "budgets": {"$ref": "#/components/schemas/MonthOverviewReport/properties/budgets"}, "goals": {"$ref": "#/components/schemas/MonthOverviewReport/properties/goals"}}}}}}}}}, "/households/{householdId}/dashboard/widgets": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "patch": {"tags": ["Insights"], "operationId": "editDashboardWidgets", "summary": "[v3] Edit dashboard layout (add/remove/reorder widgets)", "description": "FR-6.1/FR-6.8. The same widgetType can appear more than once with different settings (e.g. two net-worth-trend widgets, one per currency) \u2014 no uniqueness constraint on (user, widgetType).\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["widgets"], "properties": {"widgets": {"type": "array", "items": {"$ref": "#/components/schemas/DashboardWidgetInput"}}}}}}}, "responses": {"200": {"description": "OK"}, "422": {"$ref": "#/components/responses/ValidationError"}}, "x-deferred": "v3 (OQ-67)"}}, "/households/{householdId}/reports/{reportType}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Reports"], "operationId": "getReport", "summary": "Get a report (v1 fixed types: month-overview, investments-overview, payouts)", "description": "Fixed v1 report types (sequence review Q1 \u2014 reports expand later). Ad-hoc types (spending by category, income vs expense) are v2 (OQ-71).", "parameters": [{"name": "reportType", "in": "path", "required": true, "schema": {"type": "string", "enum": ["month-overview", "investments-overview", "payouts"]}}, {"name": "year", "in": "query", "required": false, "schema": {"type": "integer"}, "description": "month-overview"}, {"name": "month", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 12}, "description": "month-overview"}, {"name": "holdingIds", "in": "query", "required": false, "style": "form", "explode": false, "schema": {"type": "array", "items": {"type": "string"}}, "description": "payouts \u2014 holdings to include"}, {"name": "months", "in": "query", "required": false, "schema": {"type": "integer", "default": 12}, "description": "payouts \u2014 how many months back"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"oneOf": [{"$ref": "#/components/schemas/MonthOverviewReport"}, {"$ref": "#/components/schemas/InvestmentsOverviewReport"}, {"$ref": "#/components/schemas/PayoutsReport"}], "discriminator": {"propertyName": "reportType", "mapping": {"month-overview": "#/components/schemas/MonthOverviewReport", "investments-overview": "#/components/schemas/InvestmentsOverviewReport", "payouts": "#/components/schemas/PayoutsReport"}}}}}}, "400": {"$ref": "#/components/responses/BadRequest"}}}}, "/households/{householdId}/reports/transactions/export": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Reports"], "operationId": "exportTransactions", "summary": "[v2] Export transactions to CSV", "description": "FR-6.4. A formatted PDF is a nice-to-have, not a v1 commitment \u2014 CSV is the only guaranteed export format.\n", "parameters": [{"$ref": "#/components/parameters/StartDate"}, {"$ref": "#/components/parameters/EndDate"}], "responses": {"200": {"description": "OK", "content": {"text/csv": {"schema": {"type": "string"}}}}}, "x-deferred": "v2 (OQ-71)"}}, "/notifications": {"get": {"tags": ["Insights"], "operationId": "listNotifications", "summary": "List the current user's notification inbox", "description": "FR-6.10/OQ-45/OQ-105. Newest first. Read-only \u2014 listing never changes `seenAt`, so the app can poll it for the bell's unseen count (items with `seenAt: null`); opening the inbox then calls POST /notifications/seen with the IDs shown. v1 producers (OQ-68): Invite User (`invitation.received`) and the daily job (`holding.matured`).\n", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Notification"}}}}}}}}}}, "/notifications/seen": {"post": {"tags": ["Insights"], "operationId": "markNotificationsSeen", "summary": "Mark the notifications shown in the inbox as seen", "description": "FR-6.10/OQ-105. Marks exactly the given notifications \u2014 the ones the inbox showed \u2014 so one that arrived after the list stays unseen. IDs that are not the caller's, unknown or already seen are ignored (no error, nothing revealed). Idempotent.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["notificationIds"], "properties": {"notificationIds": {"type": "array", "minItems": 1, "maxItems": 200, "items": {"type": "string", "format": "uuid"}}}}}}}, "responses": {"204": {"description": "No Content"}}}}, "/notifications/{notificationId}": {"parameters": [{"$ref": "#/components/parameters/NotificationId"}], "delete": {"tags": ["Insights"], "operationId": "deleteNotification", "summary": "Delete a notification", "description": "FR-6.10/OQ-45. Hard delete, no archive. 404, not 403, for a notification belonging to someone else.\n", "responses": {"204": {"description": "No Content"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/audit-log/export": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Audit"], "operationId": "exportAuditLog", "summary": "Export the household's audit log to CSV", "description": "FR-7.2/OQ-46. Owner/Admin only. This is the Audit Log's ONLY access method in v1 \u2014 there is no in-app browsable table anywhere in this API. audit_log_entries carries no foreign keys by design (OQ-25/NFR-AUD-1) \u2014 actor/entity references are plain stored values, permanently orphan-tolerant.\n", "parameters": [{"$ref": "#/components/parameters/StartDate"}, {"$ref": "#/components/parameters/EndDate"}], "responses": {"200": {"description": "OK", "content": {"text/csv": {"schema": {"type": "string"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}}}}, "/households/{householdId}/holdings/{holdingId}/valuation-snapshots/{snapshotId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/HoldingId"}, {"$ref": "#/components/parameters/SnapshotId"}], "patch": {"tags": ["Investments"], "operationId": "editMarketValue", "summary": "Edit a manual market value", "description": "OQ-56. Only a `manual` snapshot (409 `snapshot.automatic_not_editable`) of this Holding (404 `snapshot.not_found`), never on an archived Holding (409 `holding.archived`); `asOf` not after today (422 `date.max`). An empty edit reads the snapshot back (OQ-178).\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"value": {"$ref": "#/components/schemas/NonNegativeMoney"}, "asOf": {"type": "string", "format": "date"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ValuationSnapshot"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/ValidationError"}}}, "delete": {"tags": ["Investments"], "operationId": "deleteMarketValue", "summary": "Delete a manual market value", "description": "OQ-56. Only a `manual` snapshot (409 `snapshot.automatic_not_editable`) of this Holding (404 `snapshot.not_found`), never on an archived Holding (409 `holding.archived`). The previous snapshot becomes the Holding's value again.\n", "responses": {"204": {"description": "No Content"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}}, "/households/{householdId}/index-rates": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}], "get": {"tags": ["Investments"], "operationId": "listIndexRates", "summary": "Every index with its value history (Rates tab)", "description": "FR-11.6 / OQ-59 \u2014 household-scoped, manual. Every index, in the in-code order, each with its values newest first; an index with no value has an empty list (OQ-178).\n", "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"type": "object", "required": ["data"], "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/IndexRateSeries"}}}}}}}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/households/{householdId}/index-rates/{index}/values": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/Index"}], "post": {"tags": ["Investments"], "operationId": "recordIndexRate", "summary": "Record an index value", "description": "FR-11.6. One value per index per day (409 `index_rate.duplicate_day`, OQ-172); `asOf` not after today (422 `date.max`). Any member but a Viewer (OQ-178).\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["value", "asOf"], "properties": {"value": {"type": "integer", "description": "Percent \u00d7 10,000 \u2014 10.50% = 105000 (bigint fixed-point, OQ-86)"}, "asOf": {"type": "string", "format": "date"}}}}}}, "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IndexRateValue"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/households/{householdId}/index-rates/{index}/values/{valueId}": {"parameters": [{"$ref": "#/components/parameters/HouseholdId"}, {"$ref": "#/components/parameters/Index"}, {"$ref": "#/components/parameters/IndexValueId"}], "patch": {"tags": ["Investments"], "operationId": "editIndexRate", "summary": "Edit an index value", "description": "FR-11.6. Owner/Admin, or the Member who recorded it (OQ-178). Another household's or index's value is 404 `index_rate.not_found`; moving it onto a day that has one is 409 `index_rate.duplicate_day`; `asOf` not after today (422 `date.max`). An empty edit reads the value back.\n", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "properties": {"value": {"type": "integer", "description": "Percent \u00d7 10,000 \u2014 10.50% = 105000 (bigint fixed-point, OQ-86)"}, "asOf": {"type": "string", "format": "date"}}}}}}, "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/IndexRateValue"}}}}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/Validation
