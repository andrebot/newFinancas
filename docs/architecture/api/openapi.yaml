openapi: "3.1.0"
info:
  title: New Finance App API
  version: "1.1.0"
  description: >-
    Backend API for the New Finance App — household finance management: personal & shared budgeting, expense tracking, and manual investment/net-worth tracking. Derived directly from docs/architecture/02-data-model.md (schema), docs/design/diagrams/sequences/ (per-use-case call sequences, HTTP routes, and status codes), and docs/requirements/02-functional-requirements.md (FR numbers referenced throughout). See docs/architecture/03-api-design.md for the design rationale behind every convention below — this file is the contract, that file is the "why."

    Open Banking sync (FR-2.5/2.6/3.3) and the FII/Stock Portfolio Builder (CUC-7, FR-5.5/5.6/5.7) are deferred whole and have no endpoints here — see 02-data-model.md's parked-Accessors note.



    **1.1.0 — Oct 2026 review** (`docs/architecture/10-api-review-2026-10.md`): Objectives → Goals, recurring removed, manual market values + index rates, fixed v1 reports under `/reports`, merged transaction browsing with cursor pagination, error envelope with namespaced codes + params (OQ-83), notifications as type + params (OQ-82). Deferred operations carry `x-deferred`.
servers:
  - url: /api/v1
    description: All endpoints below are relative to this base path.

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registration, login, session/password/MFA lifecycle. FR-1, CUC-2.
  - name: Households
    description: Household creation, membership, invitations, ownership. FR-1, CUC-1.
  - name: Accounts
    description: Financial Accounts and Credit Cards. FR-2, CUC-3.
  - name: Categories
    description: Category/Subcategory taxonomy. FR-10.
  - name: Budgets
    description: Budgets, targets, and periods. FR-4, CUC-5.
  - name: Investments
    description: Investment Holdings, Valuation Snapshots, schedule entries. FR-5, FR-11, CUC-6.
  - name: Goals
    description: 'Goals (formerly Objectives — OQ-66): create, edit, complete/reopen, delete; progress (InsightsManager, OQ-177).'
  - name: Transactions
    description: Account Transactions and Card Transactions — record, edit, delete, browse & filter. FR-3, CUC-4.
  - name: Insights
    description: Dashboard, reports, notifications. FR-6, CUC-8.
  - name: Audit
    description: Audit log export. FR-7, CUC-9.

  - name: Reports
    description: Fixed v1 report types (month-overview, investments-overview, payouts); ad-hoc types and CSV export are v2 (OQ-71).
paths:
  # =========================================================== AUTH
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new user (Create User)
      description: >
        FR-1.1/FR-1.15. Enrolls TOTP-based MFA and issues recovery codes
        inline — an account cannot be used to log in until MFA is
        enrolled, so this happens as part of registration, not a
        follow-up step. The enrollment stays unconfirmed until POST
        /auth/mfa/enrollment/confirm receives its first code (OQ-149). See
        docs/design/diagrams/sequences/identity-household/uc-11-create-user.html.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                firstName: { type: string, minLength: 1, description: "Trimmed — must not be blank" }
                lastName: { type: string, minLength: 1, description: "Trimmed — must not be blank" }
                language:
                  type: string
                  enum: [pt-BR, en-US]
                  description: >
                    The locale the user registered in — the account's starting
                    `preferences.language`, so the app doesn't switch language
                    once they sign in (OQ-161). pt-BR when absent.
      responses:
        "201":
          description: Created. Recovery codes are returned exactly once and never again.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [userId]
                    properties:
                      userId: { type: string, format: uuid }
                  - $ref: "#/components/schemas/MfaEnrollmentStart"
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login, step 1 of 2 — the password earns an MFA challenge
      description: >
        FR-1.2/OQ-30/OQ-145. Sign-in takes two steps: this one checks the
        password and answers a five-minute challenge token; POST
        /auth/mfa/verify (or /auth/mfa/recover) trades it, with the second
        factor, for a session. An account whose MFA enrollment was never
        confirmed gets no challenge: the answer is a fresh enrollment (new
        secret and recovery codes, replacing the old ones) to confirm
        through POST /auth/mfa/enrollment/confirm (OQ-149). Every failure here answers the same 401, so
        it never reveals which emails are registered. A success does not
        clear the address's failure count — only a full sign-in does. See
        docs/design/diagrams/sequences/identity-household/uc-14-login.html.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MfaChallenge"
                  - $ref: "#/components/schemas/MfaEnrollment"
                discriminator:
                  propertyName: step
                  mapping:
                    mfa: "#/components/schemas/MfaChallenge"
                    enroll: "#/components/schemas/MfaEnrollment"
        "401":
          description: >
            Invalid email or password — deliberately identical for both, to
            avoid leaking which emails are registered. Code:
            `auth.invalid_credentials`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMfa
      summary: Login, step 2 of 2 — the MFA code opens a session
      description: >
        FR-1.2/OQ-145. The access token is stateless (never persisted); the
        refresh token is the server-tracked, revocable record backing
        GET/DELETE /users/me/sessions. A wrong code counts against the same
        lockout as a wrong password (OQ-114).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, mfaCode]
              properties:
                challengeToken: { type: string }
                mfaCode: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/ChallengeRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/mfa/enrollment/confirm:
    post:
      tags: [Auth]
      operationId: confirmMfaEnrollment
      summary: Confirm MFA enrollment — the first authenticator code opens a session
      description: >
        FR-1.15/OQ-149. Proves the authenticator app was set up: the
        enrollment token from POST /auth/register (or from POST /auth/login
        while the enrollment is unconfirmed) and the app's current code.
        Confirms the enrollment once and opens a session. A wrong code
        counts against the same lockout as sign-in (OQ-114). See
        docs/design/diagrams/sequences/identity-household/uc-11b-confirm-mfa-enrollment.html.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentToken, mfaCode]
              properties:
                enrollmentToken: { type: string }
                mfaCode: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/EnrollmentRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Logout (current session only)
      description: >
        FR-1.9. Terminates the current session only; every other active
        session/device is unaffected. Idempotent — logging out an
        already-terminated session still returns 204.
      responses:
        "204": { description: No Content }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Exchange a refresh token for new tokens (rotation)
      description: >
        OQ-30/OQ-100. Returns a new access token (15 minutes) and a new
        refresh token (30 days); the presented refresh token is consumed,
        so each one works once. An unknown, expired, revoked or
        already-used refresh token is rejected — and its session is ended
        (a replayed token suggests theft). No access token needed: this is
        how a client gets one back after it expires.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401":
          description: "Code: `auth.refresh_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change password (authenticated)
      description: >
        FR-1.14. Requires re-supplying the current password; invalidates
        every other active session except the one making the change —
        contrast with Reset Password, which has no session to spare.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: >
            `password.too_short` (`params.min`), or `password.current_incorrect`
            — a wrong current password is a form error, not a 401, so the
            signed-in user isn't treated as signed out (OQ-115).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request a password reset token (step 1 of 2)
      description: >-
        FR-1.13. Always returns 202 regardless of whether the email matched an account — the branch is entirely internal, so there is no observable response difference that would leak account existence.
         The work happens after the 202 is sent, so the timing doesn't reveal it either (OQ-115). The reset link (`WEB_APP_URL` + `/reset-password?token=…`) works once, for 30 minutes; NotificationEngine emails it as `password.reset` in the user's language (OQ-113); the token is stored hashed in `password_reset_tokens`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Accepted }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Submit a reset token + new password (step 2 of 2)
      description: >
        FR-1.13. A valid token invalidates every active session, not
        just the one making the change (there is no "current session"
        to spare — the user isn't logged in at all).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        "200": { description: OK }
        "422":
          description: "`password.too_short` (`params.min`) — checked before the token is used up."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: "Token invalid, expired or already used: `password_reset.token_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/mfa/recover:
    post:
      tags: [Auth]
      operationId: recoverWithMfaCode
      summary: Login, step 2 of 2 — a single-use MFA recovery code opens a session
      description: >
        FR-1.16/OQ-145. In place of POST /auth/mfa/verify: needs the
        challenge token from the password step, so it is an alternate
        second factor, not a full account-recovery mechanism. If recovery
        codes are also exhausted/lost, there is no further self-service
        path (OQ-24). A code is used up only when it is right; a wrong one
        counts against the same lockout as login (OQ-114).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, recoveryCode]
              properties:
                challengeToken: { type: string }
                recoveryCode: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/ChallengeRejected" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current user's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [Auth]
      operationId: editCurrentUser
      summary: Edit profile (first/last name) and preferences (theme, language)
      description: >
        Email and password each have their own dedicated flow — this
        endpoint never touches either. See
        docs/design/diagrams/sequences/identity-household/uc-13-edit-user.html.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string, minLength: 1, description: "Trimmed — must not be blank" }
                lastName: { type: string, minLength: 1, description: "Trimmed — must not be blank" }
                preferences:
                  $ref: '#/components/schemas/UserPreferences'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Auth]
      operationId: deleteCurrentUser
      summary: Delete own account (GDPR right-to-erasure)
      description: >
        FR-1.17/FR-1.18/OQ-25. Unconditional — no rejection path exists,
        by design. Personal data (personal Accounts, Budgets, Goals,
        and everything they own) is hard-deleted; this user's
        contributions to shared household data are anonymized (actor
        reference nulled), not deleted. If this user was a household's
        Owner, FR-1.18's succession runs first, per household. One of
        the two widest-fan-out flows in the system — see
        docs/design/diagrams/sequences/identity-household/uc-12-delete-user.html for
        the full cascade traced call-by-call.
      responses:
        "204": { description: No Content }

  /users/me/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: List active sessions/devices
      description: FR-1.3.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
    delete:
      tags:
        - Auth
      operationId: revokeOtherSessions
      summary: Sign out all other sessions
      description: FR-1.3 / OQ-62 — deletes every session of the current user except the one making this call (same `SessionAccessor.deleteAllExceptCurrent` as Change Password).
      responses:
        '204':
          description: No Content

  /users/me/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Revoke a session
      description: >
        FR-1.3. 404, not 403, for a session belonging to someone else —
        deliberately doesn't confirm the session ID exists at all to a
        non-owner.
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/me/invitations:
    get:
      tags: [Households]
      operationId: listMyInvitations
      summary: List pending invitations addressed to the current user
      description: >
        FR-1.5/FR-1.10. Only ever shows this user's own pending invitations, with
        the household's and inviter's names — the invitee isn't a member yet,
        so it can't look them up (OQ-116).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReceivedInvitation" }

  # =========================================================== HOUSEHOLDS
  /households:
    get:
      tags: [Households]
      operationId: listHouseholds
      summary: List households the current user belongs to
      description: FR-1.8 — a user may belong to more than one household; each comes with the user's role in it (OQ-116).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MyHousehold" }
    post:
      tags: [Households]
      operationId: createHousehold
      summary: Create a household
      description: >
        FR-1.4. Also seeds the predefined default Category set — a
        Manager↔Manager effect routed through the Service Bus, invisible
        at this API layer (fire-and-forget, doesn't block this
        response). See
        docs/design/diagrams/sequences/identity-household/uc-01-create-household.html.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, description: "Trimmed — must not be blank" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyHousehold" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /households/{householdId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Households]
      operationId: getHousehold
      summary: Get a household
      description: One of the caller's households, with their role (OQ-117); 404 for anyone else's.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyHousehold" }
    delete:
      tags: [Households]
      operationId: deleteHousehold
      summary: Delete a household (Owner only, deliberate dissolution)
      description: >
        FR-1.7. Owner-only, cascading hard delete of every
        household-scoped record. Distinct from FR-1.18's auto-delete
        when the last member leaves (see DELETE
        .../members/{userId}) — this is the Owner choosing to dissolve
        the household outright. See
        docs/design/diagrams/sequences/identity-household/uc-02-delete-household.html.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /households/{householdId}/members:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Households]
      operationId: listMembers
      summary: List household members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/HouseholdMembership" }
        "404": { $ref: "#/components/responses/NotFound" }

  /households/{householdId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [Households]
      operationId: removeMember
      summary: Remove a member, or leave the household yourself
      description: >
        FR-1.11/FR-1.18/OQ-27. One endpoint, two actor/target
        relationships: `userId != ` the caller (Remove Member,
        Owner/Admin only, the Owner can never be removed this way) or
        `userId ==` the caller (Leave Household, self-service, no
        authorization check — if the leaver is the Owner, FR-1.18's
        succession runs atomically, or the household itself is deleted
        if no member remains). See
        docs/design/diagrams/sequences/identity-household/uc-07-remove-member.html
        and uc-08-leave-household.html.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /households/{householdId}/members/{userId}/role:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Households]
      operationId: changeMemberRole
      summary: Change a member's role
      description: >
        FR-1.12. Owner/Admin only; can never assign or remove the Owner
        role — attempting to set role=Owner here is rejected, use
        Transfer Ownership instead (FR-1.20).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [Admin, Member, Viewer] }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /households/{householdId}/transfer-ownership:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [Households]
      operationId: transferOwnership
      summary: Transfer ownership to another member
      description: >
        FR-1.20/OQ-28. Owner-only; a single atomic dual-role swap — the
        household is never observably left with zero or two Owners
        (enforced one layer down by a partial unique index on
        household_memberships). Distinct from FR-1.18's auto-succession:
        the transferring Owner remains a member, demoted to Admin, not
        leaving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { type: string, format: uuid }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /households/{householdId}/invitations:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Households]
      operationId: listHouseholdInvitations
      summary: List this household's invitations
      description: >
        Owner/Admin only. Every status, newest first, each with the invitee's
        name and email — they aren't members, so they can't be looked up
        otherwise (OQ-118).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/HouseholdInvitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Households]
      operationId: createInvitation
      summary: Invite a user to the household
      description: >
        FR-1.5/FR-1.19/OQ-26. Owner/Admin only. Target must be an
        existing, registered user matched by email — there is no
        invite-a-non-user flow (a real DB constraint one layer down,
        invited_user_id NOT NULL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [Admin, Member, Viewer] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No registered user matches the given email (FR-1.19).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Codes: `invitation.already_member` — the user is already a member of this household; `invitation.already_pending` — the user already has a pending invitation to it (OQ-109)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /households/{householdId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      tags: [Households]
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      description: FR-1.10. Owner/Admin only, before the invitee responds.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "Code: `invitation.not_found` — no such invitation in this household (OQ-109)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Code: `invitation.not_pending` — already accepted, declined or revoked."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /invitations/{invitationId}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    post:
      tags: [Households]
      operationId: acceptInvitation
      summary: Accept a household invitation
      description: >
        FR-1.10. Only the invited user can accept; it is resolved first (guarded), then the membership is added (OQ-118). Establishes
        membership with the role specified in the invitation.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  householdId: { type: string, format: uuid }
                  role: { type: string }
        "404":
          description: >
            `invitation.not_found` — no such invitation, or it isn't
            addressed to the caller: the same answer, so it never confirms one
            exists (OQ-118).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Code: `invitation.not_pending` — already accepted, declined or revoked."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /invitations/{invitationId}/decline:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    post:
      tags: [Households]
      operationId: declineInvitation
      summary: Decline a household invitation
      description: FR-1.10. Only the invited user can decline. No membership is ever created.
      responses:
        "200": { description: OK }
        "404":
          description: >
            `invitation.not_found` — no such invitation, or it isn't
            addressed to the caller: the same answer, so it never confirms one
            exists (OQ-118).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "Code: `invitation.not_pending` — already accepted, declined or revoked."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # =========================================================== ACCOUNTS
  /households/{householdId}/accounts:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: List the financial accounts visible to the current user
      description: >
        FR-2.3/FR-2.4. Every shared Account and the caller's own personal
        ones, open ones first, each with its current balance and its
        Credit Cards (OQ-175). Not paginated: a household has a handful.
      parameters:
        - name: visibility
          in: query
          schema: { type: string, enum: [personal, shared] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create a financial account
      description: >
        FR-2.1. `type` and `currency` are immutable once set (OQ-32) —
        there is no edit path for either, ever. The opening balance is
        the balance today (OQ-169). Cards may be attached inline, only
        to a checking, savings or credit card only Account (FR-2.7,
        422 `account.cards_not_allowed`); the Account and its cards are
        written together or not at all (OQ-175). Any member may create
        a personal Account; a shared one needs a role that may create
        (FR-1.7). See
        docs/design/diagrams/sequences/financial-accounts/uc-01-create-account.html.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /households/{householdId}/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get a financial account
      description: >
        Someone else's personal Account is 404 `account.not_found`, so
        its existence isn't revealed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Accounts]
      operationId: editAccount
      summary: Edit a financial account, including its Credit Cards
      description: >
        FR-2.9/OQ-35. Attaching, editing, and removing this account's
        Credit Cards is folded into this same request, not separate
        endpoints, and the whole edit is written together or not at all
        (OQ-175). There is no field for `type`/`currency` (OQ-32). A
        card can only attach to a checking/savings/credit_card_only
        account (FR-2.7, 422 `account.cards_not_allowed`); a card id not
        on this Account is 404 `credit_card.not_found`. Only the
        Account's creator may change its visibility (FR-2.3, 403). An
        archived Account can't be edited (409 `account.archived`). See
        docs/design/diagrams/sequences/financial-accounts/uc-02-edit-account.html.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /households/{householdId}/accounts/{accountId}/archive:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [Accounts]
      operationId: archiveAccount
      summary: Archive a financial account
      description: >
        FR-2.4/OQ-34. One-way, no unarchive path; archiving it again
        keeps the first time. Auto-disconnects Open Banking sync if
        linked (OQ-36) — currently unreachable since that trigger is
        parked.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /households/{householdId}/accounts/{accountId}/balances:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Accounts]
      operationId: getAccountBalances
      summary: Get an account's balance history by month
      description: >
        FR-5.4/FR-6.6. Backed by account_month_balances, oldest month
        first — the chain has no gaps (OQ-169). An open end reaches the
        chain's end.
      parameters:
        - $ref: "#/components/parameters/FromMonth"
        - $ref: "#/components/parameters/ToMonth"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AccountMonthBalance" }
        "404": { $ref: "#/components/responses/NotFound" }

  /households/{householdId}/credit-cards/{creditCardId}/balances:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/CreditCardId"
    get:
      tags: [Accounts]
      operationId: getCreditCardBalances
      summary: Get a credit card's outstanding-balance history by billing cycle
      description: >
        FR-2.10. One row per billing cycle, named by the month it closes
        in (OQ-170), oldest first. A card on someone else's personal
        Account is 404 `credit_card.not_found`.
      parameters:
        - $ref: "#/components/parameters/FromMonth"
        - $ref: "#/components/parameters/ToMonth"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CreditCardMonthBalance" }
        "404": { $ref: "#/components/responses/NotFound" }

  # =========================================================== CATEGORIES
  /households/{householdId}/categories:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories (with their subcategories)
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a category
      description: >
        FR-10.1. A custom Category supplementing the predefined default
        set every household is seeded with. Categories are shared
        household data with no recorded creator: any member but a Viewer
        may create one; editing and archiving are Owner/Admin (FR-1.7,
        OQ-174). Created without Subcategories — add them with
        `editCategory`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - icon
                - color
              properties:
                name: { type: string }
                icon: { $ref: "#/components/schemas/CategoryIcon" }
                color: { $ref: "#/components/schemas/CategoryColor" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /households/{householdId}/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Get a category (with its subcategories)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Categories]
      operationId: editCategory
      summary: Edit a category, including its Subcategories
      description: >
        FR-10.2. Creating a new Subcategory under this Category is
        folded into this same request. The two-level limit is
        structural — a Subcategory payload has no field to nest a
        further level, so there is nothing to reject at runtime.
        Atomic (OQ-173): a Subcategory `id` not under this Category
        refuses the whole edit with 404 `subcategory.not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /households/{householdId}/categories/{categoryId}/archive:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/CategoryId"
    post:
      tags: [Categories]
      operationId: archiveCategory
      summary: Archive a category (cascades to its Subcategories)
      description: >
        FR-10.3/FR-10.4. One-way. Cascades: stamps this Category's
        archived_at, then every live Subcategory's, in one transaction.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /households/{householdId}/categories/{categoryId}/subcategories/{subcategoryId}/archive:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/CategoryId"
      - $ref: "#/components/parameters/SubcategoryId"
    post:
      tags: [Categories]
      operationId: archiveSubcategory
      summary: Archive a single subcategory (parent/siblings unaffected)
      description: FR-10.3/FR-10.4. One-way, single-row — no cascade in this direction.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # =========================================================== BUDGETS
  /households/{householdId}/budgets:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Budgets]
      operationId: listBudgets
      summary: List budgets
      description: >
        Every shared Budget and the caller's own personal ones, by name —
        not paginated, like listCategories: the claim-aware Category
        picker needs every claim in the caller's scopes (OQ-176). The
        definitions only; spend against target is the Budget status read
        (FR-4.3).
      parameters:
        - name: visibility
          in: query
          schema: { type: string, enum: [personal, shared] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Budget" }
    post:
      tags: [Budgets]
      operationId: createBudget
      summary: Create a budget
      description: >
        FR-4.1/FR-4.7. A Category or Subcategory can be claimed by at
        most one Budget per scope — a real partial-unique-index
        constraint one layer down, not application logic. A target
        claimed by another Budget in the scope is 409
        `budget.target_already_claimed`, with `params` naming the target
        and the claiming `budgetId`; one that isn't this household's, or
        is archived, is 422 `field.invalid_option` on `targets[i]`
        (OQ-176). A target sent twice counts once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A target is already claimed by another Budget in this scope (FR-4.7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /households/{householdId}/budgets/{budgetId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/BudgetId"
    get:
      tags: [Budgets]
      operationId: getBudget
      summary: Get a budget
      description: >
        Someone else's personal Budget is 404 `budget.not_found`, so it
        never confirms one exists (OQ-176).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Budgets]
      operationId: editBudget
      summary: Edit a budget
      description: >
        FR-4.9. Changing targetAmount only affects the current and
        future Budget Periods; past periods keep the target actually in
        effect at the time. `targets` replaces the whole set; the name,
        target and targets are written together or not at all (OQ-176).
        A target the Budget already claims stays claimable when its
        Category has since been archived; a new one may not be.
        Currency and visibility never change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A newly assigned target is already claimed elsewhere (FR-4.7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Budgets]
      operationId: deleteBudget
      summary: Delete a budget
      description: >
        FR-4.10/OQ-40. Hard delete of the live definition only — unlike
        every other archive/delete decision in this project, past
        Budget Periods are unaffected (budget_periods.budget_id is a
        nullable FK, ON DELETE SET NULL) and survive on their own.
        Releases every Category/Subcategory this Budget had claimed.
        Deleting it again is 404 `budget.not_found`.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /households/{householdId}/budgets/{budgetId}/periods:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/BudgetId"
    get:
      tags: [Budgets]
      operationId: listBudgetPeriods
      summary: Get a budget's monthly period history (target vs. actual spend)
      description: >
        FR-4.3/FR-4.9. Backs the Budget status display. Months as
        `YYYY-MM`, both ends optional (OQ-176, like the balance
        histories); oldest first. Only months a period was opened for
        are listed.
      parameters:
        - $ref: "#/components/parameters/FromMonth"
        - $ref: "#/components/parameters/ToMonth"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BudgetPeriod" }
        "404": { $ref: "#/components/responses/NotFound" }

  # =========================================================== INVESTMENTS
  /households/{householdId}/accounts/{accountId}/holdings:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Investments]
      operationId: listHoldings
      summary: List Investment Holdings for an account
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InvestmentHolding" }
  /households/{householdId}/holdings/{holdingId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/HoldingId"
    get:
      tags: [Investments]
      operationId: getHolding
      summary: Get an Investment Holding
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestmentHolding" }
    patch:
      tags: [Investments]
      operationId: editHolding
      summary: Edit a Holding's goal allocations
      description: >
        FR-8.2/8.3/OQ-48. Goal allocations only (narrowed Oct 2026) — the
        Holding is the entry point, never the Goal (OQ-48). Position
        changes only through transactions; market value has its own
        endpoints under /valuation-snapshots (OQ-56). Replace-all over the
        Goals the caller can see: a share funding a Goal the caller can't see
        (another member's personal one) is kept as it is and still counts
        toward the 100% (OQ-178). Rejected with 409
        `goal.allocation_exceeds_100` past 100%, 409 `goal.completed` when a
        completed Goal's share is grown or added (kept unchanged or removed is
        fine — FR-8.9), 409 `holding.archived` on an archived Holding, 404
        `goal.not_found` for a Goal the actor can't see (OQ-168), 422 for a
        Goal listed twice (`array.duplicate`). Answers the split the caller
        can see. See
        docs/design/diagrams/sequences/track-investments/uc-02-edit-holding.html.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldingUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldingAllocations" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: This Holding's total allocated percentage would exceed 100% (FR-8.3), a completed Goal's share would grow (`goal.completed`, FR-8.9, OQ-168), or the Holding is archived (`holding.archived`, OQ-178).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /households/{householdId}/holdings/{holdingId}/allocations:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/HoldingId"
    get:
      tags: [Investments]
      operationId: listHoldingAllocations
      summary: A Holding's Goal split
      description: >
        The Goal Allocation Editor's read (OQ-178): the shares funding the
        Goals the caller can see, oldest first; a share funding someone else's
        personal Goal is left out, never revealed.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldingAllocations" }
        "404": { $ref: "#/components/responses/NotFound" }

  /households/{householdId}/holdings/{holdingId}/archive:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/HoldingId"
    post:
      tags: [Investments]
      operationId: archiveHolding
      summary: Archive a matured Investment Holding
      description: >
        FR-5.8/OQ-43/OQ-72. One-way, no unarchive — Valuation Snapshot history
        and Goal allocations both depend on the Holding continuing
        to exist. Only a fixed-term Holding past its due date (its redemption
        entry's date) that still has a position: any other is 409
        `holding.not_matured` — a zeroed Holding archives itself (OQ-178).
        Archiving an archived Holding changes nothing.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /households/{householdId}/holdings/{holdingId}/valuation-snapshots:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/HoldingId"
    get:
      tags: [Investments]
      operationId: listValuationSnapshots
      summary: Get a Holding's valuation history
      description: >
        FR-5.2/FR-5.4. Market-priced assetTypes only (OQ-51) — a
        fixed-term Holding never populates this; read its costBasis
        instead. Newest first.
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ValuationSnapshot" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags:
        - Investments
      operationId: recordMarketValue
      summary: Record a market value (manual Valuation Snapshot)
      description: >
        FR-5.2 / OQ-56 — market-priced Holdings only (409
        `holding.not_market_priced`), never an archived one (409
        `holding.archived`); `asOf` not after today (422 `date.max`, OQ-178).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValuationSnapshotInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValuationSnapshot'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /households/{householdId}/holdings/{holdingId}/schedule-entries:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/HoldingId"
    get:
      tags: [Investments]
      operationId: listScheduleEntries
      summary: Get a fixed-term Holding's contractual cash-event schedule
      description: >
        FR-11.1/FR-11.2. Read-only from this API — entries are computed
        by InvestmentProductEngine at purchase time (OQ-53) and posted
        automatically by a scheduled trigger (FR-11.3), never created
        directly through this endpoint.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InvestmentScheduleEntry" }
        "404": { $ref: "#/components/responses/NotFound" }

  # =========================================================== TRANSACTIONS
  /households/{householdId}/transactions:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: Browse & filter all transactions (both ledgers, newest first)
      description: >-
        FR-3.12 / OQ-61 — not limited to a month; cursor pagination on (date, id). Owned by TransactionManager (read-ownership rule).
      parameters:
        - name: kinds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Transaction kinds
        - name: accountIds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Accounts
        - name: creditCardIds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Credit cards
        - name: categoryIds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Categories
        - name: holdingId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Investment transactions linked to this Holding
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
    post:
      tags: [Transactions]
      operationId: recordTransaction
      summary: Record a transaction (unified entry point)
      description: >
        FR-3.1/OQ-39. One unified entry point for both Account and Card
        Transactions — `target` narrows which kinds are valid, itself
        data-driven, not a second code path. The investment-buy-against-
        a-fixed-term-instrument sub-case is one of the two
        widest-fan-out flows in the whole system (the other is Delete
        User) — `assetType`/`ticker`/`quantity` are required for every
        investment kind, and `rate`/`dueDate` additionally for an
        investment_buy against a fixed-term instrument type (OQ-50,
        FR-11.2) — neither is derivable from `assetType` alone, since a
        CDB/LCI/LCA's specific term and rate are negotiated per contract.
        This is also now
        the *only* creation path for an Investment Holding — the
        once-separate onboarding backfill endpoint was retired (OQ-53).
        `allocations` optionally funds one or more Goals from this
        same investment_buy call (FR-8.2/OQ-54) — one call in, no
        separate PATCH /holdings/{holdingId} follow-up required.
        No recurring option (FR-3.5 removed, OQ-55). Investment kinds are
        rejected on credit-card-only accounts (422
        `transaction.investment_not_allowed_on_account`, OQ-76); a full
        sell/redemption auto-archives the Holding (OQ-72). See
        docs/design/diagrams/sequences/record-transactions/uc-01-record-transaction.html.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AccountTransaction"
                  - $ref: "#/components/schemas/CardTransaction"
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The purchase's own split exceeds 100% (FR-8.3), or names a completed Goal (`goal.completed`). The split applies to the purchase; buying into a funded Holding re-weights its existing split by value (OQ-168).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Validation failure — includes currency mismatch (FR-2.2) and
            kind invalid for the target's type (FR-3.1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /households/{householdId}/transactions/{transactionId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/TransactionId"
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get an Account Transaction
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountTransaction" }
    patch:
      tags: [Transactions]
      operationId: editTransaction
      summary: Edit a transaction
      description: >
        FR-3.2/OQ-39. Works for either ledger. Real complexity: every
        downstream effect (balance movement, holding quantity, budget
        accrual) is reversed using the old values, then reapplied with
        the new ones, inside one write — the same mechanic that drives
        the backdated-balance cascade if the date moves to a different
        month. See
        docs/design/diagrams/sequences/record-transactions/uc-02-edit-transaction.html.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountTransaction" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Transactions]
      operationId: deleteTransaction
      summary: Delete a transaction
      description: >
        FR-3.2. Same reverse-effect complexity as Edit, without a
        reapply half.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }

  /households/{householdId}/credit-cards/{creditCardId}/transactions:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/CreditCardId"
    get:
      tags: [Transactions]
      operationId: listCardTransactions
      summary: List Card Transactions for a credit card
      description: FR-3.9. Its own ledger, separate from Account Transactions (OQ-16).
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CardTransaction" }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  # =========================================================== INSIGHTS
  /households/{householdId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Insights]
      operationId: getDashboard
      summary: 'Get the Dashboard (v1: fixed panels)'
      description: >-
        FR-6.0 / OQ-67 — no stored layout in v1; widgets are v3.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  netWorth:
                    $ref: '#/components/schemas/InvestmentsOverviewReport/properties/netWorth'
                  comingDue:
                    $ref: '#/components/schemas/InvestmentsOverviewReport/properties/comingDue'
                  payouts:
                    $ref: '#/components/schemas/PayoutsReport'
                  balances:
                    $ref: '#/components/schemas/MonthOverviewReport/properties/balances'
                  budgets:
                    $ref: '#/components/schemas/MonthOverviewReport/properties/budgets'
                  goals:
                    $ref: '#/components/schemas/MonthOverviewReport/properties/goals'

  /households/{householdId}/dashboard/widgets:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    patch:
      tags: [Insights]
      operationId: editDashboardWidgets
      summary: '[v3] Edit dashboard layout (add/remove/reorder widgets)'
      description: >
        FR-6.1/FR-6.8. The same widgetType can appear more than once
        with different settings (e.g. two net-worth-trend widgets, one
        per currency) — no uniqueness constraint on (user, widgetType).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [widgets]
              properties:
                widgets:
                  type: array
                  items: { $ref: "#/components/schemas/DashboardWidgetInput" }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/ValidationError" }
      x-deferred: v3 (OQ-67)

  /households/{householdId}/reports/{reportType}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - name: reportType
        in: path
        required: true
        schema:
          type: string
          enum:
            - spend-by-category
            - income-vs-expense
            - account-balance-by-month
            - net-worth-trend
            - budget-status
        description: >
          Reference data (FR-6.7's Widget library), not a hardcoded
          branch — this enum lists the current v1 set; a new report
          type is additive.
    get:
      tags:
        - Reports
      operationId: getReport
      summary: 'Get a report (v1 fixed types: month-overview, investments-overview, payouts)'
      description: >-
        Fixed v1 report types (sequence review Q1 — reports expand later). Ad-hoc types (spending by category, income vs expense) are v2 (OQ-71).
      parameters:
        - name: reportType
          in: path
          required: true
          schema:
            type: string
            enum:
              - month-overview
              - investments-overview
              - payouts
        - name: year
          in: query
          required: false
          schema:
            type: integer
          description: month-overview
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: month-overview
        - name: holdingIds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: payouts — holdings to include
        - name: months
          in: query
          required: false
          schema:
            type: integer
            default: 12
          description: payouts — how many months back
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MonthOverviewReport'
                  - $ref: '#/components/schemas/InvestmentsOverviewReport'
                  - $ref: '#/components/schemas/PayoutsReport'
                discriminator:
                  propertyName: reportType
                  mapping:
                    month-overview: '#/components/schemas/MonthOverviewReport'
                    investments-overview: '#/components/schemas/InvestmentsOverviewReport'
                    payouts: '#/components/schemas/PayoutsReport'
        "400": { $ref: "#/components/responses/BadRequest" }

  /households/{householdId}/reports/transactions/export:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags:
        - Reports
      operationId: exportTransactions
      summary: '[v2] Export transactions to CSV'
      description: >
        FR-6.4. A formatted PDF is a nice-to-have, not a v1 commitment
        — CSV is the only guaranteed export format.
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
      x-deferred: v2 (OQ-71)

  /notifications:
    get:
      tags: [Insights]
      operationId: listNotifications
      summary: List the current user's notification inbox
      description: >
        FR-6.10/OQ-45/OQ-105. Newest first. Read-only — listing never
        changes `seenAt`, so the app can poll it for the bell's unseen
        count (items with `seenAt: null`); opening the inbox then calls
        POST /notifications/seen with the IDs shown. v1 producers
        (OQ-68): Invite User (`invitation.received`) and the daily job
        (`holding.matured`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }

  /notifications/seen:
    post:
      tags: [Insights]
      operationId: markNotificationsSeen
      summary: Mark the notifications shown in the inbox as seen
      description: >
        FR-6.10/OQ-105. Marks exactly the given notifications — the ones
        the inbox showed — so one that arrived after the list stays
        unseen. IDs that are not the caller's, unknown or already seen
        are ignored (no error, nothing revealed). Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notificationIds]
              properties:
                notificationIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        "204": { description: No Content }

  /notifications/{notificationId}:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    delete:
      tags: [Insights]
      operationId: deleteNotification
      summary: Delete a notification
      description: >
        FR-6.10/OQ-45. Hard delete, no archive. 404, not 403, for a
        notification belonging to someone else.
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }

  # =========================================================== AUDIT
  /households/{householdId}/audit-log/export:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Audit]
      operationId: exportAuditLog
      summary: Export the household's audit log to CSV
      description: >
        FR-7.2/OQ-46. Owner/Admin only. This is the Audit Log's ONLY
        access method in v1 — there is no in-app browsable table
        anywhere in this API. audit_log_entries carries no foreign keys
        by design (OQ-25/NFR-AUD-1) — actor/entity references are plain
        stored values, permanently orphan-tolerant.
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
  /households/{householdId}/holdings/{holdingId}/valuation-snapshots/{snapshotId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: '#/components/parameters/HoldingId'
      - $ref: '#/components/parameters/SnapshotId'
    patch:
      tags:
        - Investments
      operationId: editMarketValue
      summary: Edit a manual market value
      description: >
        OQ-56. Only a `manual` snapshot (409 `snapshot.automatic_not_editable`)
        of this Holding (404 `snapshot.not_found`), never on an archived Holding
        (409 `holding.archived`); `asOf` not after today (422 `date.max`). An
        empty edit reads the snapshot back (OQ-178).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  $ref: '#/components/schemas/NonNegativeMoney'
                asOf:
                  type: string
                  format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValuationSnapshot'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Investments
      operationId: deleteMarketValue
      summary: Delete a manual market value
      description: >
        OQ-56. Only a `manual` snapshot (409 `snapshot.automatic_not_editable`)
        of this Holding (404 `snapshot.not_found`), never on an archived Holding
        (409 `holding.archived`). The previous snapshot becomes the Holding's
        value again.
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /households/{householdId}/index-rates:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags:
        - Investments
      operationId: listIndexRates
      summary: Every index with its value history (Rates tab)
      description: >
        FR-11.6 / OQ-59 — household-scoped, manual. Every index, in the
        in-code order, each with its values newest first; an index with no
        value has an empty list (OQ-178).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexRateSeries'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{householdId}/index-rates/{index}/values:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: '#/components/parameters/Index'
    post:
      tags:
        - Investments
      operationId: recordIndexRate
      summary: Record an index value
      description: >
        FR-11.6. One value per index per day (409 `index_rate.duplicate_day`,
        OQ-172); `asOf` not after today (422 `date.max`). Any member but a
        Viewer (OQ-178).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
                - asOf
              properties:
                value:
                  type: integer
                  description: Percent × 10,000 — 10.50% = 105000 (bigint fixed-point, OQ-86)
                asOf:
                  type: string
                  format: date
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexRateValue'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /households/{householdId}/index-rates/{index}/values/{valueId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: '#/components/parameters/Index'
      - $ref: '#/components/parameters/IndexValueId'
    patch:
      tags:
        - Investments
      operationId: editIndexRate
      summary: Edit an index value
      description: >
        FR-11.6. Owner/Admin, or the Member who recorded it (OQ-178). Another
        household's or index's value is 404 `index_rate.not_found`; moving it
        onto a day that has one is 409 `index_rate.duplicate_day`; `asOf` not
        after today (422 `date.max`). An empty edit reads the value back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: integer
                  description: Percent × 10,000 — 10.50% = 105000 (bigint fixed-point, OQ-86)
                asOf:
                  type: string
                  format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexRateValue'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Investments
      operationId: deleteIndexRate
      summary: Delete an index value
      description: >
        FR-11.6. Owner/Admin, or the Member who recorded it (OQ-178); the
        index's previous value becomes its latest. Another household's or
        index's value is 404 `index_rate.not_found`.
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /households/{householdId}/goals:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags:
        - Goals
      operationId: listGoals
      summary: List goals (View Goals' definitions)
      description: >
        Every shared Goal and the caller's own personal ones in one status,
        soonest due first — not paginated, like listBudgets. The
        definitions only: progress is a reshaped read, listGoalProgress
        (OQ-174, OQ-177).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - completed
            default: active
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Goal" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags:
        - Goals
      operationId: createGoal
      summary: Create a Goal
      description: >
        FR-8.1. Starts unfunded — allocating a Holding to it happens later, from the Holding's own edit flow (OQ-48).
        A personal Goal is anyone's own (a Viewer included); a shared one needs Owner, Admin or Member (OQ-177).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /households/{householdId}/goal-progress:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags:
        - Goals
      operationId: listGoalProgress
      summary: List goals with progress per currency (View Goals)
      description: >
        FR-8.5/OQ-49. The Goals listGoals returns, each with its
        contributions in their Holdings' own currencies and the Holdings
        funding it. A reshaped read — InsightsManager's, built with M4
        (OQ-177); cross-currency blending is the frontend's (FR-8.4).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - completed
            default: active
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GoalWithProgress' }
        "404": { $ref: "#/components/responses/NotFound" }
  /households/{householdId}/goals/{goalId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/GoalId"
    get:
      tags:
        - Goals
      operationId: getGoal
      summary: Get a Goal
      description: >
        Someone else's personal Goal is 404 `goal.not_found`, so it never
        confirms one exists (OQ-177).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags:
        - Goals
      operationId: editGoal
      summary: Edit a Goal's name/target/due date
      description: >
        FR-8.1. Never editable here: allocations — see PATCH /holdings/{holdingId} (OQ-48) — and the visibility.
        A completed Goal can be edited too: only new funding is closed to it (FR-8.9, OQ-177).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags:
        - Goals
      operationId: deleteGoal
      summary: Delete a Goal
      description: >
        FR-8.6/OQ-47. Hard delete, no history — "this goal no longer makes sense." The underlying Investment Holdings are never deleted; only this Goal's allocations cascade away.
        Deleting it again is 404 `goal.not_found`.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /households/{householdId}/goals/{goalId}/complete:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/GoalId"
    post:
      tags:
        - Goals
      operationId: completeGoal
      summary: Complete a Goal ("this goal is completed")
      description: >
        FR-8.8/OQ-47. Unlike every other complete in this project, this one is reversible — see POST .../reopen. Keeps the record intact so historical progress-by-month stays viewable.
        Completing a completed Goal changes nothing (OQ-177).
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /households/{householdId}/goals/{goalId}/reopen:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/GoalId"
    post:
      tags:
        - Goals
      operationId: reopenGoal
      summary: Reopen a Goal
      description: >
        FR-8.9. The only "reopen" endpoint in the entire API — every other completed entity in this project stays completed, one-way.
        Reopening an active Goal changes nothing (OQ-177).
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /households/{householdId}/goals/{goalId}/progress:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/GoalId"
    get:
      tags:
        - Goals
      operationId: getGoalProgress
      summary: Get a Goal's funding progress, current or by month
      description: >
        FR-8.5/FR-8.7/OQ-49. Returns each allocated Holding's contribution in its own native currency — cross-currency blending into one target-currency figure is a frontend concern, using a rate the user enters on the progress view itself (FR-8.4), not computed or stored here.
      parameters:
        - name: year
          in: query
          schema: { type: integer }
        - name: month
          in: query
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalProgress" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived, stateless access token (OQ-30). Not required for
        registration, login, password-reset request/confirm, or MFA
        recovery — see each operation's `security` override.

  parameters:
    HouseholdId: { name: householdId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    CreditCardId: { name: creditCardId, in: path, required: true, schema: { type: string, format: uuid } }
    CategoryId: { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    SubcategoryId: { name: subcategoryId, in: path, required: true, schema: { type: string, format: uuid } }
    BudgetId: { name: budgetId, in: path, required: true, schema: { type: string, format: uuid } }
    HoldingId: { name: holdingId, in: path, required: true, schema: { type: string, format: uuid } }
    TransactionId: { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    StartDate:
      name: startDate
      in: query
      description: Inclusive, ISO 8601 date (YYYY-MM-DD).
      schema: { type: string, format: date }
    EndDate:
      name: endDate
      in: query
      description: Inclusive, ISO 8601 date (YYYY-MM-DD).
      schema: { type: string, format: date }
    FromMonth:
      name: from
      in: query
      description: First month, inclusive (YYYY-MM); left out, the history's first.
      schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
    ToMonth:
      name: to
      in: query
      description: Last month, inclusive (YYYY-MM); left out, the history's last.
      schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from the previous page's `nextCursor`
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Index:
      name: index
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IndexCode'
    IndexValueId:
      name: valueId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 'Malformed request (e.g. unparseable date range or unknown enum value). Codes: e.g. `report.unknown_type_or_range`, `password_reset.token_invalid`.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 'Missing, invalid, or expired credentials. Codes: e.g. `auth.unauthenticated` (no valid access token on a protected endpoint), `auth.invalid_credentials` (identical for unknown user and wrong password — OQ-114, OQ-145).'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ChallengeRejected:
      description: 'The second sign-in step failed (OQ-145). Codes: `auth.mfa_invalid` (wrong MFA or recovery code — named, since the caller already proved the password; counted against the lockout), `auth.challenge_expired` (challenge token expired or not valid — start again from the password).'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EnrollmentRejected:
      description: 'The enrollment was not confirmed (OQ-149). Codes: `auth.mfa_invalid` (wrong authenticator code — counted against the lockout), `auth.enrollment_expired` (enrollment token expired or not valid, or the enrollment is already confirmed — sign in again, which answers a fresh enrollment while it is unconfirmed).'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: 'Too many failed attempts for this email address (OQ-114) — answered the same whether or not an account exists. Code: `auth.too_many_attempts`, `params.retryAfterMinutes`.'
      headers:
        Retry-After:
          description: Seconds until the address may try again.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 'Authenticated, but not permitted to perform this action. Codes: `auth.forbidden`.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 'Resource does not exist, or does not belong to the caller. Codes: e.g. `household.not_found` (also when the caller is not a member — OQ-117), `household.member_not_found`, `session.not_found`, `notification.not_found`, `index_rate.not_found`, `holding.not_found`, `snapshot.not_found`, `category.not_found`, `subcategory.not_found`, `account.not_found`, `credit_card.not_found`, `budget.not_found`, `goal.not_found`, `invitation.invitee_not_registered`.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "The request conflicts with the resource's current state. Codes: e.g. `goal.allocation_exceeds_100`, `goal.completed`, `account.archived` (an archived Account can't be edited — OQ-175), `budget.target_already_claimed` (params: the target and the claiming `budgetId` — OQ-176), `invitation.not_pending`, `snapshot.automatic_not_editable`, `holding.not_market_priced`, `holding.archived` (OQ-178), `holding.not_matured` (OQ-178), `index_rate.duplicate_day` (one value per index per day — OQ-172), `user.email_taken`, `household.changed` (membership changed by a concurrent request — retry, OQ-107)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: 'Request body failed validation. Codes: `validation.failed` with `details[]`, or specific codes such as `password.too_short`, `transaction.investment_not_allowed_on_account`, `account.cards_not_allowed` (FR-2.7).'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---------------------------------------------------- shared
    Error:
      type: object
      required:
        - error
      description: OQ-83 / NFR-I18N-3 — never display `message`; the frontend localizes `code` + `params` from the shared i18n catalog.
      properties:
        error:
          type: object
          required:
            - code
            - message
            - correlationId
          properties:
            code:
              type: string
              description: Namespaced, stable, e.g. `goal.allocation_exceeds_100`, `password.too_short`, `auth.invalid_credentials`
              example: goal.allocation_exceeds_100
            params:
              type: object
              additionalProperties: true
              description: Raw values for the localized message (IDs, numbers, ISO dates) — never display text
              example:
                current: 85
                requested: 30
            message:
              type: string
              description: English, for developers/logs only — never shown to users
            details:
              type: array
              description: Field-level errors
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                    example: allocations[1].percentage
                  code:
                    type: string
                    example: number.max
                  params:
                    type: object
                    additionalProperties: true
            correlationId:
              type: string
              description: Matches the server logs (NFR-OBS-1)

    Pagination:
      type: object
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }

    Currency:
      type: string
      enum: [BRL, USD]
      description: >
        ISO 4217 code of a currency the app supports — BRL and USD in v1.
        Money is never converted between them (FR-2.2); adding a currency
        means adding it here and to the formatting it needs.
    Money:
      type: integer
      description: >
        An integer count of the currency's minor unit (cents for
        USD/BRL, the only two currencies in v1 scope) — e.g. 1234.56
        USD is transmitted as 123456, never as a decimal or a string.
        Matches the underlying bigint column exactly, so no
        stringify/parse conversion happens anywhere in the stack (DB,
        backend, API, or frontend). See 03-api-design.md.
    NonNegativeMoney:
      type: integer
      minimum: 0
      description: Money (minor units, as `Money`) that can't be negative — a manual market value (OQ-178).
      example: 123456

    PositiveMoney:
      type: integer
      minimum: 1
      description: Money (minor units, as `Money`) that must be more than zero — a Budget's monthly target (OQ-176), a Goal's target (OQ-177).
      example: 123456

    Quantity:
      type: integer
      description: >
        An integer count of 1e-8 units (8 decimal places, scale factor
        100,000,000) — the same fixed-point treatment as Money, applied
        to Investment Holding quantity instead of currency. 10 shares is
        transmitted as 1000000000; Tesouro Direto's 0.01 minimum
        increment is 100000. One fixed exponent for every assetType
        (stock/FII/fixed-income/fund) rather than a per-instrument
        lookup, since there's no ISO-style standard giving investment
        quantity a natural exponent the way currency has minor units.
        Matches the underlying bigint column exactly — never a decimal
        or a string. See 03-api-design.md.
      example: 1000000000

    MfaChallenge:
      type: object
      required: [step, challengeToken]
      properties:
        step: { type: string, enum: [mfa] }
        challengeToken: { type: string, description: "Five-minute JWT proving the password matched; only POST /auth/mfa/verify and /auth/mfa/recover accept it (OQ-145)" }
    MfaEnrollmentStart:
      type: object
      required: [enrollmentToken, totpSecret, otpauthUri, recoveryCodes]
      properties:
        enrollmentToken: { type: string, description: "Fifteen-minute JWT; only POST /auth/mfa/enrollment/confirm accepts it (OQ-149)" }
        totpSecret: { type: string, description: "Base32 TOTP secret, for entering the key by hand" }
        otpauthUri: { type: string, description: "otpauth:// URI the QR code encodes — issuer, account and TOTP settings included" }
        recoveryCodes:
          type: array
          description: Single-use recovery codes, returned this once (stored only as hashes)
          items: { type: string }
    MfaEnrollment:
      description: The password step's answer while the MFA enrollment is unconfirmed (OQ-149).
      allOf:
        - type: object
          required: [step]
          properties:
            step: { type: string, enum: [enroll] }
        - $ref: "#/components/schemas/MfaEnrollmentStart"
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string, description: "Short-lived JWT, stateless (OQ-30)" }
        refreshToken: { type: string, description: "Server-tracked, revocable (backs sessions)" }

    # ---------------------------------------------------- identity & household
    User:
      type: object
      required: [id, email, firstName, lastName, createdAt, preferences]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        createdAt: { type: string, format: date-time }
        preferences:
          $ref: '#/components/schemas/UserPreferences'

    Session:
      type: object
      required: [id, deviceInfo, createdAt, lastUsedAt, current]
      properties:
        id: { type: string, format: uuid }
        deviceInfo: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean, description: "True for the session making this request (OQ-106) — the device the user is on" }

    Household:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    HouseholdInvitation:
      description: One of a household's invitations, as its Owner/Admin sees it (OQ-118).
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          required: [inviteeFirstName, inviteeLastName, inviteeEmail]
          properties:
            inviteeFirstName: { type: string }
            inviteeLastName: { type: string }
            inviteeEmail: { type: string, format: email }

    MyHousehold:
      description: A household the current user belongs to, with their role in it (OQ-116).
      allOf:
        - $ref: '#/components/schemas/Household'
        - type: object
          required: [role]
          properties:
            role: { type: string, enum: [Owner, Admin, Member, Viewer] }

    ReceivedInvitation:
      type: object
      description: >
        A pending invitation addressed to the current user, with the names
        they can't look up yet (OQ-116). The inviter's names are null when
        that account was deleted — shown as "Someone" (OQ-82).
      required: [id, householdId, householdName, role, invitedByUserId, inviterFirstName, inviterLastName, createdAt]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        householdName: { type: string }
        role: { type: string, enum: [Admin, Member, Viewer] }
        invitedByUserId: { type: [string, "null"], format: uuid }
        inviterFirstName: { type: [string, "null"] }
        inviterLastName: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    HouseholdMembership:
      type: object
      required: [userId, householdId, firstName, lastName, email, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        firstName: { type: string, description: "For the members screen (OQ-117)" }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [Owner, Admin, Member, Viewer], description: "FR-1.6 — exactly one of four, fixed set" }
        joinedAt: { type: string, format: date-time, description: "Read directly by FR-1.18's succession rule" }

    Invitation:
      type: object
      required: [id, householdId, invitedUserId, invitedByUserId, role, status, createdAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        invitedUserId: { type: string, format: uuid }
        invitedByUserId: { type: string, format: uuid }
        role: { type: string, enum: [Admin, Member, Viewer] }
        status: { type: string, enum: [pending, accepted, declined, revoked] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }

    # ---------------------------------------------------- accounts
    Account:
      type: object
      required: [id, householdId, ownerUserId, name, type, currency, visibility, startingBalanceDate, archivedAt, createdAt, currentBalance, cards]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        ownerUserId: { type: [string, "null"], format: uuid, description: "Identity for personal, provenance for shared (dual-role, FR-1.17)" }
        name: { type: string }
        type: { type: string, enum: [checking, savings, credit_card_only, investment], description: "Immutable once set, OQ-32. Four types since OQ-76." }
        currency: { $ref: "#/components/schemas/Currency", description: "Immutable once set, FR-2.2" }
        visibility: { type: string, enum: [personal, shared] }
        startingBalanceDate: { type: string, format: date, description: "The day the starting balance was true — the creation day. Earlier transactions only rebuild history (OQ-169)" }
        archivedAt: { type: [string, "null"], format: date-time, description: "One-way, FR-2.4/OQ-34" }
        createdAt: { type: string, format: date-time }
        currentBalance: { $ref: "#/components/schemas/Money", description: "The balance as of today's month — the stored month row, not a computation (OQ-175)" }
        cards:
          type: array
          description: The Account's Credit Cards, in the order attached (OQ-175)
          items: { $ref: "#/components/schemas/CreditCard" }

    AccountCreateRequest:
      type: object
      required: [name, type, currency, visibility]
      properties:
        name: { type: string }
        type: { type: string, enum: [checking, savings, credit_card_only, investment] }
        currency: { $ref: "#/components/schemas/Currency" }
        visibility: { type: string, enum: [personal, shared] }
        openingBalance: { $ref: "#/components/schemas/Money", description: "Today's balance (OQ-169); 0 when left out" }
        cards:
          type: array
          items: { $ref: "#/components/schemas/CreditCardNew" }

    AccountUpdateRequest:
      type: object
      properties:
        name: { type: string }
        visibility: { type: string, enum: [personal, shared] }
        cards: { $ref: "#/components/schemas/CreditCardChanges" }

    CreditCard:
      type: object
      required: [id, accountId, network, last4, closingDay, dueDay, expirationMonth, expirationYear, createdAt, outstandingBalance]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        network: { $ref: "#/components/schemas/CardNetwork" }
        last4: { type: string }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        expirationMonth: { type: integer, minimum: 1, maximum: 12 }
        expirationYear: { type: integer }
        createdAt: { type: string, format: date-time }
        outstandingBalance: { $ref: "#/components/schemas/Money", description: "Owed now: the current billing cycle's ending balance (FR-2.10, OQ-175)" }

    CardNetwork:
      type: string
      description: >
        Card network ("flag", FR-2.8) — mirrors `CARD_NETWORKS` in
        `@financas/reference`, the extensible reference list; a test keeps
        the two equal (OQ-175).
      enum: [visa, mastercard, amex, elo, hipercard, diners, discover, jcb, unionpay, other]

    CreditCardNew:
      type: object
      description: A card to attach. Only its last 4 digits are ever stored (NFR-SEC-7).
      required: [network, last4, closingDay, dueDay, expirationMonth, expirationYear]
      properties:
        network: { $ref: "#/components/schemas/CardNetwork" }
        last4: { type: string, pattern: "^[0-9]{4}$" }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        expirationMonth: { type: integer, minimum: 1, maximum: 12 }
        expirationYear: { type: integer, minimum: 2000, maximum: 2100 }

    CreditCardEdit:
      type: object
      description: >
        An attached card's changes; any field may be left out. A new
        closing day applies to movements written after it (OQ-170).
      required: [id]
      properties:
        id: { type: string, format: uuid }
        network: { $ref: "#/components/schemas/CardNetwork" }
        last4: { type: string, pattern: "^[0-9]{4}$" }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        expirationMonth: { type: integer, minimum: 1, maximum: 12 }
        expirationYear: { type: integer, minimum: 2000, maximum: 2100 }

    CreditCardChanges:
      type: object
      description: >
        The card changes of an Account edit (FR-2.9, OQ-35), applied with
        it in one write (OQ-175). Removing a card drops its Card
        Transactions and balances; bill payments stay in the Account's
        history, and the Budget spend its charges accrued stays (OQ-174).
      properties:
        add:
          type: array
          items: { $ref: "#/components/schemas/CreditCardNew" }
        edit:
          type: array
          items: { $ref: "#/components/schemas/CreditCardEdit" }
        remove:
          type: array
          items: { type: string, format: uuid }

    AccountMonthBalance:
      type: object
      required: [year, month, openingBalance, endingBalance, updatedAt]
      properties:
        year: { type: integer }
        month: { type: integer }
        openingBalance: { $ref: "#/components/schemas/Money" }
        endingBalance: { $ref: "#/components/schemas/Money" }
        updatedAt: { type: string, format: date-time }

    CreditCardMonthBalance:
      type: object
      description: One billing cycle, named by the month it closes in (OQ-170).
      required: [year, month, openingOutstandingBalance, endingOutstandingBalance, updatedAt]
      properties:
        year: { type: integer }
        month: { type: integer }
        openingOutstandingBalance: { $ref: "#/components/schemas/Money" }
        endingOutstandingBalance: { $ref: "#/components/schemas/Money" }
        updatedAt: { type: string, format: date-time }

    # ---------------------------------------------------- categories
    CategoryIcon:
      type: string
      description: >
        Material Symbols name from the in-code icon set (FR-10.1, OQ-126) —
        mirrors `CATEGORY_ICONS` in `@financas/reference`; a test keeps the two equal (OQ-174).
      enum:
        - home-outline
        - apartment
        - bolt
        - water-drop-outline
        - local-fire-department-outline
        - wifi
        - smartphone-outline
        - build-outline
        - cleaning-services-outline
        - chair-outline
        - shopping-cart-outline
        - restaurant
        - local-cafe-outline
        - local-bar-outline
        - fastfood-outline
        - bakery-dining-outline
        - directions-car-outline
        - local-gas-station-outline
        - directions-bus-outline
        - local-taxi-outline
        - local-parking
        - two-wheeler
        - flight
        - medical-services-outline
        - local-pharmacy-outline
        - fitness-center
        - spa-outline
        - psychology-outline
        - shopping-bag-outline
        - checkroom
        - devices-outline
        - content-cut
        - redeem
        - child-care-outline
        - pets
        - school-outline
        - elderly
        - movie-outline
        - sports-esports-outline
        - music-note
        - menu-book-outline
        - theater-comedy-outline
        - beach-access-outline
        - celebration-outline
        - subscriptions-outline
        - payments-outline
        - work-outline
        - savings-outline
        - account-balance-outline
        - receipt-long-outline
        - credit-card-outline
        - trending-up
        - sell-outline
        - real-estate-agent-outline
        - shield-outline
        - volunteer-activism-outline
        - category-outline

    CategoryColor:
      type: string
      description: >
        Palette token, not a hex — resolves per theme (OQ-85). Mirrors
        `PALETTE_TOKENS` in `@financas/reference` (OQ-174).
      enum:
        - mint
        - emerald
        - teal
        - cyan
        - sky
        - blue
        - indigo
        - violet
        - lilac
        - fuchsia
        - pink
        - rose
        - coral
        - peach
        - orange
        - sun
        - lime
        - slate

    Subcategory:
      type: object
      required: [id, categoryId, name, archivedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string }
        archivedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    Category:
      type: object
      required: [id, householdId, name, icon, color, archivedAt, createdAt, subcategories]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        name: { type: string }
        archivedAt: { type: [string, "null"], format: date-time, description: "One-way, cascades to Subcategories, FR-10.3/10.4" }
        createdAt: { type: string, format: date-time }
        subcategories:
          type: array
          items: { $ref: "#/components/schemas/Subcategory" }
        icon: { $ref: "#/components/schemas/CategoryIcon" }
        color: { $ref: "#/components/schemas/CategoryColor" }

    CategoryUpdateRequest:
      type: object
      properties:
        name: { type: string }
        subcategories:
          type: array
          items:
            type: object
            required: [name]
            properties:
              id: { type: string, format: uuid, description: "Omit to create a new Subcategory" }
              name: { type: string }
        icon: { $ref: "#/components/schemas/CategoryIcon" }
        color: { $ref: "#/components/schemas/CategoryColor" }

    # ---------------------------------------------------- budgets
    BudgetTargetInput:
      type: object
      description: >
        A whole Category (with all its Subcategories, FR-4.6) or one
        Subcategory — exactly one of the two ids, never both. The
        generated validator can't say "exactly one" (it ignores
        `additionalProperties: false` on a `oneOf` branch), so
        AccountManager checks it: 422 `field.invalid` on `targets[i]`
        (OQ-176).
      properties:
        categoryId: { type: string, format: uuid }
        subcategoryId: { type: string, format: uuid }

    Budget:
      type: object
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        ownerUserId: { type: [string, "null"], format: uuid }
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/Money" }
        currency: { $ref: "#/components/schemas/Currency" }
        visibility: { type: string, enum: [personal, shared] }
        targets:
          type: array
          items: { $ref: "#/components/schemas/BudgetTargetInput" }
        createdAt: { type: string, format: date-time }

    BudgetCreateRequest:
      type: object
      required: [name, targetAmount, currency, visibility, targets]
      properties:
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/PositiveMoney" }
        currency: { $ref: "#/components/schemas/Currency" }
        visibility: { type: string, enum: [personal, shared] }
        targets:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/BudgetTargetInput" }

    BudgetUpdateRequest:
      type: object
      properties:
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/PositiveMoney" }
        targets:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/BudgetTargetInput" }

    BudgetPeriod:
      type: object
      properties:
        year: { type: integer }
        month: { type: integer }
        targetAmount: { $ref: "#/components/schemas/Money" }
        spendAmount: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }

    # ---------------------------------------------------- investments
    InvestmentHolding:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        assetType:
          type: string
          enum:
            - stock
            - fii
            - fund
            - mutual_fund
            - currency
            - crypto
            - real_estate
            - other
            - cdb
            - lc
            - lf
            - lci
            - lca
            - cra
            - cri
            - debenture
            - tesouro_direto
            - cd
            - treasury
          description: 'Market-priced: stock, fii, fund, mutual_fund, currency, crypto, real_estate, other. Fixed-term (engine schedule + tax): cdb, lc, lf, lci, lca, cra, cri, debenture, tesouro_direto, cd, treasury (OQ-79). Reference data.'
        ticker: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
        costBasis: { $ref: "#/components/schemas/Money" }
        rate:
          type: [object, "null"]
          description: "Fixed-term instrument types only (OQ-50) — this purchase's own immutable rate, set at creation and never recomputed."
          properties:
            type: { type: string, enum: [fixed, cdi, ipca, igpm, selic] }
            value:
              type: integer
              description: Percent × 10,000 — 10.50% = 105000 (bigint fixed-point, OQ-86)
        archivedAt:
          type: [string, "null"]
          format: date-time
        createdAt: { type: string, format: date-time }
        incentivised:
          type: [boolean, "null"]
          description: Debentures only — incentivised debentures are income-tax exempt for individuals (OQ-79)
        archivedBy:
          type: [string, "null"]
          enum:
            - system
            - user
            - null
          description: '`system` = quantity reached 0, undone automatically if that transaction changes (OQ-80); `user` = one-way'
        expectedPayout:
          $ref: '#/components/schemas/Money'
          description: Fixed-term only, computed on read by InvestmentProductEngine.project (FR-11.2) — gross at maturity
        expectedTaxes:
          type: [object, "null"]
          description: 'Fixed-term only. `estimated: false` for US instruments (OQ-79)'
          properties:
            estimated:
              type: boolean
            amount:
              $ref: '#/components/schemas/Money'

    HoldingUpdateRequest:
      type: object
      required:
        - allocations
      description: 'Narrowed (Oct 2026): goal allocations only — position changes through transactions, market value through valuation-snapshots. Replace-all semantics.'
      properties:
        allocations:
          type: array
          description: The split over the Goals the caller can see; each Goal at most once.
          items: { $ref: "#/components/schemas/HoldingAllocation" }
    HoldingAllocation:
      type: object
      required:
        - goalId
        - percentage
      properties:
        goalId:
          type: string
          format: uuid
        percentage:
          type: integer
          minimum: 1
          maximum: 100
          description: Whole percent (60 = 60%) — integer, no floats; contribution = value × pct / 100, rounded half-up to the cent (OQ-87)
    HoldingAllocations:
      type: object
      required: [data]
      description: A Holding's split over the Goals the caller can see (OQ-178).
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/HoldingAllocation" }
    ValuationSnapshot:
      type: object
      properties:
        id: { type: string, format: uuid }
        holdingId: { type: string, format: uuid }
        valuation: { $ref: "#/components/schemas/Money" }
        asOfDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        source:
          type: string
          enum:
            - manual
            - transaction
          description: Only `manual` snapshots can be edited/deleted (OQ-56)
        accountTransactionId:
          type: [string, "null"]
          format: uuid
          description: Set for `transaction` snapshots

    InvestmentScheduleEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        holdingId: { type: string, format: uuid }
        kind: { type: string, enum: [interest_payment, redemption, tax] }
        amount: { $ref: "#/components/schemas/Money" }
        date: { type: string, format: date }
        postedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    # ---------------------------------------------------- transactions
    TransactionCreateRequest:
      type: object
      required: [kind, date, amount, currency]
      properties:
        accountId: { type: string, format: uuid, description: "Exactly one of accountId/creditCardId" }
        creditCardId: { type: string, format: uuid }
        kind: { type: string, description: "Reference data, e.g. withdrawal, deposit, transfer sent/received, investment buy, card charge, ... FR-3.1" }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { $ref: "#/components/schemas/Currency" }
        categoryId: { type: string, format: uuid }
        subcategoryId: { type: string, format: uuid }
        description: { type: string }
        assetType: { type: string, description: "Investment kinds only, required for investment_buy (FR-5.1) — stock/FII/CDB-fixed-income/fund/other." }
        ticker: { type: string, description: "Investment kinds only, required (FR-5.1) — matches an existing Holding in this account by ticker; a new ticker on investment_buy creates one." }
        quantity: { $ref: "#/components/schemas/Quantity" }
        rate:
          type: [object, "null"]
          description: "Fixed-term instrument types only, investment_buy only (OQ-50) — this purchase's own immutable rate, set at creation and never recomputed."
          properties:
            type: { type: string, enum: [fixed, cdi, ipca, igpm, selic] }
            value: { type: integer, description: "Percent × 10,000 — 10.50% = 105000 (bigint fixed-point, OQ-86, OQ-189). Fixed: annual % rate. CDI/Selic: % of the index (110% of CDI = 1100000). IPCA/IGP-M: spread above the index." }
        dueDate: { type: string, format: date, description: "Fixed-term instrument types only, required for investment_buy (FR-11.1/FR-11.2) — the contract's maturity date. Not derivable from assetType alone (a CDB's term is negotiated per contract); InvestmentProductEngine uses it, alongside date and rate, to compute the interest-payment schedule between purchase and maturity, never to derive maturity itself." }
        allocations:
          type: array
          description: "investment_buy only, optional (FR-8.2/OQ-54) — allocate this purchase across one or more Goals in the same call that creates/updates the Holding, instead of a separate PATCH /holdings/{holdingId} afterward. The Holding is still the entry point (OQ-48); this is the same write, just bundled at creation time."
          items:
            type: object
            required:
              - goalId
              - percentage
            properties:
              goalId:
                type: string
                format: uuid
              percentage:
                type: integer
                minimum: 1
                maximum: 100
                description: Whole percent (60 = 60%) — integer, no floats; contribution = value × pct / 100, rounded half-up to the cent (OQ-87)
        incentivised:
          type: boolean
          description: Debenture buys only (OQ-79)

    TransactionUpdateRequest:
      type: object
      properties:
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        categoryId: { type: string, format: uuid }
        subcategoryId: { type: string, format: uuid }
        description: { type: string }

    AccountTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        kind: { type: string }
        effect: { type: string, enum: [movement, transfer, bill_payment, investment_trade], description: "Persisted via EFFECT_BY_KIND, not recomputed — see 02-data-model.md" }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { $ref: "#/components/schemas/Currency" }
        categoryId: { type: [string, "null"], format: uuid }
        subcategoryId: { type: [string, "null"], format: uuid }
        description: { type: string }
        holdingId: { type: [string, "null"], format: uuid, description: "Investment kinds only" }
        creditCardId: { type: [string, "null"], format: uuid, description: "Bill payment only — the one bridge between the two ledgers" }
        source:
          type: string
          enum:
            - manual
            - schedule
          description: '`schedule` = posted by investmentsDaily (FR-11.3); was manual/recurring (OQ-55)'
        createdAt: { type: string, format: date-time }
        ledger:
          type: string
          enum:
            - account

    CardTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        creditCardId: { type: string, format: uuid }
        kind: { type: string, enum: [charge, refund] }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { $ref: "#/components/schemas/Currency" }
        categoryId: { type: [string, "null"], format: uuid }
        subcategoryId: { type: [string, "null"], format: uuid }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        ledger:
          type: string
          enum:
            - card

    # ---------------------------------------------------- insights
    DashboardWidget:
      type: object
      properties:
        id: { type: string, format: uuid }
        widgetType: { type: string, description: "Reference data, FR-6.7 — account balances summary, recent transactions, budget status, net worth trend, ..." }
        position: { type: integer }
        settings:
          type: object
          description: "Shape varies by widgetType — date range plus whichever account/Budget/Goal/currency is relevant, FR-6.9"
        createdAt: { type: string, format: date-time }

    DashboardWidgetInput:
      type: object
      required: [widgetType, position]
      properties:
        id: { type: string, format: uuid, description: "Omit to add a new widget" }
        widgetType: { type: string }
        position: { type: integer }
        settings: { type: object }
        _remove: { type: boolean }

    Notification:
      description: OQ-82 — type + params, never text; the frontend renders and localizes it (NFR-I18N-3).
      oneOf:
        - $ref: '#/components/schemas/InvitationReceivedNotification'
        - $ref: '#/components/schemas/HoldingMaturedNotification'
      discriminator:
        propertyName: type
        mapping:
          invitation.received: '#/components/schemas/InvitationReceivedNotification'
          holding.matured: '#/components/schemas/HoldingMaturedNotification'
    CursorPage:
      type: object
      properties:
        nextCursor:
          type: [string, "null"]
          description: null when there are no more items
    UserPreferences:
      type: object
      description: >
        FR-1.21 — per user, not per household. A new account starts with the
        dark theme. No schema default here: on PATCH /users/me a default would
        overwrite the theme whenever only the language is sent (OQ-116).
      properties:
        theme:
          type: string
          enum:
            - dark
            - light
            - system
        language:
          type: string
          enum:
            - pt-BR
            - en-US
    ValuationSnapshotInput:
      type: object
      required:
        - value
        - asOf
      properties:
        value:
          $ref: '#/components/schemas/NonNegativeMoney'
        asOf:
          type: string
          format: date
    IndexRateValue:
      type: object
      required: [id, index, value, asOf, createdByUserId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        index:
          $ref: '#/components/schemas/IndexCode'
        value:
          type: integer
          description: Percent × 10,000 — 10.50% = 105000 (bigint fixed-point, OQ-86)
        asOf:
          type: string
          format: date
        createdByUserId:
          type: [string, "null"]
          format: uuid
          description: Who recorded it — a Member may edit or delete their own (OQ-178)
        createdAt:
          type: string
          format: date-time
    IndexCode:
      type: string
      enum:
        - selic
        - cdi
        - ipca
        - igpm
      description: The in-code index list (`INDEX_CODES` in @financas/reference, kept equal by a test — OQ-178).
    IndexRateUnit:
      type: string
      enum:
        - annual_percent
        - trailing_12m_percent
      description: How an index's values read, from `INDEX_CODES` (OQ-178).
    IndexRateSeries:
      type: object
      required: [index, unit, values]
      properties:
        index:
          $ref: '#/components/schemas/IndexCode'
        unit:
          $ref: '#/components/schemas/IndexRateUnit'
        values:
          type: array
          items:
            $ref: '#/components/schemas/IndexRateValue'
    Goal:
      type: object
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        ownerUserId: { type: [string, "null"], format: uuid }
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/Money" }
        targetCurrency: { $ref: "#/components/schemas/Currency" }
        dueDate: { type: string, format: date }
        visibility: { type: string, enum: [personal, shared] }
        createdAt: { type: string, format: date-time }
        completedAt:
          type: [string, "null"]
          format: date-time
          description: Complete sets it, reopen nulls it — the one reversible lifecycle flag (FR-8.8/8.9, OQ-78)
    GoalCreateRequest:
      type: object
      required: [name, targetAmount, targetCurrency, dueDate, visibility]
      properties:
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/PositiveMoney" }
        targetCurrency: { $ref: "#/components/schemas/Currency" }
        dueDate: { type: string, format: date }
        visibility: { type: string, enum: [personal, shared] }
    GoalProgress:
      type: object
      description: "FR-8.5 — per-Holding contributions in native currency; blending is a frontend concern."
      properties:
        targetAmount: { $ref: "#/components/schemas/Money" }
        targetCurrency: { $ref: "#/components/schemas/Currency" }
        contributions:
          type: array
          items:
            type: object
            properties:
              holdingId: { type: string, format: uuid }
              currency: { $ref: "#/components/schemas/Currency" }
              amount: { $ref: "#/components/schemas/Money" }
        goalId:
          type: string
          format: uuid
    GoalUpdateRequest:
      type: object
      properties:
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/PositiveMoney" }
        targetCurrency: { $ref: "#/components/schemas/Currency" }
        dueDate: { type: string, format: date }
    GoalWithProgress:
      allOf:
        - $ref: '#/components/schemas/Goal'
        - type: object
          properties:
            contributions:
              type: array
              items:
                type: object
                properties:
                  holdingId: { type: string, format: uuid }
                  currency: { $ref: "#/components/schemas/Currency" }
                  amount: { $ref: "#/components/schemas/Money" }
            fundedBy:
              type: array
              items:
                type: object
                properties:
                  holdingId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  percentage:
                    type: integer
                    minimum: 1
                    maximum: 100
                    description: Whole percent (60 = 60%) — integer, no floats; contribution = value × pct / 100, rounded half-up to the cent (OQ-87)
    LedgerItem:
      oneOf:
        - $ref: '#/components/schemas/AccountTransaction'
        - $ref: '#/components/schemas/CardTransaction'
      discriminator:
        propertyName: ledger
        mapping:
          account: '#/components/schemas/AccountTransaction'
          card: '#/components/schemas/CardTransaction'
      description: Both ledgers merged; `ledger` is `account` or `card`
    TransactionPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LedgerItem'
            dayTotals:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  currency:
                    $ref: '#/components/schemas/Currency'
                  net:
                    $ref: '#/components/schemas/Money'
    MoneyByCurrency:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        amount:
          $ref: '#/components/schemas/Money'
    MonthOverviewReport:
      type: object
      description: FR-6.11 / FR-6.6 / FR-4.3 / FR-8.5
      properties:
        reportType:
          type: string
          enum:
            - month-overview
        summary:
          type: array
          description: Per currency, never summed
          items:
            type: object
            properties:
              currency:
                $ref: '#/components/schemas/Currency'
              in:
                $ref: '#/components/schemas/Money'
              out:
                $ref: '#/components/schemas/Money'
              net:
                $ref: '#/components/schemas/Money'
        yearStrip:
          type: array
          items:
            type: object
            properties:
              month:
                type: integer
              currency:
                $ref: '#/components/schemas/Currency'
              in:
                $ref: '#/components/schemas/Money'
              out:
                $ref: '#/components/schemas/Money'
        balances:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
                format: uuid
              creditCardId:
                type: [string, "null"]
                format: uuid
              currency:
                $ref: '#/components/schemas/Currency'
              amount:
                $ref: '#/components/schemas/Money'
        budgets:
          type: array
          description: Over-budget first
          items:
            $ref: '#/components/schemas/BudgetPeriod'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalWithProgress'
    InvestmentsOverviewReport:
      type: object
      description: FR-5.3 / FR-5.9
      properties:
        reportType:
          type: string
          enum:
            - investments-overview
        netWorth:
          type: array
          items:
            type: object
            properties:
              currency:
                $ref: '#/components/schemas/Currency'
              amount:
                $ref: '#/components/schemas/Money'
              changeVsPreviousMonth:
                $ref: '#/components/schemas/Money'
              series:
                type: array
                items:
                  type: object
                  properties:
                    month:
                      type: string
                    amount:
                      $ref: '#/components/schemas/Money'
        payoutThisMonth:
          type: array
          items:
            type: object
            properties:
              holdingId:
                type: string
                format: uuid
              transactionId:
                type: string
                format: uuid
              kind:
                type: string
              date:
                type: string
                format: date
              currency:
                $ref: '#/components/schemas/Currency'
              amount:
                $ref: '#/components/schemas/Money'
        allocations:
          type: array
          items:
            type: object
            properties:
              group:
                type: string
              currency:
                $ref: '#/components/schemas/Currency'
              holdingId:
                type: [string, "null"]
                format: uuid
              amount:
                $ref: '#/components/schemas/Money'
        comingDue:
          type: array
          items:
            type: object
            properties:
              holdingId:
                type: string
                format: uuid
              name:
                type: string
              dueDate:
                type: string
                format: date
              currency:
                $ref: '#/components/schemas/Currency'
              amount:
                $ref: '#/components/schemas/Money'
    PayoutsReport:
      type: object
      description: FR-5.9 — sums of dividend/interest transactions linked to each Holding
      properties:
        reportType:
          type: string
          enum:
            - payouts
        series:
          type: array
          items:
            type: object
            properties:
              holdingId:
                type: string
                format: uuid
              currency:
                $ref: '#/components/schemas/Currency'
              months:
                type: array
                items:
                  type: object
                  properties:
                    month:
                      type: string
                    amount:
                      $ref: '#/components/schemas/Money'
    InvitationReceivedNotification:
      type: object
      required:
        - type
        - params
      properties:
        id:
          type: string
          format: uuid
        seenAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - invitation.received
        params:
          type: object
          properties:
            invitationId:
              type: string
              format: uuid
            householdId:
              type: string
              format: uuid
            inviterUserId:
              type: string
              format: uuid
            role:
              type: string
    HoldingMaturedNotification:
      type: object
      required:
        - type
        - params
      properties:
        id:
          type: string
          format: uuid
        seenAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - holding.matured
        params:
          type: object
          properties:
            holdingId:
              type: string
              format: uuid
            assetType:
              type: string
              description: The Holding's asset type, the frontend's label in the reader's language (OQ-82, OQ-178)
            ticker:
              type: [string, "null"]
            dueDate:
              type: string
              format: date
