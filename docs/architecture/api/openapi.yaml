openapi: "3.1.0"
info:
  title: New Finance App API
  version: "1.1.0"
  description: >-
    Backend API for the New Finance App — household finance management: personal & shared budgeting, expense tracking, and manual investment/net-worth tracking. Derived directly from docs/architecture/02-data-model.md (schema), docs/design/diagrams/sequences/ (per-use-case call sequences, HTTP routes, and status codes), and docs/requirements/02-functional-requirements.md (FR numbers referenced throughout). See docs/architecture/03-api-design.md for the design rationale behind every convention below — this file is the contract, that file is the "why."

    Open Banking sync (FR-2.5/2.6/3.3) and the FII/Stock Portfolio Builder (CUC-7, FR-5.5/5.6/5.7) are deferred whole and have no endpoints here — see 02-data-model.md's parked-Accessors note.



    **1.1.0 — Oct 2026 review** (`docs/architecture/10-api-review-2026-10.md`): Objectives → Goals, recurring removed, manual market values + index rates, fixed v1 reports under `/reports`, merged transaction browsing with cursor pagination, error envelope with namespaced codes + params (OQ-83), notifications as type + params (OQ-82). Deferred operations carry `x-deferred`.
servers:
  - url: /api/v1
    description: All endpoints below are relative to this base path.

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registration, login, session/password/MFA lifecycle. FR-1, CUC-2.
  - name: Households
    description: Household creation, membership, invitations, ownership. FR-1, CUC-1.
  - name: Accounts
    description: Financial Accounts and Credit Cards. FR-2, CUC-3.
  - name: Categories
    description: Category/Subcategory taxonomy. FR-10.
  - name: Budgets
    description: Budgets, targets, and periods. FR-4, CUC-5.
  - name: Investments
    description: Investment Holdings, Valuation Snapshots, schedule entries. FR-5, FR-11, CUC-6.
  - name: Goals
    description: 'Goals (formerly Objectives — OQ-66): create, edit, complete/reopen, delete, progress.'
  - name: Transactions
    description: Account Transactions and Card Transactions — record, edit, delete, browse & filter. FR-3, CUC-4.
  - name: Insights
    description: Dashboard, reports, notifications. FR-6, CUC-8.
  - name: Audit
    description: Audit log export. FR-7, CUC-9.

  - name: Reports
    description: Fixed v1 report types (month-overview, investments-overview, payouts); ad-hoc types and CSV export are v2 (OQ-71).
paths:
  # =========================================================== AUTH
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user (Create User)
      description: >
        FR-1.1/FR-1.15. Enrolls TOTP-based MFA and issues recovery codes
        inline — an account cannot be used to log in until MFA is
        enrolled, so this happens as part of registration, not a
        follow-up step. See docs/design/diagrams/sequences/identity-household/uc-11-create-user.html.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                firstName: { type: string }
                lastName: { type: string }
      responses:
        "201":
          description: Created. Recovery codes are returned exactly once and never again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string, format: uuid }
                  totpSecret: { type: string, description: "QR-encodable TOTP enrollment secret" }
                  recoveryCodes:
                    type: array
                    items: { type: string }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login (password + MFA code together)
      description: >
        FR-1.2/OQ-30. Password and MFA code supplied in one request. The
        access token is stateless (never persisted); the refresh token
        is the server-tracked, revocable record backing
        GET/DELETE /users/me/sessions. See
        docs/design/diagrams/sequences/identity-household/uc-14-login.html.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, mfaCode]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                mfaCode: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401":
          description: >
            Invalid email, password, or MFA code — deliberately
            identical for all three to avoid leaking which emails are
            registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (current session only)
      description: >
        FR-1.9. Terminates the current session only; every other active
        session/device is unaffected. Idempotent — logging out an
        already-terminated session still returns 204.
      responses:
        "204": { description: No Content }

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change password (authenticated)
      description: >
        FR-1.14. Requires re-supplying the current password; invalidates
        every other active session except the one making the change —
        contrast with Reset Password, which has no session to spare.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request a password reset token (step 1 of 2)
      description: >-
        FR-1.13. Always returns 202 regardless of whether the email matched an account — the branch is entirely internal, so there is no observable response difference that would leak account existence.
         The reset link is emailed through `NotificationDeliveryUtility`'s email channel as type `password.reset` in the user's language (OQ-84); the token is stored hashed in `password_reset_tokens`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Accepted }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Submit a reset token + new password (step 2 of 2)
      description: >
        FR-1.13. A valid token invalidates every active session, not
        just the one making the change (there is no "current session"
        to spare — the user isn't logged in at all).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 12 }
      responses:
        "200": { description: OK }
        "400":
          description: Token invalid or expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/mfa/recover:
    post:
      tags: [Auth]
      summary: Log in using a single-use MFA recovery code
      description: >
        FR-1.16. Requires the correct password too, same as normal
        login — this is an alternate second factor, not a full
        account-recovery mechanism. If recovery codes are also
        exhausted/lost, there is no further self-service path (OQ-24).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, recoveryCode]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                recoveryCode: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me:
    get:
      tags: [Auth]
      summary: Get the current user's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [Auth]
      summary: Edit profile (first/last name) and preferences (theme, language)
      description: >
        Email and password each have their own dedicated flow — this
        endpoint never touches either. See
        docs/design/diagrams/sequences/identity-household/uc-13-edit-user.html.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                preferences:
                  $ref: '#/components/schemas/UserPreferences'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Auth]
      summary: Delete own account (GDPR right-to-erasure)
      description: >
        FR-1.17/FR-1.18/OQ-25. Unconditional — no rejection path exists,
        by design. Personal data (personal Accounts, Budgets, Goals,
        and everything they own) is hard-deleted; this user's
        contributions to shared household data are anonymized (actor
        reference nulled), not deleted. If this user was a household's
        Owner, FR-1.18's succession runs first, per household. One of
        the two widest-fan-out flows in the system — see
        docs/design/diagrams/sequences/identity-household/uc-12-delete-user.html for
        the full cascade traced call-by-call.
      responses:
        "204": { description: No Content }

  /users/me/sessions:
    get:
      tags: [Auth]
      summary: List active sessions/devices
      description: FR-1.3.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
    delete:
      tags:
        - Auth
      operationId: revokeOtherSessions
      summary: Sign out all other sessions
      description: FR-1.3 / OQ-62 — deletes every session of the current user except the one making this call (same `SessionAccessor.deleteAllExceptCurrent` as Change Password).
      responses:
        '204':
          description: No Content

  /users/me/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [Auth]
      summary: Revoke a session
      description: >
        FR-1.3. 404, not 403, for a session belonging to someone else —
        deliberately doesn't confirm the session ID exists at all to a
        non-owner.
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/me/invitations:
    get:
      tags: [Households]
      summary: List pending invitations addressed to the current user
      description: FR-1.5/FR-1.10. Only ever shows this user's own pending invitations.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }

  # =========================================================== HOUSEHOLDS
  /households:
    get:
      tags: [Households]
      summary: List households the current user belongs to
      description: FR-1.8 — a user may belong to more than one household.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Household" }
    post:
      tags: [Households]
      summary: Create a household
      description: >
        FR-1.4. Also seeds the predefined default Category set — a
        Manager↔Manager effect routed through the Service Bus, invisible
        at this API layer (fire-and-forget, doesn't block this
        response). See
        docs/design/diagrams/sequences/identity-household/uc-01-create-household.html.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /households/{householdId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Households]
      summary: Get a household
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
    delete:
      tags: [Households]
      summary: Delete a household (Owner only, deliberate dissolution)
      description: >
        FR-1.7. Owner-only, cascading hard delete of every
        household-scoped record. Distinct from FR-1.18's auto-delete
        when the last member leaves (see DELETE
        .../members/{userId}) — this is the Owner choosing to dissolve
        the household outright. See
        docs/design/diagrams/sequences/identity-household/uc-02-delete-household.html.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }

  /households/{householdId}/members:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Households]
      summary: List household members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/HouseholdMembership" }

  /households/{householdId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [Households]
      summary: Remove a member, or leave the household yourself
      description: >
        FR-1.11/FR-1.18/OQ-27. One endpoint, two actor/target
        relationships: `userId != ` the caller (Remove Member,
        Owner/Admin only, the Owner can never be removed this way) or
        `userId ==` the caller (Leave Household, self-service, no
        authorization check — if the leaver is the Owner, FR-1.18's
        succession runs atomically, or the household itself is deleted
        if no member remains). See
        docs/design/diagrams/sequences/identity-household/uc-07-remove-member.html
        and uc-08-leave-household.html.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }

  /households/{householdId}/members/{userId}/role:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Households]
      summary: Change a member's role
      description: >
        FR-1.12. Owner/Admin only; can never assign or remove the Owner
        role — attempting to set role=Owner here is rejected, use
        Transfer Ownership instead (FR-1.20).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [Admin, Member, Viewer] }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /households/{householdId}/transfer-ownership:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    post:
      tags: [Households]
      summary: Transfer ownership to another member
      description: >
        FR-1.20/OQ-28. Owner-only; a single atomic dual-role swap — the
        household is never observably left with zero or two Owners
        (enforced one layer down by a partial unique index on
        household_memberships). Distinct from FR-1.18's auto-succession:
        the transferring Owner remains a member, demoted to Admin, not
        leaving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: { type: string, format: uuid }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /households/{householdId}/invitations:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Households]
      summary: List this household's invitations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
    post:
      tags: [Households]
      summary: Invite a user to the household
      description: >
        FR-1.5/FR-1.19/OQ-26. Owner/Admin only. Target must be an
        existing, registered user matched by email — there is no
        invite-a-non-user flow (a real DB constraint one layer down,
        invited_user_id NOT NULL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [Admin, Member, Viewer] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No registered user matches the given email (FR-1.19).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /households/{householdId}/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
      - $ref: "#/components/parameters/InvitationId"
    delete:
      tags: [Households]
      summary: Revoke a pending invitation
      description: FR-1.10. Owner/Admin only, before the invitee responds.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Invitation is no longer pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /invitations/{invitationId}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    post:
      tags: [Households]
      summary: Accept a household invitation
      description: >
        FR-1.10. Only the invited user can accept. Establishes
        membership with the role specified in the invitation.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  householdId: { type: string, format: uuid }
                  role: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Invitation already resolved or revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /invitations/{invitationId}/decline:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    post:
      tags: [Households]
      summary: Decline a household invitation
      description: FR-1.10. Only the invited user can decline. No membership is ever created.
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Invitation already resolved or revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # =========================================================== ACCOUNTS
  /accounts:
    get:
      tags: [Accounts]
      summary: List financial accounts visible to the current user
      parameters:
        - name: householdId
          in: query
          schema: { type: string, format: uuid }
        - name: visibility
          in: query
          schema: { type: string, enum: [personal, shared] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      tags: [Accounts]
      summary: Create a financial account
      description: >
        FR-2.1. `type` and `currency` are immutable once set (OQ-32) —
        there is no edit path for either, ever. Cards may optionally be
        attached inline. See
        docs/design/diagrams/sequences/financial-accounts/uc-01-create-account.html.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Accounts]
      summary: Get a financial account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Accounts]
      summary: Edit a financial account, including its Credit Cards
      description: >
        FR-2.9/OQ-35. Attaching, editing, and removing this account's
        Credit Cards is folded into this same request, not separate
        endpoints. `type`/`currency` changes are rejected (OQ-32); a
        card can only attach to a checking/savings/credit_card_only
        account (FR-2.7). See
        docs/design/diagrams/sequences/financial-accounts/uc-02-edit-account.html.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /accounts/{accountId}/archive:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [Accounts]
      summary: Archive a financial account
      description: >
        FR-2.4/OQ-34. One-way, no unarchive path. Auto-disconnects Open
        Banking sync if linked (OQ-36) — currently unreachable since
        that trigger is parked.
      responses:
        "204": { description: No Content }

  /accounts/{accountId}/credit-cards:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Accounts]
      summary: List credit cards attached to an account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CreditCard" }

  /accounts/{accountId}/balances:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Accounts]
      summary: Get an account's balance history by month
      description: >
        FR-5.4/FR-6.6. Backed by account_month_balances — "current
        balance" is simply the row for today's (year, month). No new
        stored data beyond what Record Transaction already maintains.
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AccountMonthBalance" }

  /credit-cards/{creditCardId}/balances:
    parameters:
      - $ref: "#/components/parameters/CreditCardId"
    get:
      tags: [Accounts]
      summary: Get a credit card's outstanding-balance history by month
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CreditCardMonthBalance" }

  # =========================================================== CATEGORIES
  /categories:
    get:
      tags: [Categories]
      summary: List categories (with their subcategories)
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
    post:
      tags: [Categories]
      summary: Create a category
      description: >
        FR-10.1. A custom Category supplementing the predefined default
        set every household is seeded with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - icon
                - color
              properties:
                name: { type: string }
                icon:
                  type: string
                  description: Icon name from the in-code icon set (Material Symbols)
                color:
                  type: string
                  enum:
                    - mint
                    - emerald
                    - teal
                    - cyan
                    - sky
                    - blue
                    - indigo
                    - violet
                    - lilac
                    - fuchsia
                    - pink
                    - rose
                    - coral
                    - peach
                    - orange
                    - sun
                    - lime
                    - slate
                  description: Palette token, not a hex — resolves per theme (OQ-85)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Categories]
      summary: Get a category (with its subcategories)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
    patch:
      tags: [Categories]
      summary: Edit a category, including its Subcategories
      description: >
        FR-10.2. Creating a new Subcategory under this Category is
        folded into this same request. The two-level limit is
        structural — a Subcategory payload has no field to nest a
        further level, so there is nothing to reject at runtime.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /categories/{categoryId}/archive:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      tags: [Categories]
      summary: Archive a category (cascades to its Subcategories)
      description: >
        FR-10.3/FR-10.4. One-way. Cascades: stamps this Category's
        archived_at, then every live Subcategory's, in one transaction.
      responses:
        "204": { description: No Content }

  /categories/{categoryId}/subcategories/{subcategoryId}/archive:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
      - $ref: "#/components/parameters/SubcategoryId"
    post:
      tags: [Categories]
      summary: Archive a single subcategory (parent/siblings unaffected)
      description: FR-10.3/FR-10.4. One-way, single-row — no cascade in this direction.
      responses:
        "204": { description: No Content }

  # =========================================================== BUDGETS
  /budgets:
    get:
      tags: [Budgets]
      summary: List budgets
      parameters:
        - name: visibility
          in: query
          schema: { type: string, enum: [personal, shared] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Budget" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      tags: [Budgets]
      summary: Create a budget
      description: >
        FR-4.1/FR-4.7. A Category or Subcategory can be claimed by at
        most one Budget per scope — a real partial-unique-index
        constraint one layer down, not application logic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "409":
          description: A target is already claimed by another Budget in this scope (FR-4.7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /budgets/{budgetId}:
    parameters:
      - $ref: "#/components/parameters/BudgetId"
    get:
      tags: [Budgets]
      summary: Get a budget
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
    patch:
      tags: [Budgets]
      summary: Edit a budget
      description: >
        FR-4.9. Changing targetAmount only affects the current and
        future Budget Periods; past periods keep the target actually in
        effect at the time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "409":
          description: A newly assigned target is already claimed elsewhere (FR-4.7).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Budgets]
      summary: Delete a budget
      description: >
        FR-4.10/OQ-40. Hard delete of the live definition only — unlike
        every other archive/delete decision in this project, past
        Budget Periods are unaffected (budget_periods.budget_id is a
        nullable FK, ON DELETE SET NULL) and survive on their own.
        Releases every Category/Subcategory this Budget had claimed.
      responses:
        "204": { description: No Content }

  /budgets/{budgetId}/periods:
    parameters:
      - $ref: "#/components/parameters/BudgetId"
    get:
      tags: [Budgets]
      summary: Get a budget's monthly period history (target vs. actual spend)
      description: FR-4.3/FR-4.9. Backs the Budget status display.
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BudgetPeriod" }

  # =========================================================== INVESTMENTS
  /accounts/{accountId}/holdings:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [Investments]
      summary: List Investment Holdings for an account
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InvestmentHolding" }
  /holdings/{holdingId}:
    parameters:
      - $ref: "#/components/parameters/HoldingId"
    get:
      tags: [Investments]
      summary: Get an Investment Holding
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestmentHolding" }
    patch:
      tags: [Investments]
      summary: Edit a Holding's goal allocations
      description: >
        FR-8.2/8.3/OQ-48. Goal allocations only (narrowed Oct 2026) — the
        Holding is the entry point, never the Goal (OQ-48). Position
        changes only through transactions; market value has its own
        endpoints under /valuation-snapshots (OQ-56). Replace-all; rejected
        with 409 `goal.allocation_exceeds_100` past 100%. See
        docs/design/diagrams/sequences/track-investments/uc-02-edit-holding.html.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldingUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvestmentHolding" }
        "409":
          description: This Holding's total allocated percentage would exceed 100% (FR-8.3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /holdings/{holdingId}/archive:
    parameters:
      - $ref: "#/components/parameters/HoldingId"
    post:
      tags: [Investments]
      summary: Archive an Investment Holding
      description: >
        FR-5.8/OQ-43. One-way, no unarchive — Valuation Snapshot history
        and Goal allocations both depend on the Holding continuing
        to exist.
      responses:
        "204": { description: No Content }

  /holdings/{holdingId}/valuation-snapshots:
    parameters:
      - $ref: "#/components/parameters/HoldingId"
    get:
      tags: [Investments]
      summary: Get a Holding's valuation history
      description: >
        FR-5.2/FR-5.4. Market-priced assetTypes only (OQ-51) — a
        fixed-term Holding never populates this; read its costBasis
        instead.
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ValuationSnapshot" }
    post:
      tags:
        - Investments
      operationId: recordMarketValue
      summary: Record a market value (manual Valuation Snapshot)
      description: FR-5.2 / OQ-56 — market-priced Holdings only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValuationSnapshotInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValuationSnapshot'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /holdings/{holdingId}/schedule-entries:
    parameters:
      - $ref: "#/components/parameters/HoldingId"
    get:
      tags: [Investments]
      summary: Get a fixed-term Holding's contractual cash-event schedule
      description: >
        FR-11.1/FR-11.2. Read-only from this API — entries are computed
        by InvestmentProductEngine at purchase time (OQ-53) and posted
        automatically by a scheduled trigger (FR-11.3), never created
        directly through this endpoint.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/InvestmentScheduleEntry" }

  # =========================================================== TRANSACTIONS
  /transactions:
    get:
      tags: [Transactions]
      summary: Browse & filter all transactions (both ledgers, newest first)
      description: >-
        FR-3.12 / OQ-61 — not limited to a month; cursor pagination on (date, id). Owned by TransactionManager (read-ownership rule).
      parameters:
        - name: kinds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Transaction kinds
        - name: accountIds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Accounts
        - name: creditCardIds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Credit cards
        - name: categoryIds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Categories
        - name: holdingId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Investment transactions linked to this Holding
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
    post:
      tags: [Transactions]
      summary: Record a transaction (unified entry point)
      description: >
        FR-3.1/OQ-39. One unified entry point for both Account and Card
        Transactions — `target` narrows which kinds are valid, itself
        data-driven, not a second code path. The investment-buy-against-
        a-fixed-term-instrument sub-case is one of the two
        widest-fan-out flows in the whole system (the other is Delete
        User) — `assetType`/`ticker`/`quantity` are required for every
        investment kind, and `rate`/`dueDate` additionally for an
        investment_buy against a fixed-term instrument type (OQ-50,
        FR-11.2) — neither is derivable from `assetType` alone, since a
        CDB/LCI/LCA's specific term and rate are negotiated per contract.
        This is also now
        the *only* creation path for an Investment Holding — the
        once-separate onboarding backfill endpoint was retired (OQ-53).
        `allocations` optionally funds one or more Goals from this
        same investment_buy call (FR-8.2/OQ-54) — one call in, no
        separate PATCH /holdings/{holdingId} follow-up required.
        No recurring option (FR-3.5 removed, OQ-55). Investment kinds are
        rejected on credit-card-only accounts (422
        `transaction.investment_not_allowed_on_account`, OQ-76); a full
        sell/redemption auto-archives the Holding (OQ-72). See
        docs/design/diagrams/sequences/record-transactions/uc-01-record-transaction.html.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AccountTransaction"
                  - $ref: "#/components/schemas/CardTransaction"
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: One of `allocations`' Holdings would exceed 100% total allocated (FR-8.3).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: >
            Validation failure — includes currency mismatch (FR-2.2) and
            kind invalid for the target's type (FR-3.1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /transactions/{transactionId}:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      tags: [Transactions]
      summary: Get an Account Transaction
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountTransaction" }
    patch:
      tags: [Transactions]
      summary: Edit a transaction
      description: >
        FR-3.2/OQ-39. Works for either ledger. Real complexity: every
        downstream effect (balance movement, holding quantity, budget
        accrual) is reversed using the old values, then reapplied with
        the new ones, inside one write — the same mechanic that drives
        the backdated-balance cascade if the date moves to a different
        month. See
        docs/design/diagrams/sequences/record-transactions/uc-02-edit-transaction.html.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountTransaction" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      description: >
        FR-3.2. Same reverse-effect complexity as Edit, without a
        reapply half.
      responses:
        "204": { description: No Content }
        "403": { $ref: "#/components/responses/Forbidden" }

  /credit-cards/{creditCardId}/transactions:
    parameters:
      - $ref: "#/components/parameters/CreditCardId"
    get:
      tags: [Transactions]
      summary: List Card Transactions for a credit card
      description: FR-3.9. Its own ledger, separate from Account Transactions (OQ-16).
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CardTransaction" }
                  pagination: { $ref: "#/components/schemas/Pagination" }

  # =========================================================== INSIGHTS
  /dashboard:
    get:
      tags: [Insights]
      summary: 'Get the Dashboard (v1: fixed panels)'
      description: >-
        FR-6.0 / OQ-67 — no stored layout in v1; widgets are v3.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  netWorth:
                    $ref: '#/components/schemas/InvestmentsOverviewReport/properties/netWorth'
                  comingDue:
                    $ref: '#/components/schemas/InvestmentsOverviewReport/properties/comingDue'
                  payouts:
                    $ref: '#/components/schemas/PayoutsReport'
                  balances:
                    $ref: '#/components/schemas/MonthOverviewReport/properties/balances'
                  budgets:
                    $ref: '#/components/schemas/MonthOverviewReport/properties/budgets'
                  goals:
                    $ref: '#/components/schemas/MonthOverviewReport/properties/goals'

  /dashboard/widgets:
    patch:
      tags: [Insights]
      summary: '[v3] Edit dashboard layout (add/remove/reorder widgets)'
      description: >
        FR-6.1/FR-6.8. The same widgetType can appear more than once
        with different settings (e.g. two net-worth-trend widgets, one
        per currency) — no uniqueness constraint on (user, widgetType).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [widgets]
              properties:
                widgets:
                  type: array
                  items: { $ref: "#/components/schemas/DashboardWidgetInput" }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/ValidationError" }
      x-deferred: v3 (OQ-67)

  /reports/{reportType}:
    parameters:
      - name: reportType
        in: path
        required: true
        schema:
          type: string
          enum:
            - spend-by-category
            - income-vs-expense
            - account-balance-by-month
            - net-worth-trend
            - budget-status
        description: >
          Reference data (FR-6.7's Widget library), not a hardcoded
          branch — this enum lists the current v1 set; a new report
          type is additive.
    get:
      tags:
        - Reports
      summary: 'Get a report (v1 fixed types: month-overview, investments-overview, payouts)'
      description: >-
        Fixed v1 report types (sequence review Q1 — reports expand later). Ad-hoc types (spending by category, income vs expense) are v2 (OQ-71).
      parameters:
        - name: reportType
          in: path
          required: true
          schema:
            type: string
            enum:
              - month-overview
              - investments-overview
              - payouts
        - name: year
          in: query
          required: false
          schema:
            type: integer
          description: month-overview
        - name: month
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: month-overview
        - name: holdingIds
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: payouts — holdings to include
        - name: months
          in: query
          required: false
          schema:
            type: integer
            default: 12
          description: payouts — how many months back
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MonthOverviewReport'
                  - $ref: '#/components/schemas/InvestmentsOverviewReport'
                  - $ref: '#/components/schemas/PayoutsReport'
                discriminator:
                  propertyName: reportType
        "400": { $ref: "#/components/responses/BadRequest" }

  /reports/transactions/export:
    get:
      tags:
        - Reports
      summary: '[v2] Export transactions to CSV'
      description: >
        FR-6.4. A formatted PDF is a nice-to-have, not a v1 commitment
        — CSV is the only guaranteed export format.
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
      x-deferred: v2 (OQ-71)

  /notifications:
    get:
      tags: [Insights]
      summary: List the current user's notification inbox
      description: >
        FR-6.10/OQ-45. Opening the inbox marks every notification
        currently shown as `seenAt`, a bulk update. Standing
        infrastructure — both of FR-6.5's stated v1 triggers (budget
        threshold, Open Banking sync failure) are currently inactive
        (one removed per OQ-52, one deferred), so this list is typically
        empty today; the mechanism is fully wired regardless.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }

  /notifications/{notificationId}:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    delete:
      tags: [Insights]
      summary: Delete a notification
      description: >
        FR-6.10/OQ-45. Hard delete, no archive. 404, not 403, for a
        notification belonging to someone else.
      responses:
        "204": { description: No Content }
        "404": { $ref: "#/components/responses/NotFound" }

  # =========================================================== AUDIT
  /households/{householdId}/audit-log/export:
    parameters:
      - $ref: "#/components/parameters/HouseholdId"
    get:
      tags: [Audit]
      summary: Export the household's audit log to CSV
      description: >
        FR-7.2/OQ-46. Owner/Admin only. This is the Audit Log's ONLY
        access method in v1 — there is no in-app browsable table
        anywhere in this API. audit_log_entries carries no foreign keys
        by design (OQ-25/NFR-AUD-1) — actor/entity references are plain
        stored values, permanently orphan-tolerant.
      parameters:
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
  /holdings/{holdingId}/valuation-snapshots/{snapshotId}:
    parameters:
      - $ref: '#/components/parameters/HoldingId'
      - $ref: '#/components/parameters/SnapshotId'
    patch:
      tags:
        - Investments
      operationId: editMarketValue
      summary: Edit a manual market value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  $ref: '#/components/schemas/Money'
                asOf:
                  type: string
                  format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValuationSnapshot'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Investments
      operationId: deleteMarketValue
      summary: Delete a manual market value
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /index-rates:
    get:
      tags:
        - Investments
      operationId: listIndexRates
      summary: Every index with its value history (Rates tab)
      description: FR-11.6 / OQ-59 — household-scoped, manual.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndexRateSeries'
  /index-rates/{index}/values:
    parameters:
      - $ref: '#/components/parameters/IndexCode'
    post:
      tags:
        - Investments
      operationId: recordIndexRate
      summary: Record an index value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
                - asOf
              properties:
                value:
                  type: integer
                  description: Percent × 10,000 — 10.50% = 105000 (bigint fixed-point, OQ-86)
                asOf:
                  type: string
                  format: date
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexRateValue'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /index-rates/{index}/values/{valueId}:
    parameters:
      - $ref: '#/components/parameters/IndexCode'
      - $ref: '#/components/parameters/IndexValueId'
    patch:
      tags:
        - Investments
      operationId: editIndexRate
      summary: Edit an index value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: integer
                  description: Percent × 10,000 — 10.50% = 105000 (bigint fixed-point, OQ-86)
                asOf:
                  type: string
                  format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexRateValue'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Investments
      operationId: deleteIndexRate
      summary: Delete an index value
      responses:
        '204':
          description: No Content
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /goals:
    get:
      tags:
        - Goals
      summary: List goals with progress per currency (View Goals)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - completed
            default: active
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GoalWithProgress'
    post:
      tags:
        - Goals
      summary: Create an Goal
      description: >
        FR-8.1. Starts unfunded — allocating a Holding to it happens later, from the Holding's own edit flow (OQ-48).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /goals/{goalId}:
    parameters:
      - $ref: "#/components/parameters/GoalId"
    get:
      tags:
        - Goals
      summary: Get an Goal
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
    patch:
      tags:
        - Goals
      summary: Edit an Goal's name/target/due date
      description: >
        FR-8.1. Never editable here: allocations — see PATCH /holdings/{holdingId} (OQ-48).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoalUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags:
        - Goals
      summary: Delete an Goal
      description: >
        FR-8.6/OQ-47. Hard delete, no history — "this goal no longer makes sense." The underlying Investment Holdings are never deleted; only this Goal's allocations cascade away.
      responses:
        "204": { description: No Content }
  /goals/{goalId}/complete:
    parameters:
      - $ref: "#/components/parameters/GoalId"
    post:
      tags:
        - Goals
      summary: Complete an Goal ("this goal is completed")
      description: >
        FR-8.8/OQ-47. Unlike every other complete in this project, this one is reversible — see POST .../reopen. Keeps the record intact so historical progress-by-month stays viewable.
      responses:
        "204": { description: No Content }
  /goals/{goalId}/reopen:
    parameters:
      - $ref: "#/components/parameters/GoalId"
    post:
      tags:
        - Goals
      summary: Reopen an Goal
      description: >
        FR-8.9. The only "reopen" endpoint in the entire API — every other completed entity in this project stays completed, one-way.
      responses:
        "204": { description: No Content }
  /goals/{goalId}/allocations:
    parameters:
      - $ref: "#/components/parameters/GoalId"
    get:
      tags:
        - Goals
      summary: List which Holdings fund this Goal (read-only)
      description: >
        FR-8.2/OQ-48. Display-only — editing an allocation always happens via PATCH /holdings/{holdingId}, never here.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GoalAllocation" }
  /goals/{goalId}/progress:
    parameters:
      - $ref: "#/components/parameters/GoalId"
    get:
      tags:
        - Goals
      summary: Get an Goal's funding progress, current or by month
      description: >
        FR-8.5/FR-8.7/OQ-49. Returns each allocated Holding's contribution in its own native currency — cross-currency blending into one target-currency figure is a frontend concern, using a rate the user enters on the progress view itself (FR-8.4), not computed or stored here.
      parameters:
        - name: year
          in: query
          schema: { type: integer }
        - name: month
          in: query
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoalProgress" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Short-lived, stateless access token (OQ-30). Not required for
        registration, login, password-reset request/confirm, or MFA
        recovery — see each operation's `security` override.

  parameters:
    HouseholdId: { name: householdId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    CreditCardId: { name: creditCardId, in: path, required: true, schema: { type: string, format: uuid } }
    CategoryId: { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    SubcategoryId: { name: subcategoryId, in: path, required: true, schema: { type: string, format: uuid } }
    BudgetId: { name: budgetId, in: path, required: true, schema: { type: string, format: uuid } }
    HoldingId: { name: holdingId, in: path, required: true, schema: { type: string, format: uuid } }
    TransactionId: { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    StartDate:
      name: startDate
      in: query
      description: Inclusive, ISO 8601 date (YYYY-MM-DD).
      schema: { type: string, format: date }
    EndDate:
      name: endDate
      in: query
      description: Inclusive, ISO 8601 date (YYYY-MM-DD).
      schema: { type: string, format: date }
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from the previous page's `nextCursor`
    GoalId:
      name: goalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IndexCode:
      name: index
      in: path
      required: true
      schema:
        type: string
        enum:
          - selic
          - cdi
          - ipca
          - igpm
    IndexValueId:
      name: valueId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: 'Malformed request (e.g. unparseable date range or unknown enum value). Codes: e.g. `report.unknown_type_or_range`, `password_reset.token_invalid`.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 'Missing, invalid, or expired credentials. Codes: e.g. `auth.invalid_credentials` (identical for unknown user and wrong password), `auth.mfa_invalid`.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 'Authenticated, but not permitted to perform this action. Codes: `auth.forbidden`.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 'Resource does not exist, or does not belong to the caller. Codes: e.g. `session.not_found`, `notification.not_found`, `invitation.invitee_not_registered`.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: "The request conflicts with the resource's current state. Codes: e.g. `goal.allocation_exceeds_100`, `budget.target_already_claimed`, `invitation.not_pending`, `snapshot.automatic_not_editable`, `holding.not_market_priced`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: 'Request body failed validation. Codes: `validation.failed` with `details[]`, or specific codes such as `password.too_short`, `transaction.investment_not_allowed_on_account`.'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---------------------------------------------------- shared
    Error:
      type: object
      required:
        - error
      description: OQ-83 / NFR-I18N-3 — never display `message`; the frontend localizes `code` + `params` from the shared i18n catalog.
      properties:
        error:
          type: object
          required:
            - code
            - message
            - correlationId
          properties:
            code:
              type: string
              description: Namespaced, stable, e.g. `goal.allocation_exceeds_100`, `password.too_short`, `auth.invalid_credentials`
              example: goal.allocation_exceeds_100
            params:
              type: object
              additionalProperties: true
              description: Raw values for the localized message (IDs, numbers, ISO dates) — never display text
              example:
                current: 85
                requested: 30
            message:
              type: string
              description: English, for developers/logs only — never shown to users
            details:
              type: array
              description: Field-level errors
              items:
                type: object
                required:
                  - field
                  - code
                properties:
                  field:
                    type: string
                    example: allocations[1].percentage
                  code:
                    type: string
                    example: number.max
                  params:
                    type: object
                    additionalProperties: true
            correlationId:
              type: string
              description: Matches the server logs (NFR-OBS-1)

    Pagination:
      type: object
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }

    Money:
      type: integer
      description: >
        An integer count of the currency's minor unit (cents for
        USD/BRL, the only two currencies in v1 scope) — e.g. 1234.56
        USD is transmitted as 123456, never as a decimal or a string.
        Matches the underlying bigint column exactly, so no
        stringify/parse conversion happens anywhere in the stack (DB,
        backend, API, or frontend). See 03-api-design.md.
      example: 123456

    Quantity:
      type: integer
      description: >
        An integer count of 1e-8 units (8 decimal places, scale factor
        100,000,000) — the same fixed-point treatment as Money, applied
        to Investment Holding quantity instead of currency. 10 shares is
        transmitted as 1000000000; Tesouro Direto's 0.01 minimum
        increment is 100000. One fixed exponent for every assetType
        (stock/FII/fixed-income/fund) rather than a per-instrument
        lookup, since there's no ISO-style standard giving investment
        quantity a natural exponent the way currency has minor units.
        Matches the underlying bigint column exactly — never a decimal
        or a string. See 03-api-design.md.
      example: 1000000000

    AuthTokens:
      type: object
      properties:
        accessToken: { type: string, description: "Short-lived JWT, stateless (OQ-30)" }
        refreshToken: { type: string, description: "Server-tracked, revocable (backs sessions)" }

    # ---------------------------------------------------- identity & household
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        createdAt: { type: string, format: date-time }
        preferences:
          $ref: '#/components/schemas/UserPreferences'

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceInfo: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }

    Household:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }

    HouseholdMembership:
      type: object
      properties:
        userId: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        role: { type: string, enum: [Owner, Admin, Member, Viewer], description: "FR-1.6 — exactly one of four, fixed set" }
        joinedAt: { type: string, format: date-time, description: "Read directly by FR-1.18's succession rule" }

    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        invitedUserId: { type: string, format: uuid }
        invitedByUserId: { type: string, format: uuid }
        role: { type: string, enum: [Admin, Member, Viewer] }
        status: { type: string, enum: [pending, accepted, declined, revoked] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    # ---------------------------------------------------- accounts
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid, nullable: true, description: "Identity for personal, provenance for shared (dual-role, FR-1.17)" }
        name: { type: string }
        type: { type: string, enum: [checking, savings, credit_card_only, investment], description: "Immutable once set, OQ-32. Four types since OQ-76." }
        currency: { type: string, description: "ISO 4217, immutable once set, FR-2.2" }
        visibility: { type: string, enum: [personal, shared] }
        archivedAt: { type: string, format: date-time, nullable: true, description: "One-way, FR-2.4/OQ-34" }
        createdAt: { type: string, format: date-time }

    AccountCreateRequest:
      type: object
      required: [name, type, currency, visibility]
      properties:
        name: { type: string }
        type: { type: string, enum: [checking, savings, credit_card_only, investment] }
        currency: { type: string }
        visibility: { type: string, enum: [personal, shared] }
        openingBalance: { $ref: "#/components/schemas/Money" }
        cards:
          type: array
          items: { $ref: "#/components/schemas/CreditCardInput" }

    AccountUpdateRequest:
      type: object
      properties:
        name: { type: string }
        visibility: { type: string, enum: [personal, shared] }
        cards:
          type: array
          items: { $ref: "#/components/schemas/CreditCardInput" }

    CreditCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        network: { type: string, description: "Reference data (Visa, Mastercard, Elo, Amex, other, ...) — extensible, not a hardcoded enum" }
        last4: { type: string }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
        expirationMonth: { type: integer, minimum: 1, maximum: 12 }
        expirationYear: { type: integer }
        createdAt: { type: string, format: date-time }

    CreditCardInput:
      type: object
      properties:
        id: { type: string, format: uuid, description: "Omit to attach a new card" }
        network: { type: string }
        last4: { type: string }
        closingDay: { type: integer }
        dueDay: { type: integer }
        expirationMonth: { type: integer }
        expirationYear: { type: integer }
        _remove: { type: boolean, description: "Set true with an existing id to remove this card" }

    AccountMonthBalance:
      type: object
      properties:
        year: { type: integer }
        month: { type: integer }
        openingBalance: { $ref: "#/components/schemas/Money" }
        endingBalance: { $ref: "#/components/schemas/Money" }
        updatedAt: { type: string, format: date-time }

    CreditCardMonthBalance:
      type: object
      properties:
        year: { type: integer }
        month: { type: integer }
        openingOutstandingBalance: { $ref: "#/components/schemas/Money" }
        endingOutstandingBalance: { $ref: "#/components/schemas/Money" }
        updatedAt: { type: string, format: date-time }

    # ---------------------------------------------------- categories
    Subcategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string }
        archivedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        name: { type: string }
        archivedAt: { type: string, format: date-time, nullable: true, description: "One-way, cascades to Subcategories, FR-10.3/10.4" }
        createdAt: { type: string, format: date-time }
        subcategories:
          type: array
          items: { $ref: "#/components/schemas/Subcategory" }
        icon:
          type: string
          description: Icon name from the in-code icon set (Material Symbols)
        color:
          type: string
          enum:
            - mint
            - emerald
            - teal
            - cyan
            - sky
            - blue
            - indigo
            - violet
            - lilac
            - fuchsia
            - pink
            - rose
            - coral
            - peach
            - orange
            - sun
            - lime
            - slate
          description: Palette token, not a hex — resolves per theme (OQ-85)

    CategoryUpdateRequest:
      type: object
      properties:
        name: { type: string }
        subcategories:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid, description: "Omit to create a new Subcategory" }
              name: { type: string }
        icon:
          type: string
          description: Icon name from the in-code icon set (Material Symbols)
        color:
          type: string
          enum:
            - mint
            - emerald
            - teal
            - cyan
            - sky
            - blue
            - indigo
            - violet
            - lilac
            - fuchsia
            - pink
            - rose
            - coral
            - peach
            - orange
            - sun
            - lime
            - slate
          description: Palette token, not a hex — resolves per theme (OQ-85)

    # ---------------------------------------------------- budgets
    BudgetTargetInput:
      type: object
      description: "Exactly one of categoryId/subcategoryId, never both."
      properties:
        categoryId: { type: string, format: uuid }
        subcategoryId: { type: string, format: uuid }

    Budget:
      type: object
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        visibility: { type: string, enum: [personal, shared] }
        targets:
          type: array
          items: { $ref: "#/components/schemas/BudgetTargetInput" }
        createdAt: { type: string, format: date-time }

    BudgetCreateRequest:
      type: object
      required: [name, targetAmount, currency, visibility, targets]
      properties:
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        visibility: { type: string, enum: [personal, shared] }
        targets:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/BudgetTargetInput" }

    BudgetUpdateRequest:
      type: object
      properties:
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/Money" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/BudgetTargetInput" }

    BudgetPeriod:
      type: object
      properties:
        year: { type: integer }
        month: { type: integer }
        targetAmount: { $ref: "#/components/schemas/Money" }
        spendAmount: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }

    # ---------------------------------------------------- investments
    InvestmentHolding:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        assetType:
          type: string
          enum:
            - stock
            - fii
            - fund
            - mutual_fund
            - currency
            - crypto
            - real_estate
            - other
            - cdb
            - lc
            - lf
            - lci
            - lca
            - cra
            - cri
            - debenture
            - tesouro_direto
            - cd
            - treasury
          description: 'Market-priced: stock, fii, fund, mutual_fund, currency, crypto, real_estate, other. Fixed-term (engine schedule + tax): cdb, lc, lf, lci, lca, cra, cri, debenture, tesouro_direto, cd, treasury (OQ-79). Reference data.'
        ticker: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
        costBasis: { $ref: "#/components/schemas/Money" }
        rate:
          type: object
          nullable: true
          description: "Fixed-term instrument types only (OQ-50) — this purchase's own immutable rate, set at creation and never recomputed."
          properties:
            type: { type: string, enum: [fixed, cdi, ipca, igpm, selic] }
            value:
              type: integer
              description: Percent × 10,000 — 10.50% = 105000 (bigint fixed-point, OQ-86)
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt: { type: string, format: date-time }
        incentivised:
          type: boolean
          nullable: true
          description: Debentures only — incentivised debentures are income-tax exempt for individuals (OQ-79)
        archivedBy:
          type: string
          enum:
            - system
            - user
          nullable: true
          description: '`system` = quantity reached 0, undone automatically if that transaction changes (OQ-80); `user` = one-way'
        expectedPayout:
          $ref: '#/components/schemas/Money'
          description: Fixed-term only, computed on read by InvestmentProductEngine.project (FR-11.2) — gross at maturity
        expectedTaxes:
          type: object
          nullable: true
          description: 'Fixed-term only. `estimated: false` for US instruments (OQ-79)'
          properties:
            estimated:
              type: boolean
            amount:
              $ref: '#/components/schemas/Money'

    HoldingUpdateRequest:
      type: object
      required:
        - allocations
      description: 'Narrowed (Oct 2026): goal allocations only — position changes through transactions, market value through valuation-snapshots. Replace-all semantics.'
      properties:
        allocations:
          type: array
          items:
            type: object
            required:
              - goalId
              - percentage
            properties:
              goalId:
                type: string
                format: uuid
              percentage:
                type: integer
                minimum: 1
                maximum: 100
                description: Whole percent (60 = 60%) — integer, no floats; contribution = value × pct / 100, rounded half-up to the cent (OQ-87)
    ValuationSnapshot:
      type: object
      properties:
        id: { type: string, format: uuid }
        holdingId: { type: string, format: uuid }
        valuation: { $ref: "#/components/schemas/Money" }
        asOfDate: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        source:
          type: string
          enum:
            - manual
            - transaction
          description: Only `manual` snapshots can be edited/deleted (OQ-56)
        accountTransactionId:
          type: string
          format: uuid
          nullable: true
          description: Set for `transaction` snapshots

    InvestmentScheduleEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        holdingId: { type: string, format: uuid }
        kind: { type: string, enum: [interest_payment, redemption, tax] }
        amount: { $ref: "#/components/schemas/Money" }
        date: { type: string, format: date }
        postedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    # ---------------------------------------------------- transactions
    TransactionCreateRequest:
      type: object
      required: [kind, date, amount, currency]
      properties:
        accountId: { type: string, format: uuid, description: "Exactly one of accountId/creditCardId" }
        creditCardId: { type: string, format: uuid }
        kind: { type: string, description: "Reference data, e.g. withdrawal, deposit, transfer sent/received, investment buy, card charge, ... FR-3.1" }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        categoryId: { type: string, format: uuid }
        subcategoryId: { type: string, format: uuid }
        description: { type: string }
        assetType: { type: string, description: "Investment kinds only, required for investment_buy (FR-5.1) — stock/FII/CDB-fixed-income/fund/other." }
        ticker: { type: string, description: "Investment kinds only, required (FR-5.1) — matches an existing Holding in this account by ticker; a new ticker on investment_buy creates one." }
        quantity: { $ref: "#/components/schemas/Quantity" }
        rate:
          type: object
          nullable: true
          description: "Fixed-term instrument types only, investment_buy only (OQ-50) — this purchase's own immutable rate, set at creation and never recomputed."
          properties:
            type: { type: string, enum: [fixed, cdi, ipca, igpm, selic] }
            value: { type: number, description: "Fixed: annual % rate. CDI/Selic: % of the index (e.g. 100 = 100%). IPCA/IGP-M: spread above the index." }
        dueDate: { type: string, format: date, description: "Fixed-term instrument types only, required for investment_buy (FR-11.1/FR-11.2) — the contract's maturity date. Not derivable from assetType alone (a CDB's term is negotiated per contract); InvestmentProductEngine uses it, alongside date and rate, to compute the interest-payment schedule between purchase and maturity, never to derive maturity itself." }
        allocations:
          type: array
          description: "investment_buy only, optional (FR-8.2/OQ-54) — allocate this purchase across one or more Goals in the same call that creates/updates the Holding, instead of a separate PATCH /holdings/{holdingId} afterward. The Holding is still the entry point (OQ-48); this is the same write, just bundled at creation time."
          items:
            type: object
            required:
              - goalId
              - percentage
            properties:
              goalId:
                type: string
                format: uuid
              percentage:
                type: integer
                minimum: 1
                maximum: 100
                description: Whole percent (60 = 60%) — integer, no floats; contribution = value × pct / 100, rounded half-up to the cent (OQ-87)
        incentivised:
          type: boolean
          description: Debenture buys only (OQ-79)

    TransactionUpdateRequest:
      type: object
      properties:
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        categoryId: { type: string, format: uuid }
        subcategoryId: { type: string, format: uuid }
        description: { type: string }

    AccountTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        kind: { type: string }
        effect: { type: string, enum: [movement, transfer, bill_payment, investment_trade], description: "Persisted via EFFECT_BY_KIND, not recomputed — see 02-data-model.md" }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        categoryId: { type: string, format: uuid, nullable: true }
        subcategoryId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        holdingId: { type: string, format: uuid, nullable: true, description: "Investment kinds only" }
        creditCardId: { type: string, format: uuid, nullable: true, description: "Bill payment only — the one bridge between the two ledgers" }
        source:
          type: string
          enum:
            - manual
            - schedule
          description: '`schedule` = posted by investmentsDaily (FR-11.3); was manual/recurring (OQ-55)'
        createdAt: { type: string, format: date-time }
        ledger:
          type: string
          enum:
            - account

    CardTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        creditCardId: { type: string, format: uuid }
        kind: { type: string, enum: [charge, refund] }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        categoryId: { type: string, format: uuid, nullable: true }
        subcategoryId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        ledger:
          type: string
          enum:
            - card

    # ---------------------------------------------------- insights
    DashboardWidget:
      type: object
      properties:
        id: { type: string, format: uuid }
        widgetType: { type: string, description: "Reference data, FR-6.7 — account balances summary, recent transactions, budget status, net worth trend, ..." }
        position: { type: integer }
        settings:
          type: object
          description: "Shape varies by widgetType — date range plus whichever account/Budget/Goal/currency is relevant, FR-6.9"
        createdAt: { type: string, format: date-time }

    DashboardWidgetInput:
      type: object
      required: [widgetType, position]
      properties:
        id: { type: string, format: uuid, description: "Omit to add a new widget" }
        widgetType: { type: string }
        position: { type: integer }
        settings: { type: object }
        _remove: { type: boolean }

    Notification:
      description: OQ-82 — type + params, never text; the frontend renders and localizes it (NFR-I18N-3).
      oneOf:
        - $ref: '#/components/schemas/InvitationReceivedNotification'
        - $ref: '#/components/schemas/HoldingMaturedNotification'
      discriminator:
        propertyName: type
    CursorPage:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
          description: null when there are no more items
    UserPreferences:
      type: object
      description: FR-1.21 — per user, not per household
      properties:
        theme:
          type: string
          enum:
            - dark
            - light
            - system
          default: dark
        language:
          type: string
          enum:
            - pt-BR
            - en-US
    ValuationSnapshotInput:
      type: object
      required:
        - value
        - asOf
      properties:
        value:
          $ref: '#/components/schemas/Money'
        asOf:
          type: string
          format: date
    IndexRateValue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        index:
          type: string
          enum:
            - selic
            - cdi
            - ipca
            - igpm
        value:
          type: integer
          description: Percent × 10,000 — 10.50% = 105000 (bigint fixed-point, OQ-86)
        asOf:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    IndexRateSeries:
      type: object
      properties:
        index:
          type: string
          enum:
            - selic
            - cdi
            - ipca
            - igpm
        unit:
          type: string
          enum:
            - annual
            - trailing_12m
        values:
          type: array
          items:
            $ref: '#/components/schemas/IndexRateValue'
    Goal:
      type: object
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/Money" }
        targetCurrency: { type: string }
        dueDate: { type: string, format: date }
        visibility: { type: string, enum: [personal, shared] }
        createdAt: { type: string, format: date-time }
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Complete sets it, reopen nulls it — the one reversible lifecycle flag (FR-8.8/8.9, OQ-78)
    GoalAllocation:
      type: object
      properties:
        id: { type: string, format: uuid }
        holdingId: { type: string, format: uuid }
        percentage:
          type: integer
          minimum: 1
          maximum: 100
          description: Whole percent (60 = 60%) — integer, no floats; contribution = value × pct / 100, rounded half-up to the cent (OQ-87)
        createdAt: { type: string, format: date-time }
        goalId:
          type: string
          format: uuid
    GoalCreateRequest:
      type: object
      required: [name, targetAmount, targetCurrency, dueDate, visibility]
      properties:
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/Money" }
        targetCurrency: { type: string }
        dueDate: { type: string, format: date }
        visibility: { type: string, enum: [personal, shared] }
    GoalProgress:
      type: object
      description: "FR-8.5 — per-Holding contributions in native currency; blending is a frontend concern."
      properties:
        targetAmount: { $ref: "#/components/schemas/Money" }
        targetCurrency: { type: string }
        contributions:
          type: array
          items:
            type: object
            properties:
              holdingId: { type: string, format: uuid }
              currency: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
        goalId:
          type: string
          format: uuid
    GoalUpdateRequest:
      type: object
      properties:
        name: { type: string }
        targetAmount: { $ref: "#/components/schemas/Money" }
        targetCurrency: { type: string }
        dueDate: { type: string, format: date }
    GoalWithProgress:
      allOf:
        - $ref: '#/components/schemas/Goal'
        - type: object
          properties:
            contributions:
              type: array
              items:
                type: object
                properties:
                  holdingId: { type: string, format: uuid }
                  currency: { type: string }
                  amount: { $ref: "#/components/schemas/Money" }
            fundedBy:
              type: array
              items:
                type: object
                properties:
                  holdingId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  percentage:
                    type: integer
                    minimum: 1
                    maximum: 100
                    description: Whole percent (60 = 60%) — integer, no floats; contribution = value × pct / 100, rounded half-up to the cent (OQ-87)
    LedgerItem:
      oneOf:
        - $ref: '#/components/schemas/AccountTransaction'
        - $ref: '#/components/schemas/CardTransaction'
      discriminator:
        propertyName: ledger
      description: Both ledgers merged; `ledger` is `account` or `card`
    TransactionPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LedgerItem'
            dayTotals:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  currency:
                    type: string
                  net:
                    $ref: '#/components/schemas/Money'
    MoneyByCurrency:
      type: object
      properties:
        currency:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
    MonthOverviewReport:
      type: object
      description: FR-6.11 / FR-6.6 / FR-4.3 / FR-8.5
      properties:
        reportType:
          type: string
          enum:
            - month-overview
        summary:
          type: array
          description: Per currency, never summed
          items:
            type: object
            properties:
              currency:
                type: string
              in:
                $ref: '#/components/schemas/Money'
              out:
                $ref: '#/components/schemas/Money'
              net:
                $ref: '#/components/schemas/Money'
        yearStrip:
          type: array
          items:
            type: object
            properties:
              month:
                type: integer
              currency:
                type: string
              in:
                $ref: '#/components/schemas/Money'
              out:
                $ref: '#/components/schemas/Money'
        balances:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
                format: uuid
              creditCardId:
                type: string
                format: uuid
                nullable: true
              currency:
                type: string
              amount:
                $ref: '#/components/schemas/Money'
        budgets:
          type: array
          description: Over-budget first
          items:
            $ref: '#/components/schemas/BudgetPeriod'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalWithProgress'
    InvestmentsOverviewReport:
      type: object
      description: FR-5.3 / FR-5.9
      properties:
        reportType:
          type: string
          enum:
            - investments-overview
        netWorth:
          type: array
          items:
            type: object
            properties:
              currency:
                type: string
              amount:
                $ref: '#/components/schemas/Money'
              changeVsPreviousMonth:
                $ref: '#/components/schemas/Money'
              series:
                type: array
                items:
                  type: object
                  properties:
                    month:
                      type: string
                    amount:
                      $ref: '#/components/schemas/Money'
        payoutThisMonth:
          type: array
          items:
            type: object
            properties:
              holdingId:
                type: string
                format: uuid
              transactionId:
                type: string
                format: uuid
              kind:
                type: string
              date:
                type: string
                format: date
              currency:
                type: string
              amount:
                $ref: '#/components/schemas/Money'
        allocations:
          type: array
          items:
            type: object
            properties:
              group:
                type: string
              currency:
                type: string
              holdingId:
                type: string
                format: uuid
                nullable: true
              amount:
                $ref: '#/components/schemas/Money'
        comingDue:
          type: array
          items:
            type: object
            properties:
              holdingId:
                type: string
                format: uuid
              name:
                type: string
              dueDate:
                type: string
                format: date
              currency:
                type: string
              amount:
                $ref: '#/components/schemas/Money'
    PayoutsReport:
      type: object
      description: FR-5.9 — sums of dividend/interest transactions linked to each Holding
      properties:
        reportType:
          type: string
          enum:
            - payouts
        series:
          type: array
          items:
            type: object
            properties:
              holdingId:
                type: string
                format: uuid
              currency:
                type: string
              months:
                type: array
                items:
                  type: object
                  properties:
                    month:
                      type: string
                    amount:
                      $ref: '#/components/schemas/Money'
    InvitationReceivedNotification:
      type: object
      required:
        - type
        - params
      properties:
        id:
          type: string
          format: uuid
        seenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - invitation.received
        params:
          type: object
          properties:
            invitationId:
              type: string
              format: uuid
            householdId:
              type: string
              format: uuid
            inviterUserId:
              type: string
              format: uuid
            role:
              type: string
    HoldingMaturedNotification:
      type: object
      required:
        - type
        - params
      properties:
        id:
          type: string
          format: uuid
        seenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - holding.matured
        params:
          type: object
          properties:
            holdingId:
              type: string
              format: uuid
            holdingName:
              type: string
              description: Historical label, snapshotted
            dueDate:
              type: string
              format: date
