<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — New Finance App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: '#0C100F', card: '#131917', raised: '#1A211E', line: '#232C28',
        ink: '#E7ECE9', muted: '#97A39D', faint: '#5F6B65',
        mint: '#5EE6B8', mintdeep: '#0F3B2E', coral: '#FF6B6B', coraldeep: '#3A1717',
        sky: '#7CB9FF', sun: '#FFD166', lilac: '#C792EA', peach: '#FF8C69'
      },
      fontFamily: { display: ['Manrope', 'sans-serif'], sans: ['Inter', 'sans-serif'] },
      borderRadius: { xl2: '20px' }
    }
  }
}
</script>
<style>
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .bar { position: relative; height: 28px; border-radius: 999px; background: #222B27; overflow: hidden; }
  .bar > .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
  .bar > .lbl { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 14px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .bar > .lbl.on { color: #062A1F; }
  .month { position: relative; }
  .month .spark { display: flex; align-items: flex-end; gap: 2px; height: 22px; }
  .month .spark i { display: block; width: 5px; border-radius: 3px; }
  .day { display: flex; justify-content: space-between; padding: 8px 20px; background: rgba(26,33,30,.6); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #97A39D; }
  .day span { text-transform: none; letter-spacing: 0; }
  .tx { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 20px; border-bottom: 1px solid rgba(35,44,40,.7); cursor: pointer; background: transparent; color: inherit; font: inherit; }
  .tx:hover { background: rgba(255,255,255,.03); }
  .tx:focus-visible { outline: 2px solid #5EE6B8; outline-offset: -2px; }
  .tx .ico { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; }
  .tx .meta { font-size: 13px; color: #97A39D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .chev { color: #5F6B65; flex-shrink: 0; transition: transform .2s; }
  .rail-head { display: flex; align-items: center; justify-content: space-between; }
  .period { margin-left: 8px; padding: 2px 10px; border-radius: 999px; background: #0F3B2E; color: #5EE6B8; font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; vertical-align: middle; }
  .arrow { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; border: 1px solid #232C28; color: #97A39D; }
  .arrow:hover { background: rgba(255,255,255,.05); color: #E7ECE9; }
  .rail-wrap { position: relative; }
  .rail-wrap::after { content: ""; position: absolute; top: 0; right: 0; bottom: 8px; width: 56px; background: linear-gradient(to right, rgba(12,16,15,0), #0C100F); pointer-events: none; }
  .rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; scrollbar-width: thin; scrollbar-color: #232C28 transparent; }
  .rail > * { scroll-snap-align: start; flex-shrink: 0; }
  .bcard { width: 196px; border-radius: 20px; background: #131917; border: 1px solid #232C28; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .blabel { display: flex; align-items: center; gap: 8px; color: #97A39D; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ico-sm { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; }
  .bval { font-family: Manrope, sans-serif; font-size: 22px; font-weight: 700; }
  .cap { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #97A39D; font-weight: 600; }
  .rcard { width: 272px; border-radius: 20px; background: #131917; border: 1px solid #232C28; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .ring { --p: 0; --c: #5EE6B8; width: 64px; height: 64px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center;
          background: radial-gradient(closest-side, #131917 78%, transparent 79%), conic-gradient(var(--c) calc(var(--p) * 1%), #232C28 0); }
  .ring span { font-size: 13px; font-weight: 700; }
</style>
</head>
<body>
<div class="min-h-screen bg-bg text-ink font-sans">

  <!-- App bar -->
  <header class="h-16 flex items-center gap-3 px-6 border-b border-line bg-card/80">
    <button class="w-10 h-10 rounded-full grid place-items-center hover:bg-white/5" aria-label="Open navigation menu">
      <iconify-icon icon="material-symbols:menu" width="22"></iconify-icon>
    </button>
    <div class="w-8 h-8 rounded-[10px] bg-mint grid place-items-center text-[#00382B]">
      <iconify-icon icon="material-symbols:savings-outline" width="18"></iconify-icon>
    </div>
    <span class="font-display font-700 font-semibold">New Finance App</span>
  </header>
