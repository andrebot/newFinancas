<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup complete — New Finance App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: '#0C100F', card: '#131917', raised: '#1A211E', line: '#232C28',
        ink: '#E7ECE9', muted: '#97A39D', faint: '#5F6B65',
        mint: '#5EE6B8', mintdeep: '#0F3B2E', coral: '#FF6B6B', coraldeep: '#3A1717',
        sky: '#7CB9FF', sun: '#FFD166', lilac: '#C792EA', peach: '#FF8C69'
      },
      fontFamily: { display: ['Manrope', 'sans-serif'], sans: ['Inter', 'sans-serif'] },
      borderRadius: { xl2: '20px' }
    }
  }
}
</script>
<style>
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .bar { position: relative; height: 28px; border-radius: 999px; background: #222B27; overflow: hidden; }
  .bar > .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
  .bar > .lbl { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 14px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .bar > .lbl.on { color: #062A1F; }
  .month { position: relative; }
  .month .spark { display: flex; align-items: flex-end; gap: 2px; height: 22px; }
  .month .spark i { display: block; width: 5px; border-radius: 3px; }
  .day { display: flex; justify-content: space-between; padding: 8px 20px; background: rgba(26,33,30,.6); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #97A39D; }
  .day span { text-transform: none; letter-spacing: 0; }
  .tx { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 20px; border-bottom: 1px solid rgba(35,44,40,.7); cursor: pointer; background: transparent; color: inherit; font: inherit; }
  .tx:hover { background: rgba(255,255,255,.03); }
  .tx:focus-visible { outline: 2px solid #5EE6B8; outline-offset: -2px; }
  .tx .ico { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; }
  .tx .meta { font-size: 13px; color: #97A39D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .chev { color: #5F6B65; flex-shrink: 0; transition: transform .2s; }
  .rail-head { display: flex; align-items: center; justify-content: space-between; }
  .period { margin-left: 8px; padding: 2px 10px; border-radius: 999px; background: #0F3B2E; color: #5EE6B8; font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; vertical-align: middle; }
  .arrow { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; border: 1px solid #232C28; color: #97A39D; }
  .arrow:hover { background: rgba(255,255,255,.05); color: #E7ECE9; }
  .rail-wrap { position: relative; }
  .rail-wrap::after { content: ""; position: absolute; top: 0; right: 0; bottom: 8px; width: 56px; background: linear-gradient(to right, rgba(12,16,15,0), #0C100F); pointer-events: none; }
  .rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; scrollbar-width: thin; scrollbar-color: #232C28 transparent; }
  .rail > * { scroll-snap-align: start; flex-shrink: 0; }
  .bcard { width: 196px; border-radius: 20px; background: #131917; border: 1px solid #232C28; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .blabel { display: flex; align-items: center; gap: 8px; color: #97A39D; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ico-sm { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; }
  .bval { font-family: Manrope, sans-serif; font-size: 22px; font-weight: 700; }
  .cap { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #97A39D; font-weight: 600; }
  .rcard { width: 272px; border-radius: 20px; background: #131917; border: 1px solid #232C28; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
  .ring { --p: 0; --c: #5EE6B8; width: 64px; height: 64px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center;
          background: radial-gradient(closest-side, #131917 78%, transparent 79%), conic-gradient(var(--c) calc(var(--p) * 1%), #232C28 0); }
  .ring span { font-size: 13px; font-weight: 700; }
  .ghost { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; color: #5F6B65; }
  .ghost:hover { background: rgba(255,255,255,.05); color: #E7ECE9; }
  .field label, .flabel { display: block; font-size: 12px; font-weight: 600; color: #97A39D; margin-bottom: 6px; }
  .field input { width: 100%; height: 46px; border-radius: 14px; background: #0C100F; border: 1px solid #232C28; padding: 0 14px; color: #E7ECE9; font-size: 15px; }
  .field input:focus { outline: none; border-color: #5EE6B8; box-shadow: 0 0 0 3px rgba(94,230,184,.15); }
  .opt { height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid #232C28; font-size: 14px; color: #E7ECE9; display: inline-flex; align-items: center; gap: 6px; }
  .opt[aria-pressed="true"] { border-color: rgba(94,230,184,.6); background: #0F3B2E; color: #5EE6B8; font-weight: 600; }
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #1A211E; color: #97A39D; }
  .kindtab { flex: 1; height: 64px; border-radius: 16px; border: 1px solid #232C28; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: #97A39D; }
  .kindtab[aria-selected="true"] { border-color: rgba(94,230,184,.6); background: #0F3B2E; color: #5EE6B8; }
  .switch { width: 40px; height: 24px; border-radius: 999px; background: #232C28; position: relative; flex-shrink: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 999px; background: #97A39D; }
  .switch[aria-checked="true"] { background: #5EE6B8; } .switch[aria-checked="true"]::after { left: 19px; background: #062A1F; }
  .drawer-scrim { position: fixed; inset: 64px 0 0 0; background: rgba(0,0,0,.55); }
  .drawer { position: fixed; top: 64px; right: 0; bottom: 0; width: 520px; background: #131917; border-left: 1px solid #232C28; display: flex; flex-direction: column; }
  .month-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #131917; border-top: 1px solid #232C28; border-bottom: 1px solid #232C28; font-family: Manrope, sans-serif; font-weight: 700; font-size: 14px; color: #5EE6B8; }
  .month-head span:last-child { font-family: Inter, sans-serif; font-size: 12px; }

  .stepdot { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .step-done .stepdot { background: #5EE6B8; color: #062A1F; }
  .step-current .stepdot { background: #0F3B2E; color: #5EE6B8; box-shadow: 0 0 0 2px #5EE6B8; }
  .step-next .stepdot { border: 1px solid #232C28; color: #5F6B65; }
  .wcard { border-radius: 24px; background: #131917; border: 1px solid #232C28; padding: 28px; display: flex; flex-direction: column; gap: 20px; }
  .typetile { flex: 1; border-radius: 16px; border: 1px solid #232C28; padding: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .typetile[aria-pressed="true"] { border-color: rgba(94,230,184,.6); background: #0F3B2E55; }
  .pick { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; border: 1px solid #232C28; font-size: 14px; }
  .pick[aria-pressed="true"] { border-color: rgba(94,230,184,.6); background: #0F3B2E; }
  .box { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid #5F6B65; display: grid; place-items: center; flex-shrink: 0; }
  .pick[aria-pressed="true"] .box { background: #5EE6B8; border-color: #5EE6B8; color: #062A1F; }
  .sub { display: inline-flex; align-items: center; gap: 2px; height: 26px; padding: 0 4px 0 10px; border-radius: 999px; background: #1A211E; font-size: 12px; }
</style>
</head>
<body>
<div class="min-h-screen bg-bg text-ink font-sans">

  <!-- App bar -->
  <header class="h-16 flex items-center gap-3 px-6 border-b border-line bg-card/80">
    <div class="w-8 h-8 rounded-[10px] bg-mint grid place-items-center text-[#00382B]">
      <iconify-icon icon="material-symbols:savings-outline" width="18"></iconify-icon>
    </div>
    <span class="font-display font-700 font-semibold">New Finance App</span>
  </header>

  <main class="max-w-[760px] mx-auto px-6 pt-16 pb-16 flex flex-col items-center gap-8 text-center">
    <div class="w-20 h-20 rounded-full bg-mint text-[#062A1F] grid place-items-center shadow-[0_0_0_10px_rgba(94,230,184,.12),0_0_0_22px_rgba(94,230,184,.06)]"><iconify-icon icon="material-symbols:check" width="44"></iconify-icon></div>
    <div><h1 class="font-display text-[34px] leading-10 font-extrabold tracking-tight">The Doe Family is ready</h1><p class="text-muted mt-2">Here's what you set up. Everything can be changed later.</p></div>
    <div class="grid grid-cols-3 gap-3 w-full text-left">
      <div class="rounded-2xl bg-card border border-line p-4 flex items-center gap-3"><span class="w-10 h-10 rounded-full bg-mint/15 text-mint grid place-items-center"><iconify-icon icon="material-symbols:account-balance-wallet-outline" width="20"></iconify-icon></span><div><div class="font-display text-xl font-extrabold num">1</div><div class="text-xs text-muted">account · 1 card</div></div></div>
      <div class="rounded-2xl bg-card border border-line p-4 flex items-center gap-3"><span class="w-10 h-10 rounded-full bg-sun/15 text-sun grid place-items-center"><iconify-icon icon="material-symbols:category-outline" width="20"></iconify-icon></span><div><div class="font-display text-xl font-extrabold num">6</div><div class="text-xs text-muted">categories</div></div></div>
      <div class="rounded-2xl bg-card border border-line p-4 flex items-center gap-3"><span class="w-10 h-10 rounded-full bg-sky/15 text-sky grid place-items-center"><iconify-icon icon="material-symbols:donut-large" width="20"></iconify-icon></span><div><div class="font-display text-xl font-extrabold num">2</div><div class="text-xs text-muted">budgets</div></div></div>
    </div>
    <div class="w-full text-left flex flex-col gap-2">
      <span class="cap">Next steps</span>
      <div class="grid grid-cols-3 gap-3">
        <button class="rounded-2xl bg-card border border-line p-4 flex items-start gap-3 text-left hover:border-mint/50"><iconify-icon icon="material-symbols:add-circle-outline" width="22" class="text-mint mt-0.5"></iconify-icon><div class="flex-1"><div class="text-sm font-semibold">Record a transaction</div><div class="text-xs text-muted mt-0.5">Start tracking where money goes</div></div><iconify-icon icon="material-symbols:arrow-forward" width="18" class="text-faint"></iconify-icon></button>
        <button class="rounded-2xl bg-card border border-line p-4 flex items-start gap-3 text-left hover:border-mint/50"><iconify-icon icon="material-symbols:person-add-outline" width="22" class="text-mint mt-0.5"></iconify-icon><div class="flex-1"><div class="text-sm font-semibold">Invite your household</div><div class="text-xs text-muted mt-0.5">Share accounts, budgets, and goals</div></div><iconify-icon icon="material-symbols:arrow-forward" width="18" class="text-faint"></iconify-icon></button>
        <button class="rounded-2xl bg-card border border-line p-4 flex items-start gap-3 text-left hover:border-mint/50"><iconify-icon icon="material-symbols:flag-outline" width="22" class="text-mint mt-0.5"></iconify-icon><div class="flex-1"><div class="text-sm font-semibold">Create a goal</div><div class="text-xs text-muted mt-0.5">Save toward something specific</div></div><iconify-icon icon="material-symbols:arrow-forward" width="18" class="text-faint"></iconify-icon></button>
      </div>
    </div>
    <button class="h-12 px-8 rounded-full bg-mint text-[#062A1F] font-semibold flex items-center gap-2 shadow-[0_6px_20px_-6px_rgba(94,230,184,.55)]">Go to Dashboard<iconify-icon icon="material-symbols:arrow-forward" width="18"></iconify-icon></button>
  </main></div>
</body>
</html>
