# Local development environment (OQ-88: v1 runs purely locally).
# Values come from the root .env — copy .env.example first.
name: financas

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      POSTGRES_DB: financas
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financas -d financas"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
