# Self-hosting (N10 S1, OQ-250): the LXC `financas` on Proxmox runs this.
# Values come from .env.production (copy .env.production.example); start with
#   docker compose -f compose.prod.yaml --env-file .env.production up -d --build
# Only Caddy publishes ports; the API and the database are reachable only on
# the internal network. Runbook: docs/operations/self-hosting.md.
name: financas

services:
  caddy:
    build: infra/caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.production}
      TLS_MODE: ${TLS_MODE:-cloudflare}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://financas_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD}@db:5432/financas
      DATABASE_MIGRATION_URL: postgres://financas:${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}@db:5432/financas
      WEB_APP_URL: ${WEB_APP_URL:?set WEB_APP_URL in .env.production}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.production}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in .env.production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The API restores audit entries from its log files on start (OQ-110).
      - ${LOG_HOST_DIR:-./logs}:/var/log/financas
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_DB: financas
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      # On the LXC: the encrypted dataset fastpool/financas-db, mounted as mp0.
      - ${DB_DATA_DIR:?set DB_DATA_DIR in .env.production}:/var/lib/postgresql
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financas -d financas"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  caddy-data:
  caddy-config:
